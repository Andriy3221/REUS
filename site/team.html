<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Profile | REUS</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: var(--text-color);
        }
        .team-header {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .team-title-area h1 {
            margin: 0 0 5px 0;
            font-size: 2.5rem;
        }
        .team-region {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        /* Акуратний блок трофеїв в рядок */
        .trophies-container {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .trophy-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a222f;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            height: 40px;
        }
        .trophy-img {
            height: 26px;
            width: auto;
            object-fit: contain;
        }
        /* Підказка при наведенні на трофей */
        .trophy-item:hover::after {
            content: attr(data-title);
            position: absolute;
            bottom: 115%;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            white-space: nowrap;
            border: 1px solid var(--border-color);
            z-index: 10;
            pointer-events: none;
        }
        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .section-box h3 {
            margin-top: 0;
            color: var(--text-color);
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(31, 41, 55, 0.5);
            font-size: 1.05rem;
        }
        .stats-row:last-child {
            border-bottom: none;
        }
        .stats-val {
            font-weight: bold;
            color: var(--accent-color);
        }
        /* Сітка гравців */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .player-card {
            background: #1a222f;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s;
        }
        .player-card:hover {
            border-color: var(--accent-color);
        }
        .player-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        .player-name {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <a href="index.html" class="back-link">← Назад до рейтингу</a>

        <div id="teamContainer">
            <p style="color: var(--text-muted);">Завантаження команди...</p>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        async function loadTeamPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const teamName = urlParams.get('name');

            if (!teamName) {
                document.getElementById('teamContainer').innerHTML = '<p style="color: #ff4444;">Команду не вказано.</p>';
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const data = result.record || {};
                const teams = data.teams || [];
                const players = data.players || [];
                const globalTrophies = data.trophies || [];

                const team = teams.find(t => t.name.toLowerCase() === teamName.toLowerCase());

                if (!team) {
                    document.getElementById('teamContainer').innerHTML = '<p style="color: #ff4444;">Команду не знайдено.</p>';
                    return;
                }

                // Генеруємо красиві іконки трофеїв із назвами при наведенні
                let trophiesHtml = '';
                if (team.trophies && Array.isArray(team.trophies) && team.trophies.length > 0) {
                    trophiesHtml = '<div class="trophies-container">';
                    team.trophies.forEach(iconUrl => {
                        const foundTr = globalTrophies.find(tr => tr.icon === iconUrl);
                        const title = foundTr ? foundTr.name : 'Трофей';
                        trophiesHtml += `
                            <div class="trophy-item" data-title="${title}">
                                <img src="${iconUrl}" class="trophy-img" alt="${title}" onerror="this.style.display='none'">
                            </div>
                        `;
                    });
                    trophiesHtml += '</div>';
                }

                // Гравці команди
                const teamPlayers = players.filter(p => p.team.toLowerCase() === team.name.toLowerCase());
                let playersHtml = '';
                if (teamPlayers.length === 0) {
                    playersHtml = '<p style="color: var(--text-muted); margin: 0;">У цій команді поки немає гравців.</p>';
                } else {
                    playersHtml = '<div class="players-grid">';
                    teamPlayers.forEach(p => {
                        const pPhoto = p.photo || 'https://via.placeholder.com/100';
                        playersHtml += `
                            <a href="player.html?name=${encodeURIComponent(p.name)}" class="player-card">
                                <img src="${pPhoto}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/100'">
                                <div class="player-name">${p.name}</div>
                            </a>
                        `;
                    });
                    playersHtml += '</div>';
                }

                document.getElementById('teamContainer').innerHTML = `
                    <div class="team-header">
                        <div class="team-title-area">
                            <h1>${team.name}</h1>
                            <div class="team-region">Europe</div>
                        </div>
                        <div>${trophiesHtml}</div>
                    </div>

                    <div class="section-box">
                        <h3>Склад команди</h3>
                        ${playersHtml}
                    </div>

                    <div class="section-box">
                        <h3>Статистика</h3>
                        <div class="stats-row"><span>Valve ranking</span><span class="stats-val">${team.valveRank || '#1'}</span></div>
                        <div class="stats-row"><span>World ranking</span><span class="stats-val">${team.worldRank || '#1'}</span></div>
                        <div class="stats-row"><span>Weeks in top30 for core</span><span class="stats-val">${team.weeksTop30 || '0'}</span></div>
                        <div class="stats-row"><span>Average player age</span><span class="stats-val">${team.avgAge || '20.0'}</span></div>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                document.getElementById('teamContainer').innerHTML = '<p style="color: #ff4444;">Помилка завантаження даних.</p>';
            }
        }

        loadTeamPage();
    </script>
</body>
</html>
