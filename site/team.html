<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профіль команди | REUS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .team-players-row {
            display: flex;
            gap: 12px;
            background: #131820;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            justify-content: flex-start;
            flex-wrap: wrap;
        }
        .player-card-mini {
            background: #1a222f;
            border-radius: 6px;
            width: 18%;
            min-width: 110px;
            text-align: center;
            padding: 10px;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .player-card-mini:hover {
            transform: translateY(-3px);
            border: 1px solid #00ff88;
        }
        .player-card-mini img {
            width: 100%;
            height: 130px;
            object-fit: contain;
            background: #111;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .player-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.95rem;
            font-weight: bold;
        }
        .team-profile-card {
            background: #131820;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .team-header-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .team-identity {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .team-logo-box {
            width: 60px;
            height: 60px;
            background: #1a222f;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #1f2937;
            overflow: hidden;
        }
        .team-logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .team-title-text h1 {
            margin: 0 0 5px 0;
            font-size: 1.8rem;
        }
        .team-region {
            color: #8a99ad;
            font-size: 0.9rem;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #1f2937;
            font-size: 0.95rem;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            color: #8a99ad;
        }
        .info-value {
            font-weight: bold;
            color: #fff;
        }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #8a99ad;
            text-decoration: none;
        }
        .back-link:hover {
            color: #00ff88;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Склад гравців цієї команди -->
        <div class="team-players-row" id="teamPlayersRow">
            <!-- Заповнюється через JS -->
        </div>

        <!-- Картка команди -->
        <div class="team-profile-card">
            <div class="team-header-main">
                <div class="team-identity">
                    <div class="team-logo-box">
                        <img id="teamLogo" src="Yami.jpg" alt="Team Logo">
                    </div>
                    <div class="team-title-text">
                        <h1 id="team-name">Yami Esports</h1>
                        <div class="team-region">🇪🇺 Europe</div>
                    </div>
                </div>
            </div>

            <div class="info-row">
                <span class="info-label">Valve ranking</span>
                <span class="info-value" id="valveRank" style="color: #00ff88;">#1</span>
            </div>
            <div class="info-row">
                <span class="info-label">World ranking</span>
                <span class="info-value" id="worldRank">#1</span>
            </div>
            <div class="info-row">
                <span class="info-label">Weeks in top30 for core</span>
                <span class="info-value">12</span>
            </div>
            <div class="info-row">
                <span class="info-label">Average player age</span>
                <span class="info-value">19.4</span>
            </div>
        </div>

        <a href="index.html" class="back-link">← Назад до рейтингу</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const teamName = urlParams.get('name') || 'Yami Esports';

        document.getElementById('team-name').innerText = teamName;

        // Завантажуємо інформацію про команду з бази
        const teams = JSON.parse(localStorage.getItem('reus_teams')) || [];
        const currentTeam = teams.find(t => t.name.toLowerCase() === teamName.toLowerCase());

        if (currentTeam) {
            document.getElementById('teamLogo').src = currentTeam.logo;
            document.getElementById('valveRank').innerText = currentTeam.valveRank || '#1';
            document.getElementById('worldRank').innerText = currentTeam.worldRank || '#1';
        }

        // Завантажуємо гравців цієї команди
        const players = JSON.parse(localStorage.getItem('reus_players')) || [];
        const teamPlayers = players.filter(p => p.team === teamName);

        const rowContainer = document.getElementById('teamPlayersRow');
        if (teamPlayers.length === 0) {
            rowContainer.innerHTML = '<p style="color: #8a99ad; margin: 0; text-align: center; width: 100%;">У цій команді немає активних гравців.</p>';
        } else {
            rowContainer.innerHTML = '';
            teamPlayers.forEach(p => {
                rowContainer.innerHTML += `
                    <a href="player.html?name=${encodeURIComponent(p.name)}&img=${encodeURIComponent(p.photo)}" class="player-card-mini">
                        <img src="${p.photo}" alt="${p.name}">
                        <div class="player-footer">
                            <svg width="18" height="12" viewBox="0 0 9 6" style="border-radius: 2px;"><rect width="9" height="3" fill="#005BBB"/><rect y="3" width="9" height="3" fill="#FFD500"/></svg>
                            ${p.name}
                        </div>
                    </a>
                `;
            });
        }
    </script>

</body>
</html>
