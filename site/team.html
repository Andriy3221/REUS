<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Команда | REUS</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --card-hover: #1a222f;
            --header-bg: #161c26;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
        }

        [data-theme="light"] {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --card-hover: #f0f2f5;
            --header-bg: #e9ecef;
            --border-color: #d1d5db;
            --accent-color: #00a859;
            --text-color: #111827;
            --text-muted: #6b7280;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-color);
        }

        .team-banner {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .team-logo-large {
            width: 70px;
            height: 70px;
            object-fit: contain;
            background: #000;
            border-radius: 8px;
            padding: 5px;
            box-sizing: border-box;
        }

        .team-title-box h1 {
            margin: 0 0 5px 0;
            font-size: 1.8rem;
        }

        .team-region {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: var(--text-color);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--text-muted);
        }

        .stat-value {
            font-weight: bold;
            color: var(--accent-color);
        }

        .players-grid {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .player-card {
            text-align: center;
            background: var(--card-hover);
            padding: 12px;
            border-radius: 6px;
            width: 140px;
            text-decoration: none;
            color: var(--text-color);
            border: 1px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
            box-sizing: border-box;
        }

        .player-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .player-card img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            background-color: #111;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .player-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .player-flag {
            width: 18px !important;
            height: 12px !important;
            object-fit: cover !important;
            border-radius: 2px !important;
        }

        .empty-msg {
            color: var(--text-muted);
            text-align: center;
            padding: 15px 0;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="main-container">
        <a href="index.html" class="back-link">← Назад до рейтингу</a>

        <div class="team-banner">
            <img id="teamLogo" src="" alt="" class="team-logo-large" style="display: none;">
            <div class="team-title-box">
                <h1 id="teamName">Завантаження...</h1>
                <div class="team-region" id="teamRegion">Europe</div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">Склад команди</div>
            <div id="playersList" class="players-grid">
                <div class="empty-msg">Завантаження гравців...</div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">Статистика</div>
            <div class="stat-row">
                <span class="stat-label">Valve ranking</span>
                <span class="stat-value" id="valveRank">#1</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">World ranking</span>
                <span class="stat-value" id="worldRank">#1</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Weeks in top30 for core</span>
                <span class="stat-value" id="weeksTop30">12</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Average player age</span>
                <span class="stat-value" id="avgAge">19.4</span>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        const savedTheme = localStorage.getItem('reus_theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);

        const urlParams = new URLSearchParams(window.location.search);
        const targetTeamName = urlParams.get('name');

        async function loadTeamData() {
            if (!targetTeamName) {
                document.getElementById('teamName').innerText = "Команду не знайдено";
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const data = result.record || {};
                
                const teams = data.teams || [];
                const players = data.players || [];

                const team = teams.find(t => t.name.toLowerCase() === targetTeamName.toLowerCase());

                if (team) {
                    document.getElementById('teamName').innerText = team.name;
                    document.getElementById('valveRank').innerText = team.valveRank || '#1';
                    document.getElementById('worldRank').innerText = team.worldRank || '#1';
                    document.getElementById('weeksTop30').innerText = team.weeksTop30 || '0';
                    document.getElementById('avgAge').innerText = team.avgAge || '20.0';
                    
                    const logoImg = document.getElementById('teamLogo');
                    if (team.logo && team.logo.trim() !== '') {
                        logoImg.src = team.logo;
                        logoImg.style.display = 'block';
                    } else {
                        logoImg.style.display = 'none';
                    }
                } else {
                    document.getElementById('teamName').innerText = targetTeamName;
                }

                const teamPlayers = players.filter(p => p.team.toLowerCase() === targetTeamName.toLowerCase());
                const playersContainer = document.getElementById('playersList');

                if (teamPlayers.length === 0) {
                    playersContainer.innerHTML = '<div class="empty-msg">У цій команді немає активних гравців.</div>';
                } else {
                    playersContainer.innerHTML = '';
                    teamPlayers.forEach(p => {
                        const countryCode = (p.country || 'ua').toLowerCase();
                        playersContainer.innerHTML += `
                            <a href="player.html?name=${encodeURIComponent(p.name)}&img=${encodeURIComponent(p.photo)}" class="player-card">
                                <img src="${p.photo}" alt="${p.name}" onerror="this.src='default_player.png'">
                                <div class="player-footer">
                                    <img src="https://flagcdn.com/w20/${countryCode}.png" alt="${countryCode}" class="player-flag">
                                    ${p.name}
                                </div>
                            </a>
                        `;
                    });
                }

            } catch (err) {
                console.error("Помилка завантаження даних команди:", err);
            }
        }

        loadTeamData();
    </script>
</body>
</html>
