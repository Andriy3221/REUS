<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Деталі команди</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(13, 17, 23, 0.85);
            --inner-card-bg: #111620;
            --border-color: #21262d;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8b949e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 30px;
        }
        .team-profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .team-big-logo {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: contain;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            padding: 5px;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }
        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--inner-card-bg);
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        .player-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .player-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Назад до рейтингу</a>
        <div id="team-content">Завантаження...</div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        async function loadTeamDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const teamName = urlParams.get('name');

            if (!teamName) {
                document.getElementById('team-content').innerHTML = 'Команду не вказано.';
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const cloudData = result.record?.record || result.record || result;
                const teams = cloudData.teams || [];
                const allPlayers = cloudData.players || [];

                const team = teams.find(t => (t.name || '').trim().toLowerCase() === teamName.trim().toLowerCase());

                if (!team) {
                    document.getElementById('team-content').innerHTML = 'Команду не знайдено.';
                    return;
                }

                const tLogo = team.logo || team.image || '';
                const tRating = team.points || team.rating || '0';
                const teamPlayers = allPlayers.filter(p => {
                    const pTeam = p.team || p.teamName || p.club || p.group || '';
                    return pTeam.trim().toLowerCase() === teamName.trim().toLowerCase();
                });

                let playersHtml = '';
                if (teamPlayers.length > 0) {
                    teamPlayers.forEach(p => {
                        const pName = p.name || p.nickname || 'Гравець';
                        const pPhoto = p.photo || p.avatar || 'https://via.placeholder.com/40';
                        const pRole = p.role || p.position || 'Гравець';
                        playersHtml += `
                            <div class="player-row">
                                <div class="player-left">
                                    <img src="${pPhoto}" class="player-img" alt="">
                                    <div>
                                        <div style="font-weight: bold; font-size: 1.05rem;">${pName}</div>
                                        <div style="color: var(--text-muted); font-size: 0.85rem;">Роль: ${pRole}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    playersHtml = '<div style="color: var(--text-muted);">У цій команді поки немає гравців.</div>';
                }

                document.getElementById('team-content').innerHTML = `
                    <div class="team-profile-header">
                        ${tLogo ? `<img src="${tLogo}" class="team-big-logo" alt="">` : ''}
                        <div>
                            <h1>${team.name}</h1>
                            <p style="color: var(--accent-color); font-weight: bold; margin: 0;">Рейтинг: ${tRating}</p>
                        </div>
                    </div>
                    <h3>Склад команди:</h3>
                    <div>${playersHtml}</div>
                `;

            } catch (err) {
                console.error(err);
                document.getElementById('team-content').innerHTML = 'Помилка завантаження даних команди.';
            }
        }

        loadTeamDetails();
    </script>
</body>
</html>
