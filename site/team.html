<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профіль команди | REUS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        /* Рядок гравців зверху */
        .team-players-row {
            display: flex;
            gap: 12px;
            background: #131820;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            justify-content: space-between;
        }
        .player-card-mini {
            background: #1a222f;
            border-radius: 6px;
            width: 18%;
            text-align: center;
            padding: 8px;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s;
        }
        .player-card-mini:hover {
            transform: translateY(-3px);
            border: 1px solid #00ff88;
        }
        .player-card-mini img {
            width: 100%;
            height: 90px;
            object-fit: contain;
            background: #111;
            border-radius: 4px;
            margin-bottom: 5px;
        }
        .player-card-name {
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* Основний блок інформації команди */
        .team-profile-card {
            background: #131820;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .team-header-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .team-identity {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .team-logo-box {
            width: 60px;
            height: 60px;
            background: #1a222f;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #1f2937;
        }
        .team-logo-box img {
            max-width: 45px;
            max-height: 45px;
            object-fit: contain;
        }
        .team-title-text h1 {
            margin: 0 0 5px 0;
            font-size: 1.8rem;
        }
        .team-region {
            color: #8a99ad;
            font-size: 0.9rem;
        }
        /* Кнопка соціальної мережі (Telegram) */
        .social-btn {
            background: #229ed9;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .social-btn:hover {
            opacity: 0.85;
        }
        .social-btn svg {
            width: 22px;
            height: 22px;
            fill: #fff;
        }

        /* Рядки статистики команди */
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #1f2937;
            font-size: 0.95rem;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            color: #8a99ad;
        }
        .info-value {
            font-weight: bold;
            color: #fff;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #8a99ad;
            text-decoration: none;
        }
        .back-link:hover {
            color: #00ff88;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Склад гравців зверху -->
        <div class="team-players-row">
            <a href="player.html?name=oz1k&img=player1.png" class="player-card-mini">
                <img src="player1.png" alt="oz1k">
                <div class="player-card-name">oz1k</div>
            </a>
            <a href="player.html?name=r1kizy&img=player2.png" class="player-card-mini">
                <img src="player2.png" alt="r1kizy">
                <div class="player-card-name">r1kizy</div>
            </a>
            <a href="player.html?name=Yokirito&img=player3.png" class="player-card-mini">
                <img src="player3.png" alt="Yokirito">
                <div class="player-card-name">Yokirito</div>
            </a>
            <a href="player.html?name=Fexum&img=player4.png" class="player-card-mini">
                <img src="player4.png" alt="Fexum">
                <div class="player-card-name">Fexum</div>
            </a>
            <a href="player.html?name=darkpr1nc9&img=player5.png" class="player-card-mini">
                <img src="player5.png" alt="darkpr1nc9">
                <div class="player-card-name">darkpr1nc9</div>
            </a>
        </div>

        <!-- Головна картка команди -->
        <div class="team-profile-card">
            <div class="team-header-main">
                <div class="team-identity">
                    <div class="team-logo-box">
                        <img id="team-logo" src="player1.png" alt="Logo">
                    </div>
                    <div class="team-title-text">
                        <h1 id="team-name">Yami Esports</h1>
                        <div class="team-region">🇪🇺 Europe</div>
                    </div>
                </div>

                <!-- Кнопка Telegram -->
                <a href="https://t.me/yami_esport" target="_blank" class="social-btn" title="Telegram">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.02-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.25.38-.51 1.08-.78 4.22-1.84 7.03-3.05 8.43-3.62 4.01-1.67 4.84-1.96 5.38-1.97.12 0 .39.03.56.17.15.12.19.28.21.4-.01.06.01.24 0 .38z"/>
                    </svg>
                </a>
            </div>

            <div class="info-row">
                <span class="info-label">Valve ranking</span>
                <span class="info-value" style="color: #00ff88;">#1</span>
            </div>
            <div class="info-row">
                <span class="info-label">World ranking</span>
                <span class="info-value">#1</span>
            </div>
            <div class="info-row">
                <span class="info-label">Weeks in top30 for core</span>
                <span class="info-value">12</span>
            </div>
            <div class="info-row">
                <span class="info-label">Average player age</span>
                <span class="info-value">19.4</span>
            </div>
        </div>

        <a href="index.html" class="back-link">← Назад до рейтингу</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const teamName = urlParams.get('name');
        if (teamName) {
            document.getElementById('team-name').innerText = teamName;
        }
    </script>

</body>
</html>
