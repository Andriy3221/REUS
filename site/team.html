<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Profile | REUS</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
            --danger-color: #ff4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .header-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 8px;
            background: #1a222f;
            padding: 5px;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 2.5rem;
        }
        .region {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0;
        }
        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--text-color);
        }
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .player-card {
            background: #1a222f;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .player-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #11161d;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid var(--border-color);
        }
        .player-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .player-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .player-role {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .retired-badge {
            background: rgba(255, 68, 68, 0.15);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
        }
        .flag-icon {
            width: 20px;
            height: 14px;
            object-fit: cover;
            border-radius: 2px;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
            vertical-align: middle;
        }
        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #1a222f;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .stat-name {
            color: var(--text-color);
        }
        .stat-value {
            color: var(--accent-color);
            font-weight: bold;
        }
        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="main-container" id="app">
        <div class="loading">Завантаження даних команди...</div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        // Отримуємо назву команди з URL (наприклад: team.html?name=YAMI)
        const urlParams = new URLSearchParams(window.location.search);
        const teamNameParam = urlParams.get('name') || 'YAMI'; // За замовчуванням YAMI, якщо не вказано

        async function fetchTeamData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const rawRecord = result.record || result;
                const cloudData = rawRecord.record || rawRecord;

                renderTeamPage(cloudData);
            } catch (err) {
                console.error(err);
                document.getElementById('app').innerHTML = '<div class="loading" style="color: var(--danger-color);">Помилка завантаження даних команди.</div>';
            }
        }

        function renderTeamPage(data) {
            const teams = data.teams || [];
            const players = data.players || [];

            // Шукаємо команду за назвою
            const team = teams.find(t => t.name.toLowerCase() === teamNameParam.toLowerCase()) || {
                name: teamNameParam,
                logo: '',
                valveRank: '0',
                worldRank: '0',
                weeksTop30: '0',
                avgAge: '0'
            };

            // Фільтруємо гравців цієї команди
            const teamPlayers = players.filter(p => p.team && p.team.toLowerCase() === team.name.toLowerCase());

            // Генерація HTML для гравців
            let playersHtml = '';
            if (teamPlayers.length === 0) {
                playersHtml = '<div style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 20px;">У цій команді поки немає гравців</div>';
            } else {
                teamPlayers.forEach(p => {
                    const flagImg = p.country ? `<img src="https://flagcdn.com/24x18/${p.country.toLowerCase()}.png" class="flag-icon" alt="${p.country}">` : '';
                    const defaultAvatar = `<svg width="40" height="40" fill="#8a99ad" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
                    const avatarContent = p.photo ? `<img src="${p.photo}" onerror="this.parentElement.innerHTML='${defaultAvatar.replace(/'/g, "\\'")}'">` : defaultAvatar;
                    
                    const retiredBlock = p.retired ? '<br><span class="retired-badge">RETIRED</span>' : '';

                    playersHtml += `
                        <div class="player-card">
                            <div class="player-avatar">
                                ${avatarContent}
                            </div>
                            <div class="player-name">
                                ${flagImg} <span>${p.name}</span>
                            </div>
                            <div class="player-role">${p.role || 'Гравець'}</div>
                            ${retiredBlock}
                        </div>
                    `;
                });
            }

            // Збираємо повний макет сторінки
            const html = `
                <div class="header-card">
                    <img src="${team.logo || 'https://via.placeholder.com/80'}" class="header-logo" onerror="this.style.display='none'">
                    <div>
                        <h1>${team.name}</h1>
                        <p class="region">Europe</p>
                    </div>
                </div>

                <div class="section-box">
                    <div class="section-title">Склад команди</div>
                    <div class="players-grid">
                        ${playersHtml}
                    </div>
                </div>

                <div class="section-box">
                    <div class="section-title">Статистика та рейтинги</div>
                    <div class="stats-list">
                        <div class="stat-row">
                            <span class="stat-name">Valve ranking</span>
                            <span class="stat-value">${team.valveRank || '0'}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-name">World ranking</span>
                            <span class="stat-value">${team.worldRank || '0'}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-name">Weeks in top30 for core</span>
                            <span class="stat-value">${team.weeksTop30 || '0'}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-name">Average player age</span>
                            <span class="stat-value">${team.avgAge || '0'}</span>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('app').innerHTML = html;
        }

        // Запуск при завантаженні
        fetchTeamData();
    </script>
</body>
</html>
