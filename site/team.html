<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Profile | Reus Championship ❄️</title>
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: rgba(12, 18, 32, 0.92);
            --inner-card-bg: #0f172a;
            --border-color: #1e293b;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
            opacity: 0;
            animation: pageFadeIn 0.7s ease-out forwards;
        }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
            filter: hue-rotate(180deg) brightness(0.35);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(10, 20, 38, 0.75) 0%, rgba(6, 9, 19, 0.96) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .back-link {
            color: var(--text-color);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            border-radius: 10px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
        }
        .back-link:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow);
            transform: translateY(-2px);
        }
        .back-link:active {
            transform: scale(0.96);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            animation: cardPop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes cardPop {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .team-header {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .team-logo {
            width: 90px;
            height: 90px;
            border-radius: 14px;
            background: var(--inner-card-bg);
            border: 2px solid var(--accent-color);
            object-fit: contain;
            padding: 8px;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: transform 0.3s ease;
        }
        .team-logo:hover {
            transform: scale(1.05);
        }

        h1 {
            color: var(--accent-color);
            margin: 0 0 5px 0;
            font-size: 2.2rem;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        h2 {
            color: var(--accent-color);
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-shadow: 0 0 8px var(--accent-glow);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .player-card {
            background: var(--inner-card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .player-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3);
        }
        .player-card:active {
            transform: scale(0.96);
        }

        .player-img-wrap {
            width: 100%;
            height: 160px;
            background: #080d1a;
            position: relative;
            overflow: hidden;
        }

        .player-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 15%;
            transform: scale(1.15);
            transition: transform 0.3s ease;
        }
        .player-card:hover .player-avatar {
            transform: scale(1.24);
        }

        .player-info-footer {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        .player-nickname {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-role {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .player-flag {
            width: 18px;
            height: 13px;
            border-radius: 2px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            display: inline-block;
            vertical-align: middle;
            margin-right: 4px;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="fon.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <div class="container">
        <a href="index.html" class="back-link">❄️ Назад до рейтингу</a>
        <div id="teamContent">
            <div style="color: var(--text-muted); text-align: center; padding: 40px;">Завантаження команди... ❄️</div>
        </div>
    </div>

    <script>
        const BIN_ID = '6ad23f85ac6210605a379839';
        const API_KEY = '$2a$10$CISi1TUb8cLEgZ8iI9GtYu3KSoj1MZ7tOvzPKHVwtbZfwRFIJlR7G';

        function getFlagUrl(flagValue) {
            if (!flagValue) return '';
            if (flagValue.startsWith('http') || flagValue.startsWith('/') || flagValue.startsWith('data:')) {
                return flagValue;
            }
            return `https://flagcdn.com/24x18/${flagValue.trim().toLowerCase()}.png`;
        }

        async function loadTeam() {
            const urlParams = new URLSearchParams(window.location.search);
            const teamName = urlParams.get('name');

            if (!teamName) {
                document.getElementById('teamContent').innerHTML = '<div style="color: var(--accent-color); text-align:center; padding:30px;">Команда не вказана у посиланні!</div>';
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                let cloudData = result.record?.record || result.record || result;

                const teams = cloudData.teams || [];
                const players = cloudData.players || [];
                const decodedName = decodeURIComponent(teamName).trim().toLowerCase();

                const team = teams.find(t => (t.name || '').trim().toLowerCase() === decodedName);

                if (!team) {
                    document.getElementById('teamContent').innerHTML = `<div style="color: var(--accent-color); text-align:center; padding:30px;">Команду "${decodeURIComponent(teamName)}" не знайдено в базі!</div>`;
                    return;
                }

                const tName = team.name || 'Команда';
                const tLogo = team.logo || 'https://via.placeholder.com/150';
                const tStatus = team.status || 'АКТИВНА';
                const tPoints = team.points !== undefined ? team.points : (team.rating || 0);

                const teamPlayers = players.filter(p => {
                    const pTeam = (p.team || p.teamName || p.club || p.group || '').trim().toLowerCase();
                    return pTeam === decodedName;
                });

                const mainPlayers = teamPlayers.filter(p => {
                    const r = (p.role || p.slot || '').toLowerCase();
                    return !r.includes('запасний') && !r.includes('bench') && !r.includes('тренер');
                });

                const benchPlayers = teamPlayers.filter(p => {
                    const r = (p.role || p.slot || '').toLowerCase();
                    return r.includes('запасний') || r.includes('bench') || r.includes('тренер');
                });

                let mainHtml = '';
                if (mainPlayers.length > 0) {
                    mainPlayers.forEach(p => {
                        mainHtml += renderPlayerCard(p);
                    });
                } else {
                    mainHtml = '<div style="color: var(--text-muted); font-size: 0.9rem;">Немає основних гравців</div>';
                }

                let benchHtml = '';
                if (benchPlayers.length > 0) {
                    benchPlayers.forEach(p => {
                        benchHtml += renderPlayerCard(p);
                    });
                } else {
                    benchHtml = '<div style="color: var(--text-muted); font-size: 0.9rem;">Немає запасних гравців</div>';
                }

                document.getElementById('teamContent').innerHTML = `
                    <div class="card">
                        <div class="team-header">
                            <img src="${tLogo}" class="team-logo" alt="${tName}">
                            <div>
                                <h1>${tName}</h1>
                                <div style="color: var(--text-muted); font-size: 0.95rem; text-transform: uppercase; font-weight: 600;">Статус: <b style="color: var(--accent-color);">${tStatus}</b> | Бали рейтингу: <b style="color: var(--accent-color);">${tPoints}</b></div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <h2>❄️ Основний склад</h2>
                        <div class="roster-grid">
                            ${mainHtml}
                        </div>
                    </div>

                    <div class="card">
                        <h2>⛄ Запасні / Тренери</h2>
                        <div class="roster-grid">
                            ${benchHtml}
                        </div>
                    </div>
                `;

            } catch (err) {
                console.error(err);
                document.getElementById('teamContent').innerHTML = '<div style="color: var(--accent-color); text-align:center; padding:30px;">Помилка завантаження даних команди.</div>';
            }
        }

        function renderPlayerCard(p) {
            const pName = p.name || p.nickname || 'Гравець';
            const pPhoto = p.photo || p.avatar || p.image || 'https://via.placeholder.com/150';
            const pRole = p.role || 'Rifler';
            const pFlag = getFlagUrl(p.flag || p.countryFlag || p.country || '');
            let flagHtml = pFlag ? `<img src="${pFlag}" class="player-flag" alt="flag">` : '';

            return `
                <a href="player.html?name=${encodeURIComponent(pName)}" class="player-card">
                    <div class="player-img-wrap">
                        <img src="${pPhoto}" class="player-avatar" alt="${pName}">
                    </div>
                    <div class="player-info-footer">
                        <div class="player-nickname">${flagHtml}${pName}</div>
                        <div class="player-role">${pRole}</div>
                    </div>
                </a>
            `;
        }

        loadTeam();
    </script>
</body>
</html>
