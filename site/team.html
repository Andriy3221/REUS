<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Profile | REUS</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(13, 17, 23, 0.88);
            --inner-card-bg: #111620;
            --border-color: #21262d;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8b949e;
            --danger-color: #ff4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            object-fit: cover;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 9, 14, 0.82);
            z-index: -1;
        }

        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s, transform 0.2s;
        }

        .back-link:hover {
            color: var(--accent-color);
            transform: translateX(-3px);
        }

        /* Шапка команди */
        .header-card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-color);
        }

        /* Кругла підложка логотипу кольору #CBD0CC із легким свіченням */
        .header-logo-wrap {
            width: 85px;
            height: 85px;
            background: #CBD0CC;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(203, 208, 204, 0.25);
        }

        .header-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 2.3rem;
            letter-spacing: 0.5px;
        }

        .region {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Секції */
        .section-box {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Гравці */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 15px;
        }

        .player-card {
            background: var(--inner-card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .player-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.12);
        }

        .player-avatar {
            width: 100%;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            background: #151b26;
            border-radius: 8px;
            overflow: hidden;
        }

        .player-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            transition: transform 0.3s;
        }

        .player-card:hover .player-avatar img {
            transform: scale(1.05);
        }

        .player-name {
            font-size: 1.05rem;
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .player-role {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .retired-badge {
            background: rgba(255, 68, 68, 0.15);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            margin-top: 4px;
        }

        .flag-icon {
            width: 18px;
            height: 13px;
            object-fit: cover;
            border-radius: 2px;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
            vertical-align: middle;
        }

        /* Статистика */
        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: var(--inner-card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
        }

        .stat-row:hover {
            border-color: rgba(0, 255, 136, 0.3);
        }

        .stat-name {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .stat-value {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.05rem;
        }

        /* Трофеї */
        .trophies-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .trophy-badge {
            background: var(--inner-card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-width: 120px;
            transition: border-color 0.2s, transform 0.2s;
        }

        .trophy-badge:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .trophy-icon {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline preload="auto" class="bg-video" id="bgVideo">
        <source src="fon.mp4" type="video/mp4">
        Ваш браузер не підтримує відео-фон.
    </video>
    <div class="bg-overlay"></div>

    <div class="main-container">
        <a href="index.html" class="back-link">← Назад до рейтингу</a>
        <div id="app">
            <div class="loading">Завантаження даних команди...</div>
        </div>
    </div>

    <script>
        const bgVideo = document.getElementById('bgVideo');
        if (bgVideo) {
            bgVideo.addEventListener('ended', function() {
                this.currentTime = 0;
                this.play();
            });
        }

        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        const urlParams = new URLSearchParams(window.location.search);
        const teamNameParam = urlParams.get('name') || '';

        async function fetchTeamData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const rawRecord = result.record || result;
                const cloudData = rawRecord.record || rawRecord;

                renderTeamPage(cloudData);
            } catch (err) {
                console.error(err);
                document.getElementById('app').innerHTML = '<div class="loading" style="color: var(--danger-color);">Помилка завантаження даних команди.</div>';
            }
        }

        function renderPlayerCard(p) {
            const flagImg = p.country ? `<img src="https://flagcdn.com/w20/${p.country.toLowerCase()}.png" class="flag-icon" alt="${p.country}">` : '';
            
            const defaultSvg = `<svg width="50" height="50" fill="#8a99ad" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
            
            const avatarContent = p.photo && p.photo.trim() !== '' 
                ? `<img src="${p.photo}" onerror="this.parentElement.innerHTML='${defaultSvg.replace(/"/g, '&quot;')}'">` 
                : defaultSvg;
            
            const retiredBlock = p.retired ? '<span class="retired-badge">RETIRED</span>' : '';

            return `
                <a href="player.html?name=${encodeURIComponent(p.name || p.nickname || '')}" class="player-card">
                    <div class="player-avatar">
                        ${avatarContent}
                    </div>
                    <div class="player-name">
                        ${flagImg} <span>${p.name || p.nickname || 'Гравець'}</span>
                    </div>
                    <div class="player-role">${p.role || 'Гравець'}</div>
                    ${retiredBlock}
                </a>
            `;
        }

        function renderTeamPage(data) {
            const teams = data.teams || [];
            const players = data.players || [];
            const trophies = data.trophies || [];

            if (!teamNameParam) {
                document.getElementById('app').innerHTML = '<div class="loading" style="color: var(--danger-color);">Команду не вказано у посиланні!</div>';
                return;
            }

            const team = teams.find(t => t.name.toLowerCase() === teamNameParam.toLowerCase()) || {
                name: teamNameParam,
                logo: '',
                valveRank: '0',
                worldRank: '0',
                weeksTop30: '0',
                avgAge: '0'
            };

            const teamPlayers = players.filter(p => p.team && p.team.trim().toLowerCase() === team.name.trim().toLowerCase());

            const mainRoster = teamPlayers.filter(p => !p.roleSlot || p.roleSlot === 'main');
            const benchRoster = teamPlayers.filter(p => p.roleSlot === 'bench');
            const coachRoster = teamPlayers.filter(p => p.roleSlot === 'coach');

            let mainHtml = '';
            if (mainRoster.length === 0) {
                mainHtml = '<div style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 10px;">Основний склад порожній</div>';
            } else {
                mainRoster.forEach(p => { mainHtml += renderPlayerCard(p); });
            }

            let benchHtml = '';
            if (benchRoster.length > 0) {
                let cards = '';
                benchRoster.forEach(p => { cards += renderPlayerCard(p); });
                benchHtml = `
                    <div class="section-box">
                        <div class="section-title">Запасні гравці (Bench)</div>
                        <div class="players-grid">${cards}</div>
                    </div>
                `;
            }

            let coachHtml = '';
            if (coachRoster.length > 0) {
                let cards = '';
                coachRoster.forEach(p => { cards += renderPlayerCard(p); });
                coachHtml = `
                    <div class="section-box">
                        <div class="section-title">Тренерський штаб (Coach)</div>
                        <div class="players-grid">${cards}</div>
                    </div>
                `;
            }

            const teamTrophies = trophies.filter(tr => tr.team && tr.team.trim().toLowerCase() === team.name.trim().toLowerCase());
            let trophiesHtml = '';
            if (teamTrophies.length > 0) {
                let tCards = '';
                teamTrophies.forEach(tr => {
                    const isImg = tr.icon && (tr.icon.startsWith('http') || tr.icon.startsWith('data:'));
                    const iconEl = isImg ? `<img src="${tr.icon}" class="trophy-icon" onerror="this.style.display='none'">` : `<span class="trophy-icon" style="font-size: 2rem; display: flex; align-items: center; justify-content: center;">${tr.icon || '🏆'}</span>`;
                    tCards += `
                        <div class="trophy-badge">
                            ${iconEl}
                            <div style="font-size: 0.9rem; color: var(--text-color); font-weight: 500;">${tr.name}</div>
                        </div>
                    `;
                });
                trophiesHtml = `
                    <div class="section-box">
                        <div class="section-title">Трофеї команди</div>
                        <div class="trophies-container">${tCards}</div>
                    </div>
                `;
            }

            const html = `
                <div class="header-card">
                    <div class="header-logo-wrap">
                        <img src="${team.logo || 'https://via.placeholder.com/50'}" class="header-logo" onerror="this.style.display='none'">
                    </div>
                    <div>
                        <h1>${team.name}</h1>
                        <p class="region">${team.region || 'Європа'}</p>
                    </div>
                </div>

                <div class="section-box">
                    <div class="section-title">Склад команди</div>
                    <div class="players-grid">
                        ${mainHtml}
                    </div>
                </div>

                ${benchHtml}
                ${coachHtml}
                ${trophiesHtml}

                <div class="section-box">
                    <div class="section-title">Статистика та рейтинги</div>
                    <div class="stats-list">
                        <div class="stat-row">
                            <span class="stat-name">Valve ranking</span>
                            <span class="stat-value">${team.valveRank || '0'}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-name">World ranking</span>
                            <span class="stat-value">${team.worldRank || '0'}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-name">Weeks in top30 for core</span>
                            <span class="stat-value">${team.weeksTop30 || '0'}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-name">Average player age</span>
                            <span class="stat-value">${team.avgAge || '0'}</span>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('app').innerHTML = html;
        }

        fetchTeamData();
    </script>
</body>
</html>
