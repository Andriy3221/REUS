<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Profile | REUS</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: var(--text-color);
        }
        .team-header {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
        }
        .team-title-area h1 {
            margin: 0 0 5px 0;
            font-size: 2.5rem;
        }
        .team-region {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* ТРОФЕЇ З ВЕЛИКИМИ ЗАОКРУГЛЕНИМИ КАРТИНКАМИ ТА НУМЕРАЦІЄЮ */
        .trophies-section {
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
        .trophies-section h3 {
            margin: 0 0 15px 0;
            color: var(--accent-color);
            font-size: 1rem;
            letter-spacing: 0.5px;
        }
        .trophies-scroll-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 5px 15px 5px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-color) var(--border-color);
        }
        .trophies-scroll-container::-webkit-scrollbar {
            height: 8px;
        }
        .trophies-scroll-container::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 4px;
        }
        .trophy-card-vertical {
            position: relative;
            background: #171f2d;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px 15px 15px 15px;
            min-width: 150px;
            max-width: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-shrink: 0;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .trophy-card-vertical:hover {
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(0,255,136,0.15);
        }
        .trophy-number {
            position: absolute;
            top: 10px;
            left: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 7px;
            border-radius: 10px;
        }
        .trophy-card-vertical img {
            width: 95px;
            height: 95px;
            object-fit: cover;
            border-radius: 14px;
            margin-top: 10px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            background: #0f141d;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .trophy-emoji {
            font-size: 3.5rem;
            margin-top: 10px;
            margin-bottom: 12px;
            line-height: 1;
        }
        .trophy-name-vertical {
            font-size: 0.9rem;
            color: var(--text-color);
            font-weight: 600;
            word-break: break-word;
            line-height: 1.3;
        }

        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .section-box h3 {
            margin-top: 0;
            color: var(--text-color);
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(31, 41, 55, 0.5);
            font-size: 1.05rem;
        }
        .stats-row:last-child {
            border-bottom: none;
        }
        .stats-val {
            font-weight: bold;
            color: var(--accent-color);
        }
        /* Сітка гравців */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .player-card {
            background: #171f2d;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
        }
        .player-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-3px);
        }
        .player-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        .player-name {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <a href="index.html" class="back-link">← Назад до рейтингу</a>

        <div id="teamContainer">
            <p style="color: var(--text-muted);">Завантаження команди...</p>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        async function loadTeamPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const teamName = urlParams.get('name');

            if (!teamName) {
                document.getElementById('teamContainer').innerHTML = '<p style="color: #ff4444;">Команду не вказано.</p>';
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const data = result.record || {};
                const teams = data.teams || [];
                const players = data.players || [];
                const allTrophies = data.trophies || [];

                const team = teams.find(t => t.name.toLowerCase() === teamName.toLowerCase());

                if (!team) {
                    document.getElementById('teamContainer').innerHTML = '<p style="color: #ff4444;">Команду не знайдено.</p>';
                    return;
                }

                const teamTrophies = allTrophies.filter(tr => tr.team && tr.team.toLowerCase() === team.name.toLowerCase());
                
                let trophiesHtml = '';
                if (teamTrophies.length > 0) {
                    let cards = '';
                    teamTrophies.forEach((tr, index) => {
                        let iconMarkup = '';
                        if (tr.icon && tr.icon.startsWith('http')) {
                            iconMarkup = `<img src="${tr.icon}" alt="${tr.name}" onerror="this.style.display='none'">`;
                        } else {
                            iconMarkup = `<div class="trophy-emoji">${tr.icon || '🏆'}</div>`;
                        }

                        cards += `
                            <div class="trophy-card-vertical">
                                <div class="trophy-number">#${index + 1}</div>
                                ${iconMarkup}
                                <div class="trophy-name-vertical">${tr.name}</div>
                            </div>
                        `;
                    });
                    trophiesHtml = `
                        <div class="trophies-section">
                            <h3>ДОСЯГНЕННЯ ТА ТРОФЕЇ КОМАНДИ</h3>
                            <div class="trophies-scroll-container">${cards}</div>
                        </div>
                    `;
                }

                const teamPlayers = players.filter(p => p.team && p.team.toLowerCase() === team.name.toLowerCase());
                let playersHtml = '';
                if (teamPlayers.length === 0) {
                    playersHtml = '<p style="color: var(--text-muted); margin: 0;">У цій команді поки немає гравців.</p>';
                } else {
                    playersHtml = '<div class="players-grid">';
                    teamPlayers.forEach(p => {
                        const pPhoto = p.photo || 'https://via.placeholder.com/100';
                        playersHtml += `
                            <a href="player.html?name=${encodeURIComponent(p.name)}" class="player-card">
                                <img src="${pPhoto}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/100'">
                                <div class="player-name">${p.name}</div>
                            </a>
                        `;
                    });
                    playersHtml += '</div>';
                }

                // Повертаємо виведення всіх рейтингів та статистики назад!
                document.getElementById('teamContainer').innerHTML = `
                    <div class="team-header">
                        <div class="team-title-area">
                            <h1>${team.name}</h1>
                            <div class="team-region">Europe</div>
                        </div>
                        ${trophiesHtml}
                    </div>

                    <div class="section-box">
                        <h3>Склад команди</h3>
                        ${playersHtml}
                    </div>

                    <div class="section-box">
                        <h3>Статистика та рейтинги</h3>
                        <div class="stats-row"><span>Valve ranking</span><span class="stats-val">${team.valveRank || '#1'}</span></div>
                        <div class="stats-row"><span>World ranking</span><span class="stats-val">${team.worldRank || '#1'}</span></div>
                        <div class="stats-row"><span>Weeks in top30 for core</span><span class="stats-val">${team.weeksTop30 || '0'}</span></div>
                        <div class="stats-row"><span>Average player age</span><span class="stats-val">${team.avgAge || '20.0'}</span></div>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                document.getElementById('teamContainer').innerHTML = '<p style="color: #ff4444;">Помилка завантаження даних.</p>';
            }
        }

        loadTeamPage();
    </script>
</body>
</html>
