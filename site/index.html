<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter-Strike World ranking | REUS</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .search-bar {
            width: 100%;
            padding: 12px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        .content-layout {
            display: flex;
            gap: 25px;
        }
        .left-column {
            flex: 1;
        }
        .right-column {
            width: 320px;
        }
        h2 {
            font-size: 1.4rem;
            margin-bottom: 15px;
        }
        .team-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .team-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161c26;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .team-header:hover {
            background: #1a222f;
        }
        .team-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        /* Назва команди всередині шапки як посилання на профіль команди */
        .team-name-link {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-color);
            text-decoration: none;
        }
        .team-name-link:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }
        
        /* Випадаючий блок гравців */
        .team-players {
            display: none; /* Згорнуто за замовчуванням */
            padding: 20px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            gap: 15px;
            justify-content: space-between;
        }
        .team-players.active {
            display: flex; /* Розгорнуто */
        }

        .player-box {
            text-align: center;
            background: #1a222f;
            padding: 10px;
            border-radius: 6px;
            width: 18%;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.2s;
        }
        .player-box:hover {
            transform: translateY(-3px);
            border: 1px solid var(--accent-color);
        }
        .player-box img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            background-color: #111;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .player-name {
            font-size: 0.9rem;
            font-weight: bold;
        }
        .transfers-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }
        .transfers-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .transfer-item {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .transfer-item strong {
            color: var(--text-color);
        }
        .admin-link {
            display: inline-block;
            margin-top: 30px;
            color: var(--text-muted);
            text-decoration: none;
        }
        .admin-link:hover {
            color: var(--accent-color);
        }
        .arrow-icon {
            transition: transform 0.3s;
        }
        .team-card.open .arrow-icon {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <input type="text" class="search-bar" placeholder="Search players, teams...">

        <h2 style="color: #fff;">Counter-Strike World ranking</h2>

        <div class="content-layout">
            <div class="left-column">
                <div class="team-card" id="team1">
                    <!-- Шапка команди: клік сюди згортає/розгортає гравців -->
                    <div class="team-header" onclick="toggleTeam('team1')">
                        <div class="team-info">
                            <span style="color: var(--text-muted); font-weight: bold;">#1</span>
                            <!-- Клік на саму назву перекидає на сторінку команди, використовуючи stopPropagation, щоб не спрацьовувало згортання -->
                            <a href="team.html?name=Yami%20Esports" class="team-name-link" onclick="event.stopPropagation()">Yami Esports</a>
                        </div>
                        <div style="color: var(--text-muted);">
                            1000 pts <span class="arrow-icon" style="display:inline-block;">▾</span>
                        </div>
                    </div>
                    
                    <!-- Склад гравців (згортається/розгортається) -->
                    <div class="team-players" id="team1-players">
                        <a href="player.html?name=oz1k&img=player1.png" class="player-box">
                            <img src="player1.png" alt="oz1k">
                            <div class="player-name">oz1k</div>
                        </a>
                        <a href="player.html?name=r1kizy&img=player2.png" class="player-box">
                            <img src="player2.png" alt="r1kizy">
                            <div class="player-name">r1kizy</div>
                        </a>
                        <a href="player.html?name=Yokirito&img=player3.png" class="player-box">
                            <img src="player3.png" alt="Yokirito">
                            <div class="player-name">Yokirito</div>
                        </a>
                        <a href="player.html?name=Fexum&img=player4.png" class="player-box">
                            <img src="player4.png" alt="Fexum">
                            <div class="player-name">Fexum</div>
                        </a>
                        <a href="player.html?name=darkpr1nc9&img=player5.png" class="player-box">
                            <img src="player5.png" alt="darkpr1nc9">
                            <div class="player-name">darkpr1nc9</div>
                        </a>
                    </div>
                </div>
            </div>

            <div class="right-column">
                <div class="transfers-box">
                    <div class="transfers-title">⚡ Top Transfers</div>
                    <div class="transfer-item">
                        [2026-08-23] Гравця <strong>oz1k</strong> переведено із <em>Free Agent</em> у <strong>Yami Esports</strong>.
                    </div>
                </div>
            </div>
        </div>

        <a href="admin.html" class="admin-link">Панель адміністратора ⚙️</a>
    </div>

    <script>
        function toggleTeam(teamId) {
            const card = document.getElementById(teamId);
            const players = document.getElementById(teamId + '-players');
            
            card.classList.toggle('open');
            players.classList.toggle('active');
        }
    </script>

</body>
</html>
