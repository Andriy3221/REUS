<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reus Championship | Рейтинг</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
            --discord-color: #5865F2;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .nav-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-area img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        .logo-area span {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .toggle-btns {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: #1a222f;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        .btn.active, .btn:hover {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }
        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-transform: uppercase;
        }
        .ranking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #1a222f;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .ranking-item:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        .item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .item-rank {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-muted);
            width: 30px;
        }
        .item-logo {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }
        .item-name {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .item-points {
            color: var(--accent-color);
            font-weight: bold;
        }
        .footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }

        /* Фіксовані кнопки справа знизу */
        .fixed-buttons-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-end;
            z-index: 100;
        }

        /* Кнопка техпідтримки Discord */
        .discord-support-btn {
            background: var(--card-bg);
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }
        .discord-support-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--discord-color);
            transition: transform 0.3s ease;
        }
        .discord-support-btn:hover {
            background: var(--discord-color);
            border-color: var(--discord-color);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.4);
        }
        .discord-support-btn:hover svg {
            fill: #fff;
            transform: scale(1.1);
        }

        /* Стрілочка вгору */
        #scrollTopBtn {
            background: var(--card-bg);
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        #scrollTopBtn.show {
            opacity: 1;
            visibility: visible;
        }
        #scrollTopBtn:hover {
            background: var(--accent-color);
            color: #0b0e14;
            border-color: var(--accent-color);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.3);
        }
        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Шапка сайту -->
        <div class="nav-bar">
            <div class="logo-area">
                <img src="REUS.png" alt="Logo" onerror="this.style.display='none'">
                <span>Reus Championship</span>
            </div>
            <div class="toggle-btns">
                <button class="btn active">Рейтинг команд</button>
            </div>
        </div>

        <!-- Список команд -->
        <div class="section-box">
            <div class="section-title">Рейтинг команд (Team Ranking)</div>
            <div id="teams-ranking-list">
                <div class="loading">Завантаження рейтингу...</div>
            </div>
        </div>

        <!-- Підвал сайту -->
        <div class="footer">
            <div>Reus Championship &copy; 2026. Усі права захищено.</div>
        </div>
    </div>

    <!-- Блок плаваючих кнопок справа знизу -->
    <div class="fixed-buttons-container">
        <!-- Кнопка технічної підтримки з логотипом Discord -->
        <a href="https://discord.gg/wJ8qM8g8AC" target="_blank" class="discord-support-btn">
            <svg viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.15c2.64-27.41-4.51-51.4-19.06-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.45-12.72S96.14,46,96.12,53,91,65.69,84.69,65.69Z"/>
            </svg>
            Тех підтримка
        </a>
        <!-- Стрілочка вгору -->
        <div id="scrollTopBtn" onclick="scrollToTop()">▲</div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        async function fetchRanking() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const rawRecord = result.record || result;
                const cloudData = rawRecord.record || rawRecord;

                const teams = cloudData.teams || [];
                const container = document.getElementById('teams-ranking-list');

                if (teams.length === 0) {
                    container.innerHTML = '<div style="color: var(--text-muted);">Команд поки немає в базі</div>';
                    return;
                }

                teams.sort((a, b) => (b.points || 0) - (a.points || 0));

                let html = '';
                teams.forEach((t, index) => {
                    html += `
                        <div class="ranking-item" onclick="window.location.href='team.html?name=${encodeURIComponent(t.name)}'">
                            <div class="item-info">
                                <span class="item-rank">#${index + 1}</span>
                                <img src="${t.logo || 'https://via.placeholder.com/35'}" class="item-logo" onerror="this.style.display='none'">
                                <span class="item-name">${t.name}</span>
                            </div>
                            <div class="item-points">
                                <span style="font-size: 0.75rem; color: var(--text-muted); display: block; text-align: right; text-transform: uppercase;">Points</span>
                                ${t.points || 0}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                document.getElementById('teams-ranking-list').innerHTML = '<div style="color: #ff4444; text-align: center;">Помилка завантаження рейтингу.</div>';
            }
        }

        const scrollTopBtn = document.getElementById('scrollTopBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                scrollTopBtn.classList.add('show');
            } else {
                scrollTopBtn.classList.remove('show');
            }
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        fetchRanking();
    </script>
</body>
</html>
