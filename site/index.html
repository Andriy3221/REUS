<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reus Championship Teams | REUS</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --card-hover: #1a222f;
            --header-bg: #161c26;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
        }

        [data-theme="light"] {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --card-hover: #f0f2f5;
            --header-bg: #e9ecef;
            --border-color: #d1d5db;
            --accent-color: #00a859;
            --text-color: #111827;
            --text-muted: #6b7280;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 15px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: background 0.3s, border-color 0.3s;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .site-logo {
            height: 40px;
            width: auto;
            max-width: 140px;
            object-fit: contain;
            border-radius: 6px;
            filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.4));
        }
        .site-title {
            margin: 0;
            font-size: 1.4rem;
            color: var(--text-color);
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .theme-toggle-btn {
            background: var(--card-hover);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, border-color 0.2s;
        }
        .theme-toggle-btn:hover {
            border-color: var(--accent-color);
        }

        .search-bar {
            width: 100%;
            padding: 12px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            margin-bottom: 25px;
            box-sizing: border-box;
            transition: border-color 0.2s, background 0.3s, color 0.3s;
        }
        .search-bar:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        .content-layout {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        .left-column {
            flex: 1;
            min-width: 300px;
        }
        .right-column {
            width: 320px;
        }
        .team-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: background 0.3s, border-color 0.3s;
        }
        .team-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .team-header:hover {
            background: var(--card-hover);
        }
        .team-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .team-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
            border-radius: 4px;
            background: #000;
        }
        .team-name-link {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-color);
            text-decoration: none;
        }
        .team-name-link:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }
        .team-players {
            display: none;
            padding: 20px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            gap: 15px;
            justify-content: flex-start;
            flex-wrap: wrap;
        }
        .team-card.open .team-players {
            display: flex;
        }
        .player-box {
            text-align: center;
            background: var(--card-hover);
            padding: 10px;
            border-radius: 6px;
            width: 18%;
            min-width: 110px;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.2s, border-color 0.2s, background 0.3s;
            box-sizing: border-box;
            border: 1px solid transparent;
        }
        .player-box:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }
        .player-box img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            background-color: #111;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .player-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .transfers-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            transition: background 0.3s, border-color 0.3s;
        }
        .transfers-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .transfer-item {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.4;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }
        .transfer-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .arrow-icon {
            transition: transform 0.3s;
            display: inline-block;
        }
        .team-card.open .arrow-icon {
            transform: rotate(180deg);
        }
        .loading {
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="main-container">
        <header class="site-header">
            <div class="header-left">
                <img src="REUS.png" alt="REUS Logo" class="site-logo" onerror="this.style.display='none'">
                <h1 class="site-title">Reus Championship Teams</h1>
            </div>
            <button class="theme-toggle-btn" onclick="toggleTheme()">
                <span id="themeIcon">☀️</span> <span id="themeText">Світла тема</span>
            </button>
        </header>

        <input type="text" id="searchInput" class="search-bar" placeholder="Пошук команд або гравців..." oninput="filterRanking()">

        <div class="content-layout">
            <div class="left-column" id="teamsContainer">
                <div class="loading">Завантаження з хмари...</div>
            </div>

            <div class="right-column">
                <div class="transfers-box">
                    <div class="transfers-title">⚡ Top Transfers</div>
                    <div id="transfersListContainer">
                        <div class="transfer-item">Завантаження...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');

            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                localStorage.setItem('reus_theme', 'light');
                themeIcon.innerText = '🌙';
                themeText.innerText = 'Темна тема';
            } else {
                body.setAttribute('data-theme', 'dark');
                localStorage.setItem('reus_theme', 'dark');
                themeIcon.innerText = '☀️';
                themeText.innerText = 'Світла тема';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('reus_theme') || 'dark';
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');

            body.setAttribute('data-theme', savedTheme);
            if (savedTheme === 'light') {
                themeIcon.innerText = '🌙';
                themeText.innerText = 'Темна тема';
            } else {
                themeIcon.innerText = '☀️';
                themeText.innerText = 'Світла тема';
            }
        });

        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        async function loadCloudData() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: {
                        'X-Master-Key': API_KEY
                    }
                });
                const result = await response.json();
                const data = result.record || {};
                
                renderIndexTeams(data.teams || [], data.players || []);
                renderTransfers(data.transfers || []);
            } catch (error) {
                console.error("Помилка завантаження:", error);
                document.getElementById('teamsContainer').innerHTML = '<div class="loading" style="color: #ff4444;">Помилка підключення до бази даних.</div>';
            }
        }

        function renderTransfers(transfers) {
            const container = document.getElementById('transfersListContainer');
            if (!transfers || transfers.length === 0) {
                container.innerHTML = '<div class="transfer-item">Трансфери поки відсутні.</div>';
                return;
            }

            container.innerHTML = '';
            transfers.forEach(tr => {
                container.innerHTML += `<div class="transfer-item">${tr}</div>`;
            });
        }

        function renderIndexTeams(teams, players) {
            const container = document.getElementById('teamsContainer');

            if (!teams || teams.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Немає команд у рейтингу. Додайте їх через адмін-панель.</p>';
                return;
            }

            container.innerHTML = '';
            teams.forEach((t, index) => {
                const teamId = 'team_' + index;
                const teamPlayers = (players || []).filter(p => p.team === t.name);

                let playersHtml = '';
                if (teamPlayers.length === 0) {
                    playersHtml = '<p style="color: var(--text-muted); width: 100%; text-align: center; margin: 0;">У цій команді поки немає гравців</p>';
                } else {
                    teamPlayers.forEach(p => {
                        playersHtml += `
                            <a href="player.html?name=${encodeURIComponent(p.name)}&img=${encodeURIComponent(p.photo)}" class="player-box">
                                <img src="${p.photo}" alt="${p.name}" onerror="this.src='default_player.png'">
                                <div class="player-footer">
                                    <svg width="16" height="11" viewBox="0 0 9 6" style="border-radius: 2px;"><rect width="9" height="3" fill="#005BBB"/><rect y="3" width="9" height="3" fill="#FFD500"/></svg>
                                    ${p.name}
                                </div>
                            </a>
                        `;
                    });
                }

                container.innerHTML += `
                    <div class="team-card" id="${teamId}" data-team-name="${t.name.toLowerCase()}">
                        <div class="team-header" onclick="toggleTeam('${teamId}')">
                            <div class="team-info">
                                <span style="color: var(--text-muted); font-weight: bold; min-width: 25px;">${t.valveRank || '#1'}</span>
                                <img src="${t.logo}" alt="${t.name}" class="team-logo" onerror="this.style.display='none'">
                                <a href="team.html?name=${encodeURIComponent(t.name)}" class="team-name-link" onclick="event.stopPropagation()">${t.name}</a>
                            </div>
                            <div style="color: var(--text-muted);">
                                <span class="arrow-icon">▾</span>
                            </div>
                        </div>
                        <div class="team-players">
                            ${playersHtml}
                        </div>
                    </div>
                `;
            });
        }

        function toggleTeam(teamId) {
            const card = document.getElementById(teamId);
            card.classList.toggle('open');
        }

        function filterRanking() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.team-card');

            cards.forEach(card => {
                const teamName = card.getAttribute('data-team-name');
                if (teamName.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        loadCloudData();
    </script>

</body>
</html>
