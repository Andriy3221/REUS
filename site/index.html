<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reus Championship | Рейтинг</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
            --discord-color: #5865F2;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .nav-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-area img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        .logo-area span {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-transform: uppercase;
        }
        .ranking-item {
            background: #1a222f;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            cursor: pointer;
            transition: border-color 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .ranking-item:hover {
            border-color: var(--accent-color);
        }
        .item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .item-rank {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-muted);
            width: 30px;
        }
        .item-logo {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }
        .item-name {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .item-points {
            color: var(--accent-color);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="nav-bar">
            <div class="logo-area">
                <img src="REUS.png" alt="Logo" onerror="this.style.display='none'">
                <span>Reus Championship</span>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">Рейтинг команд (Team Ranking)</div>
            <div id="teams-ranking-list">
                <div class="loading">Завантаження рейтингу...</div>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        async function fetchRanking() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const baseData = result.record || result;
                const cloudData = baseData.record || baseData;
                
                const teams = cloudData.teams || [];
                const container = document.getElementById('teams-ranking-list');

                if (teams.length === 0) {
                    container.innerHTML = '<div style="color: var(--text-muted);">Команд поки немає в базі</div>';
                    return;
                }

                teams.sort((a, b) => (Number(b.points) || 0) - (Number(a.points) || 0));

                let html = '';
                teams.forEach((t, index) => {
                    html += `
                        <a href="team.html?name=${encodeURIComponent(t.name)}" class="ranking-item">
                            <div class="item-info">
                                <span class="item-rank">#${index + 1}</span>
                                <img src="${t.logo || 'https://via.placeholder.com/35'}" class="item-logo" onerror="this.style.display='none'">
                                <span class="item-name">${t.name}</span>
                            </div>
                            <div class="item-points">
                                🏆 ${t.points || 0}
                            </div>
                        </a>
                    `;
                });

                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                document.getElementById('teams-ranking-list').innerHTML = '<div style="color: #ff4444; text-align: center;">Помилка завантаження рейтингу.</div>';
            }
        }

        fetchRanking();
    </script>
</body>
</html>
