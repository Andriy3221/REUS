<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reus Championship Teams</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
            --danger-color: #ff4444;
            --hover-border: #2d3748;
            --mini-card-bg: #1a222f;
        }

        [data-theme="light"] {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --accent-color: #00b359;
            --text-color: #1a202c;
            --text-muted: #718096;
            --danger-color: #e53e3e;
            --hover-border: #cbd5e0;
            --mini-card-bg: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .main-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Навігаційна шапка */
        .navbar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.35rem;
            font-weight: bold;
        }

        .logo-img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--mini-card-bg);
        }

        /* Кнопка перемикання теми */
        .theme-toggle-btn {
            background: var(--mini-card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: border-color 0.2s, background-color 0.3s;
        }

        .theme-toggle-btn:hover {
            border-color: var(--accent-color);
        }

        /* Пошук */
        .search-box {
            width: 100%;
            padding: 14px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 1rem;
            margin-bottom: 25px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, background-color 0.3s, color 0.3s;
        }

        .search-box:focus {
            border-color: var(--accent-color);
        }

        /* Заголовки секцій */
        .section-header-title {
            font-size: 1.3rem;
            color: var(--accent-color);
            margin: 30px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
        }

        .unranked-section-title {
            color: var(--text-muted);
            border-bottom-color: var(--border-color);
        }

        /* Картки команд */
        .team-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: border-color 0.2s, background-color 0.3s;
        }

        .team-card:hover {
            border-color: var(--hover-border);
        }

        .team-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .team-title-area {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex-grow: 1;
        }

        .team-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            background: var(--mini-card-bg);
            border-radius: 4px;
            padding: 2px;
        }

        .team-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .team-points {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-left: 15px;
        }

        .rank-number {
            color: #f39c12;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .unranked-badge-text {
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.95rem;
        }

        .collapse-arrow {
            margin-left: 15px;
            cursor: pointer;
            color: var(--text-muted);
            transition: transform 0.3s ease, color 0.2s;
            display: flex;
            align-items: center;
            padding: 5px;
        }

        .collapse-arrow:hover {
            color: var(--text-color);
        }

        .team-card.collapsed .players-grid {
            display: none;
        }

        .team-card.collapsed .collapse-arrow {
            transform: rotate(-90deg);
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .player-mini-card {
            background: var(--mini-card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.2s, background-color 0.3s;
        }

        .player-mini-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .player-avatar-mini {
            width: 100%;
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .player-avatar-mini img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .player-mini-name {
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .flag-icon {
            width: 18px;
            height: 12px;
            object-fit: cover;
            border-radius: 2px;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
            vertical-align: middle;
        }

        .no-players {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            grid-column: 1 / -1;
            padding: 10px;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            font-size: 1.1rem;
        }

        /* Плаваюча кнопка техпідтримки Discord */
        .support-float-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #5865F2, #4752C4);
            color: #ffffff;
            padding: 14px 22px;
            border-radius: 35px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.45);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .support-float-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 8px 25px rgba(88, 101, 242, 0.65);
        }

        .support-float-btn svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        /* Кнопка "Наверх" з написом */
        .scroll-top-btn {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 9998;
            opacity: 0;
            visibility: hidden;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .scroll-top-btn.show {
            opacity: 1;
            visibility: visible;
        }

        .scroll-top-btn:hover {
            border-color: var(--accent-color);
            transform: translateY(-3px);
        }

        .scroll-top-btn svg {
            width: 18px;
            height: 18px;
            stroke: var(--accent-color);
            stroke-width: 2.5;
            fill: none;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Шапка сайту -->
        <div class="navbar">
            <div class="logo-area">
                <img src="REUS.png" alt="REUS Logo" class="logo-img"> 
                <span>Reus Championship Teams</span>
            </div>
            <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">
                ☀️ Світла тема
            </button>
        </div>

        <!-- Пошук -->
        <input type="text" id="searchInput" class="search-box" placeholder="Пошук команд або гравців..." oninput="filterTeams()">

        <!-- Список команд -->
        <div id="teamsContainer">
            <div class="loading">Завантаження даних із хмари...</div>
        </div>
    </div>

    <!-- КНОПКА "НАВЕРХ" -->
    <button class="scroll-top-btn" id="scrollTopBtn" onclick="scrollToTop()" title="Наверх">
        <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
        <span>Наверх</span>
    </button>

    <!-- ПЛАВАЮЧА КНОПКА ТЕХПІДТРИМКИ DISCORD -->
    <a href="https://discord.com/channels/1144999195007275104/1250123555891445790" target="_blank" class="support-float-btn" title="Техпідтримка в Discord">
        <svg viewBox="0 0 24 24">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        <span>Підтримка</span>
    </a>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        let globalCloudData = { teams: [], players: [] };

        // Логіка теми
        function initTheme() {
            const savedTheme = localStorage.getItem('reus_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeButtonText(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('reus_theme', newTheme);
            updateThemeButtonText(newTheme);
        }

        function updateThemeButtonText(theme) {
            const btn = document.getElementById('themeBtn');
            if (theme === 'light') {
                btn.innerHTML = '🌙 Темна тема';
            } else {
                btn.innerHTML = '☀️ Світла тема';
            }
        }

        initTheme();

        // Логіка появи кнопки "Наверх" при скролі
        window.addEventListener('scroll', () => {
            const scrollTopBtn = document.getElementById('scrollTopBtn');
            if (window.scrollY > 300) {
                scrollTopBtn.classList.add('show');
            } else {
                scrollTopBtn.classList.remove('show');
            }
        });

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        async function fetchMainData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const rawRecord = result.record || result;
                globalCloudData = rawRecord.record || rawRecord;

                if (!globalCloudData.teams) globalCloudData.teams = [];
                if (!globalCloudData.players) globalCloudData.players = [];

                globalCloudData.teams.sort((a, b) => (parseInt(b.points) || 0) - (parseInt(a.points) || 0));

                renderTeams(globalCloudData.teams, globalCloudData.players);
            } catch (err) {
                console.error(err);
                document.getElementById('teamsContainer').innerHTML = '<div class="loading" style="color: var(--danger-color);">Помилка завантаження даних із хмари.</div>';
            }
        }

        function generateTeamCardHtml(team, rankDisplay, isUnranked = false, players) {
            const teamPlayers = players.filter(p => 
                p.team && p.team.trim().toLowerCase() === team.name.trim().toLowerCase() && 
                (!p.roleSlot || p.roleSlot === 'main')
            );

            let playersHtml = '';
            if (teamPlayers.length === 0) {
                playersHtml = '<div class="no-players">Склад поки відсутній</div>';
            } else {
                teamPlayers.forEach(p => {
                    const flagImg = p.country ? `<img src="https://flagcdn.com/24x18/${p.country.toLowerCase()}.png" class="flag-icon" alt="${p.country}">` : '';
                    const defaultSvg = `<svg width="35" height="35" fill="var(--text-muted)" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
                    
                    const avatarContent = p.photo && p.photo.trim() !== '' 
                        ? `<img src="${p.photo}" onerror="this.parentElement.innerHTML='${defaultSvg.replace(/"/g, '&quot;')}'">` 
                        : defaultSvg;

                    const safePlayerName = encodeURIComponent(p.name);

                    playersHtml += `
                        <div class="player-mini-card" onclick="openPlayerPage('${safePlayerName}')">
                            <div class="player-avatar-mini">
                                ${avatarContent}
                            </div>
                            <div class="player-mini-name">
                                ${flagImg} <span>${p.name}</span>
                            </div>
                        </div>
                    `;
                });
            }

            const pointsDisplay = isUnranked ? '<span class="unranked-badge-text">Unranked</span>' : `${team.points || 0} pts`;

            return `
                <div class="team-card" data-team-name="${team.name.toLowerCase()}">
                    <div class="team-header">
                        <div class="team-title-area" onclick="openTeamPage('${team.name}')">
                            ${rankDisplay}
                            <img src="${team.logo || 'https://via.placeholder.com/32'}" class="team-logo" onerror="this.style.display='none'">
                            <span class="team-name">${team.name}</span>
                        </div>
                        <div class="team-points">${pointsDisplay}</div>
                        <div class="collapse-arrow" onclick="toggleTeam(this)" title="Згорнути / Розгорнути">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </div>
                    <div class="players-grid">
                        ${playersHtml}
                    </div>
                </div>
            `;
        }

        function renderTeams(teams, players) {
            const container = document.getElementById('teamsContainer');
            if (teams.length === 0) {
                container.innerHTML = '<div class="loading">Ще немає доданих команд.</div>';
                return;
            }

            const rankedTeams = teams.filter(t => !t.type || t.type === 'ranked');
            const unrankedTeams = teams.filter(t => t.type === 'unranked');

            let html = '';

            if (rankedTeams.length > 0) {
                html += `<h2 class="section-header-title">Рейтинг команд</h2>`;
                rankedTeams.forEach((team, index) => {
                    const rankDisplay = `<span class="rank-number">#${index + 1}</span>`;
                    html += generateTeamCardHtml(team, rankDisplay, false, players);
                });
            }

            if (unrankedTeams.length > 0) {
                html += `<h2 class="section-header-title unranked-section-title">Не рейтингові команди (Unranked)</h2>`;
                unrankedTeams.forEach(team => {
                    const rankDisplay = `<span class="unranked-badge-text">-</span>`;
                    html += generateTeamCardHtml(team, rankDisplay, true, players);
                });
            }

            container.innerHTML = html;
        }

        function openPlayerPage(encodedName) {
            window.location.href = `player.html?name=${encodedName}`;
        }

        function openTeamPage(teamName) {
            window.location.href = `team.html?name=${encodeURIComponent(teamName)}`;
        }

        function toggleTeam(arrowElement) {
            const card = arrowElement.closest('.team-card');
            card.classList.toggle('collapsed');
        }

        function filterTeams() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.team-card');

            cards.forEach(card => {
                const teamName = card.getAttribute('data-team-name');
                const textContent = card.innerText.toLowerCase();
                if (teamName.includes(query) || textContent.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        fetchMainData();
    </script>
</body>
</html>
