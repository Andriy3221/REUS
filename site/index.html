<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REUS | Рейтинг команд</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #f39c12; /* Жовтий колір для топів */
            --text-color: #ffffff;
            --text-muted: #8a99ad;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        /* Стиль блоку команди, як на твоєму скріншоті */
        .team-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 20px;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }
        .team-card:hover {
            border-color: var(--accent-color);
        }
        .team-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .team-rank {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.1rem;
            min-width: 35px;
        }
        .team-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .team-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        .team-name {
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }
        .team-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .team-points {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
        }
        .arrow-icon {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .loading {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Світовий рейтинг команд</h1>
        
        <!-- Сюди автоматично завантажаться команди з бази -->
        <div id="teams-container">
            <div class="loading">Завантаження команд...</div>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        async function loadPublicTeams() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const rawRecord = result.record || result;
                const cloudData = rawRecord.record || rawRecord;

                let teams = cloudData.teams || [];

                // Автоматично сортуємо за очками від найбільших до найменших (хто вище — той лідер)
                teams.sort((a, b) => (parseInt(b.points) || 0) - (parseInt(a.points) || 0));

                const container = document.getElementById('teams-container');
                
                if (teams.length === 0) {
                    container.innerHTML = '<div class="loading">Поки що немає жодної команди в базі.</div>';
                    return;
                }

                container.innerHTML = '';

                // Виводимо кожну команду в цитаті з автоматичним порядковим номером від 1 до ∞
                teams.forEach((team, index) => {
                    const rank = index + 1; // 1, 2, 3, 4, 5... до нескінченності

                    container.innerHTML += `
                        <div class="team-card">
                            <div class="team-left">
                                <div class="team-rank">#${rank}</div>
                                <div class="team-info">
                                    ${team.logo ? `<img src="${team.logo}" alt="" class="team-logo" onerror="this.style.display='none'">` : ''}
                                    <span class="team-name">${team.name}</span>
                                </div>
                            </div>
                            <div class="team-right">
                                <span class="team-points">${team.points || 0} pts</span>
                                <span class="arrow-icon">▼</span>
                            </div>
                        </div>
                    `;
                });

            } catch (err) {
                console.error(err);
                document.getElementById('teams-container').innerHTML = '<div class="loading" style="color: #ff4444;">Помилка завантаження даних.</div>';
            }
        }

        // Завантажуємо команди при відкритті сторінки
        loadPublicTeams();
    </script>
</body>
</html>
