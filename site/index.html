<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter-Strike World Ranking | REUS</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Блок логотипу та заголовку */
        .site-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .site-logo {
            height: 50px;
            width: auto;
            border-radius: 6px;
            object-fit: contain;
        }
        .site-title {
            margin: 0;
            font-size: 1.6rem;
            color: var(--text-color);
        }
        .search-bar {
            width: 100%;
            padding: 12px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        .content-layout {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        .left-column {
            flex: 1;
            min-width: 300px;
        }
        .right-column {
            width: 320px;
        }
        h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            margin-top: 0;
        }
        .team-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .team-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161c26;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .team-header:hover {
            background: #1a222f;
        }
        .team-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .team-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
            border-radius: 4px;
            background: #000;
        }
        .team-name-link {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-color);
            text-decoration: none;
        }
        .team-name-link:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }
        .team-players {
            display: none;
            padding: 20px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            gap: 15px;
            justify-content: flex-start;
            flex-wrap: wrap;
        }
        .team-card.open .team-players {
            display: flex;
        }
        .player-box {
            text-align: center;
            background: #1a222f;
            padding: 10px;
            border-radius: 6px;
            width: 18%;
            min-width: 110px;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.2s, border-color 0.2s;
            box-sizing: border-box;
            border: 1px solid transparent;
        }
        .player-box:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }
        .player-box img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            background-color: #111;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .player-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .transfers-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }
        .transfers-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .transfer-item {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.4;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }
        .transfer-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .transfer-item strong {
            color: var(--text-color);
        }
        .arrow-icon {
            transition: transform 0.3s;
            display: inline-block;
        }
        .team-card.open .arrow-icon {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Шапка сайту з логотипом REUS.png -->
        <header class="site-header">
            <img src="REUS.png" alt="REUS Logo" class="site-logo" onerror="this.style.display='none'">
            <h1 class="site-title">Counter-Strike World Ranking</h1>
        </header>

        <!-- Пошук по сторінці -->
        <input type="text" id="searchInput" class="search-bar" placeholder="Пошук команд або гравців..." oninput="filterRanking()">

        <div class="content-layout">
            <div class="left-column" id="teamsContainer">
                <!-- Динамічно завантажуються команди -->
            </div>

            <div class="right-column">
                <div class="transfers-box">
                    <div class="transfers-title">⚡ Top Transfers</div>
                    <div id="transfersListContainer">
                        <div class="transfer-item">Трансфери поки відсутні.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Завантаження та вивід трансферів з localStorage
        function renderTransfers() {
            const container = document.getElementById('transfersListContainer');
            const transfers = JSON.parse(localStorage.getItem('reus_transfers_list')) || [];

            if (transfers.length === 0) {
                // Перевіряємо застаріле поле для сумісності
                const singleTransfer = localStorage.getItem('yami_transfer');
                if (singleTransfer) {
                    container.innerHTML = `<div class="transfer-item">${singleTransfer}</div>`;
                } else {
                    container.innerHTML = '<div class="transfer-item">Трансфери поки відсутні.</div>';
                }
                return;
            }

            container.innerHTML = '';
            transfers.forEach(tr => {
                container.innerHTML += `<div class="transfer-item">${tr}</div>`;
            });
        }

        // Рендер команд і гравців на головній сторінці
        function renderIndexTeams() {
            const container = document.getElementById('teamsContainer');
            const teams = JSON.parse(localStorage.getItem('reus_teams')) || [];
            const players = JSON.parse(localStorage.getItem('reus_players')) || [];

            if (teams.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">Немає команд у рейтингу. Додайте їх через адмін-панель.</p>';
                return;
            }

            container.innerHTML = '';
            teams.forEach((t, index) => {
                const teamId = 'team_' + index;
                const teamPlayers = players.filter(p => p.team === t.name);

                let playersHtml = '';
                if (teamPlayers.length === 0) {
                    playersHtml = '<p style="color: var(--text-muted); width: 100%; text-align: center; margin: 0;">У цій команді поки немає гравців</p>';
                } else {
                    teamPlayers.forEach(p => {
                        playersHtml += `
                            <a href="player.html?name=${encodeURIComponent(p.name)}&img=${encodeURIComponent(p.photo)}" class="player-box">
                                <img src="${p.photo}" alt="${p.name}" onerror="this.src='default_player.png'">
                                <div class="player-footer">
                                    <svg width="16" height="11" viewBox="0 0 9 6" style="border-radius: 2px;"><rect width="9" height="3" fill="#005BBB"/><rect y="3" width="9" height="3" fill="#FFD500"/></svg>
                                    ${p.name}
                                </div>
                            </a>
                        `;
                    });
                }

                container.innerHTML += `
                    <div class="team-card" id="${teamId}" data-team-name="${t.name.toLowerCase()}">
                        <div class="team-header" onclick="toggleTeam('${teamId}')">
                            <div class="team-info">
                                <span style="color: var(--text-muted); font-weight: bold; min-width: 25px;">${t.valveRank || '#1'}</span>
                                <img src="${t.logo}" alt="${t.name}" class="team-logo" onerror="this.style.display='none'">
                                <a href="team.html?name=${encodeURIComponent(t.name)}" class="team-name-link" onclick="event.stopPropagation()">${t.name}</a>
                            </div>
                            <div style="color: var(--text-muted);">
                                <span class="arrow-icon">▾</span>
                            </div>
                        </div>
                        <div class="team-players">
                            ${playersHtml}
                        </div>
                    </div>
                `;
            });
        }

        // Відкриття/закриття випадаючого списку команди
        function toggleTeam(teamId) {
            const card = document.getElementById(teamId);
            card.classList.toggle('open');
        }

        // Пошук по командах
        function filterRanking() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.team-card');

            cards.forEach(card => {
                const teamName = card.getAttribute('data-team-name');
                if (teamName.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Запуск функцій при завантаженні
        renderIndexTeams();
        renderTransfers();
    </script>

</body>
</html>
