<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reus Championship | Rating</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(13, 17, 23, 0.85);
            --inner-card-bg: #111620;
            --border-color: #21262d;
            --accent-color: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.2);
            --text-color: #ffffff;
            --text-muted: #8b949e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -2;
            object-fit: cover;
        }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 9, 14, 0.82);
            z-index: -1;
        }
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .header-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 15px 25px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .project-logo-container {
            display: inline-flex;
            align-items: center;
            gap: 20px;
            text-decoration: none;
            cursor: pointer;
        }
        .project-logo-wrapper {
            width: 190px;
            height: 75px;
            background: var(--inner-card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.4);
            flex-shrink: 0;
        }
        .project-logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        .project-title {
            color: var(--text-color);
            font-size: 1.65rem;
            font-weight: 800;
        }
        .project-title span {
            color: var(--accent-color);
        }
        .support-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--inner-card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .support-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        .tabs-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
        }
        .tab-btn.active {
            background: var(--inner-card-bg);
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .section-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: none;
            margin-bottom: 25px;
        }
        .section-box.active {
            display: block;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .section-title.unranked-title {
            color: var(--text-muted);
            border-color: var(--border-color);
        }
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .team-card {
            background: var(--inner-card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            cursor: pointer;
            user-select: none;
        }
        .team-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        /* Збільшений розмір логотипів команд з фільтрами чіткості */
        .team-logo {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            object-fit: contain;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            padding: 2px;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        .team-name {
            font-weight: 700;
            font-size: 1.05rem;
        }
        .team-value {
            color: var(--accent-color);
            font-weight: 800;
        }
        .unranked-badge {
            background: rgba(139, 148, 158, 0.15);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .team-card.unranked {
            opacity: 0.75;
        }
        .team-players {
            display: none;
            padding: 10px 18px 15px 18px;
            border-top: 1px solid var(--border-color);
            background: rgba(7, 9, 14, 0.4);
            flex-direction: column;
            gap: 8px;
        }
        .team-player-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            color: var(--text-muted);
            padding: 4px 0;
            text-decoration: none;
        }
        .team-player-row:hover {
            color: var(--accent-color);
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: var(--inner-card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            text-decoration: none;
            color: var(--text-color);
        }
        .item-row:hover {
            border-color: rgba(0, 255, 136, 0.5);
            background: rgba(17, 22, 32, 0.95);
        }
        .item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .item-name {
            font-weight: 700;
            font-size: 1.05rem;
        }
        .item-value {
            color: var(--accent-color);
            font-weight: 800;
        }
        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline preload="auto" class="bg-video" id="bgVideo">
        <source src="fon.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <div class="main-container">
        <div class="header-banner">
            <a href="index.html" class="project-logo-container">
                <div class="project-logo-wrapper">
                    <img src="REUS.png" alt="REUS Logo"> 
                </div>
                <div class="project-title">Reus <span>Championship</span></div>
            </a>
            <a href="https://t.me/твій_аккаунт" target="_blank" class="support-btn">
                <span>💬</span> Техпідтримка
            </a>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('teams', this)">Команди</button>
            <button class="tab-btn" onclick="switchTab('players', this)">Гравці</button>
        </div>

        <div id="teams-section" class="section-box active">
            <div class="section-title">Рейтинг команд</div>
            <div id="ranked-teams-app" class="list-container">
                <div class="loading">Завантаження команд...</div>
            </div>

            <div class="section-title unranked-title" style="margin-top: 35px;">Нерейтингові команди / Дизбанд</div>
            <div id="unranked-teams-app" class="list-container"></div>
        </div>

        <div id="players-section" class="section-box">
            <div class="section-title">Рейтинг гравців</div>
            <div id="players-app" class="list-container">
                <div class="loading">Завантаження гравців...</div>
            </div>
        </div>
    </div>

    <script>
        const bgVideo = document.getElementById('bgVideo');
        if (bgVideo) {
            bgVideo.addEventListener('ended', function() {
                this.currentTime = 0;
                this.play();
            });
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section-box').forEach(s => s.classList.remove('active'));

            btn.classList.add('active');
            if (tabName === 'teams') {
                document.getElementById('teams-section').classList.add('active');
            } else {
                document.getElementById('players-section').classList.add('active');
            }
        }

        function toggleTeam(event, headerElement) {
            event.stopPropagation();
            const playersDiv = headerElement.nextElementSibling;
            playersDiv.style.display = playersDiv.style.display === 'flex' ? 'none' : 'flex';
        }

        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        async function fetchData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                
                // Правильний шлях до даних відповідно до структури JsonBin
                const cloudData = result.record?.record || result.record || result;

                const teams = cloudData.teams || [];
                const allPlayers = cloudData.players || [];

                // 1. Заповнення списку команд та їх гравців
                if (teams.length === 0) {
                    document.getElementById('ranked-teams-app').innerHTML = '<div class="loading">Список команд порожній.</div>';
                } else {
                    let rankedHtml = '';
                    let unrankedHtml = '';
                    let rankedCounter = 1;
                    let unrankedCounter = 1;

                    teams.forEach((t) => {
                        const tName = t.name || 'Команда';
                        const tLogo = t.logo || t.image || '';
                        
                        // Шукаємо гравців усередині команди або матчимо з глобального масиву гравців за назвою команди
                        let tPlayers = t.players || t.roster || t.members || t.team || t.squad || [];
                        if (tPlayers.length === 0 && allPlayers.length > 0) {
                            tPlayers = allPlayers.filter(p => p.team === tName || p.teamName === tName || p.team_id === t.id);
                        }

                        const isRanked = t.isRanked !== false && t.ranked !== false && t.type !== 'unranked' && t.type !== 'не рейтингова';
                        let logoHtml = tLogo ? `<img src="${tLogo}" class="team-logo" alt="">` : '';

                        let playersListHtml = '';
                        if (Array.isArray(tPlayers) && tPlayers.length > 0) {
                            tPlayers.forEach(tp => {
                                const playerName = typeof tp === 'string' ? tp : (tp.name || tp.nickname || tp.username || 'Гравець');
                                playersListHtml += `
                                    <a href="player.html?name=${encodeURIComponent(playerName)}" class="team-player-row" onclick="event.stopPropagation();">
                                        <span>• ${playerName}</span>
                                        <span style="color: var(--accent-color);">переглянути</span>
                                    </a>
                                `;
                            });
                        } else {
                            playersListHtml = '<div style="color: var(--text-muted); font-size: 0.9rem;">У команді немає гравців або дизбанд</div>';
                        }

                        const cardHtml = `
                            <div class="team-card ${isRanked ? '' : 'unranked'}">
                                <div class="team-header" onclick="toggleTeam(event, this)">
                                    <div class="team-info">
                                        <span style="color: var(--text-muted); font-weight: bold;">#${isRanked ? rankedCounter++ : unrankedCounter++}</span>
                                        ${logoHtml}
                                        <span class="team-name">${tName}</span>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 15px;">
                                        ${isRanked ? `<span class="team-value">${t.points || t.rating || '0'}</span>` : '<span class="unranked-badge">Нерейтингова</span>'}
                                        <span style="color: var(--text-muted); font-size: 0.8rem;">▼</span>
                                    </div>
                                </div>
                                <div class="team-players">
                                    ${playersListHtml}
                                </div>
                            </div>
                        `;

                        if (isRanked) {
                            rankedHtml += cardHtml;
                        } else {
                            unrankedHtml += cardHtml;
                        }
                    });

                    document.getElementById('ranked-teams-app').innerHTML = rankedHtml || '<div class="loading">Немає рейтингових команд.</div>';
                    document.getElementById('unranked-teams-app').innerHTML = unrankedHtml || '<div style="color: var(--text-muted); font-size: 0.9rem; padding: 10px 0;">Немає нерейтингових команд.</div>';
                }

                // 2. Заповнення глобального списку гравців
                if (allPlayers.length === 0) {
                    document.getElementById('players-app').innerHTML = '<div class="loading">Список гравців порожній.</div>';
                } else {
                    let playersHtml = '';
                    allPlayers.forEach((p, index) => {
                        const pName = p.name || p.nickname || p.username || 'Гравець';
                        const pRating = p.stats?.rating || p.rating || p.rate || p.score || p.kd || '1.00';
                        playersHtml += `
                            <a href="player.html?name=${encodeURIComponent(pName)}" class="item-row">
                                <div class="item-info">
                                    <span style="color: var(--text-muted); font-weight: bold;">#${index + 1}</span>
                                    <span class="item-name">${pName}</span>
                                </div>
                                <div class="item-value">${pRating}</div>
                            </a>
                        `;
                    });
                    document.getElementById('players-app').innerHTML = playersHtml;
                }

            } catch (err) {
                console.error("Помилка завантаження:", err);
                document.getElementById('ranked-teams-app').innerHTML = '<div class="loading">Помилка завантаження даних.</div>';
                document.getElementById('players-app').innerHTML = '<div class="loading">Помилка завантаження даних.</div>';
            }
        }

        fetchData();
    </script>
</body>
</html>
