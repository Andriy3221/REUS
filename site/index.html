<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reus Championship | Rating & Tournaments</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(13, 17, 23, 0.85);
            --inner-card-bg: #111620;
            --border-color: #21262d;
            --accent-color: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.2);
            --text-color: #ffffff;
            --text-muted: #8b949e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -2;
            object-fit: cover;
        }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 9, 14, 0.82);
            z-index: -1;
        }
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .header-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 15px 25px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .project-logo-container {
            display: inline-flex;
            align-items: center;
            gap: 20px;
            text-decoration: none;
            cursor: pointer;
        }
        .project-logo-wrapper {
            width: 190px;
            height: 75px;
            background: var(--inner-card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.4);
            flex-shrink: 0;
        }
        .project-logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        .project-title {
            color: var(--text-color);
            font-size: 1.65rem;
            font-weight: 800;
        }
        .project-title span {
            color: var(--accent-color);
        }
        .tabs-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--inner-card-bg);
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .section-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: none;
            margin-bottom: 25px;
        }
        .section-box.active {
            display: block;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .section-title.unranked-title {
            color: var(--text-muted);
            border-color: var(--border-color);
        }
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .team-card {
            background: var(--inner-card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            cursor: pointer;
            user-select: none;
        }
        .team-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .team-logo {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            object-fit: contain;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            padding: 2px;
        }
        .team-name-link {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-color);
            text-decoration: none;
        }
        .team-name-link:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }
        .team-value {
            color: var(--accent-color);
            font-weight: 800;
        }
        .unranked-badge {
            background: rgba(139, 148, 158, 0.15);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .team-card.unranked {
            opacity: 0.75;
        }
        .team-players {
            display: none;
            padding: 15px;
            border-top: 1px solid var(--border-color);
            background: rgba(7, 9, 14, 0.5);
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }
        .team-player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #151b26;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.25s ease;
            text-align: center;
        }
        .team-player-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.2);
        }
        .player-photo-wrapper {
            width: 100%;
            height: 155px;
            background: #0d1117;
            overflow: hidden;
            position: relative;
        }
        .player-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 22%; 
            transform: scale(1.15);
            transition: transform 0.3s ease;
        }
        .team-player-card:hover .player-avatar {
            transform: scale(1.22);
        }
        .player-name-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 6px;
            width: 100%;
            box-sizing: border-box;
            background: #111620;
            border-top: 1px solid var(--border-color);
        }
        .player-name {
            font-size: 0.95rem;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .player-flag {
            width: 20px;
            height: 14px;
            border-radius: 2px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: var(--inner-card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            text-decoration: none;
            color: var(--text-color);
        }
        .item-row:hover {
            border-color: rgba(0, 255, 136, 0.5);
            background: rgba(17, 22, 32, 0.95);
        }
        .item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .item-name {
            font-weight: 700;
            font-size: 1.05rem;
        }
        .item-value {
            color: var(--accent-color);
            font-weight: 800;
        }
        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }
