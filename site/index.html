<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter-Strike World ranking | REUS</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .search-bar {
            width: 100%;
            padding: 12px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        .content-layout {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        .left-column {
            flex: 1;
            min-width: 300px;
        }
        .right-column {
            width: 320px;
        }
        h2 {
            font-size: 1.4rem;
            margin-bottom: 15px;
        }
        .team-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .team-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161c26;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .team-header:hover {
            background: #1a222f;
        }
        .team-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .team-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
            border-radius: 4px;
        }
        .team-name-link {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-color);
            text-decoration: none;
        }
        .team-name-link:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }
        .team-players {
            display: none;
            padding: 20px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            gap: 15px;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .team-players.active {
            display: flex;
        }
        .player-box {
            text-align: center;
            background: #1a222f;
            padding: 10px;
            border-radius: 6px;
            width: 18%;
            min-width: 110px;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.2s;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .player-box:hover {
            transform: translateY(-3px);
            border: 1px solid var(--accent-color);
        }
        .player-box img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            background-color: #111;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .player-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .transfers-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }
        .transfers-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .transfer-item {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .transfer-item strong {
            color: var(--text-color);
        }
        .arrow-icon {
            transition: transform 0.3s;
        }
        .team-card.open .arrow-icon {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <input type="text" class="search-bar" placeholder="Search players, teams...">

        <h2 style="color: #fff;">Counter-Strike World ranking</h2>

        <div class="content-layout">
            <div class="left-column" id="teamsContainer">
                <!-- Динамічно завантажуються команди з адмінки -->
            </div>

            <div class="right-column">
                <div class="transfers-box">
                    <div class="transfers-title">⚡ Top Transfers</div>
                    <div class="transfer-item" id="transferText">
                        [2026-08-23] Гравця <strong>oz1k</strong> переведено у <strong>Yami Esports</strong>.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Завантаження трансферу
        const savedTransfer = localStorage.getItem('yami_transfer');
        if (savedTransfer) {
            document.getElementById('transferText').innerHTML = savedTransfer;
        }

        // Рендер списку команд на головній
        function renderIndexTeams() {
            const container = document.getElementById('teamsContainer');
            const teams = JSON.parse(localStorage.getItem('reus_teams')) || [];
            const players = JSON.parse(localStorage.getItem('reus_players')) || [];

            if (teams.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">Немає команд у рейтингу.</p>';
                return;
            }

            container.innerHTML = '';
            teams.forEach((t, index) => {
                const teamId = 'team' + index;
                const teamPlayers = players.filter(p => p.team === t.name);

                let playersHtml = '';
                if (teamPlayers.length === 0) {
                    playersHtml = '<p style="color: #8a99ad; width: 100%; text-align: center; margin: 0;">У цій команді поки немає гравців</p>';
                } else {
                    teamPlayers.forEach(p => {
                        playersHtml += `
                            <a href="player.html?name=${encodeURIComponent(p.name)}&img=${encodeURIComponent(p.photo)}" class="player-box">
                                <img src="${p.photo}" alt="${p.name}">
                                <div class="player-footer">
                                    <svg width="18" height="12" viewBox="0 0 9 6" style="border-radius: 2px;"><rect width="9" height="3" fill="#005BBB"/><rect y="3" width="9" height="3" fill="#FFD500"/></svg>
                                    ${p.name}
                                </div>
                            </a>
                        `;
                    });
                }

                container.innerHTML += `
                    <div class="team-card" id="${teamId}">
                        <div class="team-header" onclick="toggleTeam('${teamId}')">
                            <div class="team-info">
                                <span style="color: var(--text-muted); font-weight: bold;">${t.valveRank || '#1'}</span>
                                <img src="${t.logo}" alt="${t.name}" class="team-logo">
                                <a href="team.html?name=${encodeURIComponent(t.name)}" class="team-name-link" onclick="event.stopPropagation()">${t.name}</a>
                            </div>
                            <div style="color: var(--text-muted);">
                                1000 pts <span class="arrow-icon" style="display:inline-block;">▾</span>
                            </div>
                        </div>
                        <div class="team-players" id="${teamId}-players">
                            ${playersHtml}
                        </div>
                    </div>
                `;
            });
        }

        function toggleTeam(teamId) {
            const card = document.getElementById(teamId);
            const players = document.getElementById(teamId + '-players');
            card.classList.toggle('open');
            players.classList.toggle('active');
        }

        renderIndexTeams();
    </script>

</body>
</html>
