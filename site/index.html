<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профіль гравця | REUS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #131820;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 30px;
        }
        h1 {
            color: #00ff88;
            margin-top: 0;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .stat-card {
            background: #1a222f;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
            margin-top: 5px;
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #8a99ad;
            text-decoration: none;
        }
        .back-link:hover {
            color: #00ff88;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="player-title">Профіль гравця</h1>
        <p style="color: #8a99ad;">Команда: <strong>Yami Esports</strong></p>

        <div class="stats-grid">
            <div class="stat-card">
                <div>Рейтинг (K/D)</div>
                <div class="stat-value">1.18</div>
            </div>
            <div class="stat-card">
                <div>Винрейт мап</div>
                <div class="stat-value">64%</div>
            </div>
            <div class="stat-card">
                <div>Трофеї</div>
                <div class="stat-value">3 🏆</div>
            </div>
        </div>

        <a href="index.html" class="back-link">← Назад до рейтингу</a>
    </div>

    <script>
        // Отримуємо ім'я гравця з посилання (наприклад, player.html?name=r1kizy)
        const urlParams = new URLSearchParams(window.location.search);
        const playerName = urlParams.get('name');
        
        if (playerName) {
            document.getElementById('player-title').innerText = "Профіль гравця: " + playerName;
        }
    </script>

</body>
</html>
