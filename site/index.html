<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reus Championship | Rating</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(13, 17, 23, 0.85);
            --inner-card-bg: #111620;
            --border-color: #21262d;
            --accent-color: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.2);
            --text-color: #ffffff;
            --text-muted: #8b949e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
            perspective: 1000px;
        }
        .bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            object-fit: cover;
        }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 9, 14, 0.82);
            z-index: -1;
        }
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        /* Стильна велика шапка з красивим логотипом */
        .header-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 20px 30px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .header-banner:hover {
            border-color: rgba(0, 255, 136, 0.4);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 25px var(--accent-glow);
        }
        .project-logo-container {
            display: inline-flex;
            align-items: center;
            gap: 20px;
            text-decoration: none;
        }
        /* Зробили блок логотипу ширшим та ефектнішим */
        .project-logo-wrapper {
            width: 120px;
            height: 60px;
            background: var(--inner-card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.35), inset 0 0 15px rgba(0,255,136,0.2);
            flex-shrink: 0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .project-logo-container:hover .project-logo-wrapper {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
        }
        .project-logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Зберігає пропорції логотипу без обрізання */
            padding: 4px;
        }
        .project-title {
            color: var(--text-color);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .project-title span {
            color: var(--accent-color);
            text-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
        }

        /* Таблиця / список */
        .section-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.2);
        }
        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: var(--inner-card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.2s ease;
        }
        .player-row:hover {
            border-color: rgba(0, 255, 136, 0.5);
            background: rgba(17, 22, 32, 0.95);
            transform: translateX(4px);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.08);
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .player-name {
            font-weight: 700;
            font-size: 1.05rem;
        }
        .player-rating {
            color: var(--accent-color);
            font-weight: 800;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
        }
        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline preload="auto" class="bg-video" id="bgVideo">
        <source src="fon.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <div class="main-container">
        <!-- Шапка з правильно підключеним логотипом REUS.png -->
        <div class="header-banner">
            <a href="index.html" class="project-logo-container">
                <div class="project-logo-wrapper">
                    <img src="REUS.png" alt="REUS Logo"> 
                </div>
                <div class="project-title">Reus <span>Championship</span></div>
            </a>
        </div>

        <div class="section-box">
            <div class="section-title">Рейтинг гравців</div>
            <div id="app" class="ranking-list">
                <div class="loading">Завантаження рейтингу...</div>
            </div>
        </div>
    </div>

    <script>
        const bgVideo = document.getElementById('bgVideo');
        if (bgVideo) {
            bgVideo.addEventListener('ended', function() {
                this.currentTime = 0;
                this.play();
            });
        }

        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        async function fetchRanking() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const rawRecord = result.record || result;
                const cloudData = rawRecord.record || rawRecord;

                const players = cloudData.players || [];
                
                if (players.length === 0) {
                    document.getElementById('app').innerHTML = '<div class="loading">Список гравців порожній.</div>';
                    return;
                }

                let html = '';
                players.forEach((p, index) => {
                    const pName = p.name || p.nickname || 'Гравець';
                    html += `
                        <a href="player.html?name=${encodeURIComponent(pName)}" class="player-row">
                            <div class="player-info">
                                <span style="color: var(--text-muted); font-weight: bold;">#${index + 1}</span>
                                <span class="player-name">${pName}</span>
                            </div>
                            <div class="player-rating">${p.rating || '1.00'}</div>
                        </a>
                    `;
                });

                document.getElementById('app').innerHTML = html;
            } catch (err) {
                console.error(err);
                document.getElementById('app').innerHTML = '<div class="loading" style="color: var(--danger-color);">Помилка завантаження даних.</div>';
            }
        }

        fetchRanking();
    </script>
</body>
</html>
