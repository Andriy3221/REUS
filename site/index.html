<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reus Championship | Winter Edition ❄️</title>
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: rgba(12, 18, 32, 0.92);
            --inner-card-bg: #0f172a;
            --border-color: #1e293b;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
            opacity: 0;
            animation: pageFadeIn 0.7s ease-out forwards;
        }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -2;
            object-fit: cover;
            filter: hue-rotate(180deg) brightness(0.35);
        }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(10, 20, 38, 0.75) 0%, rgba(6, 9, 19, 0.96) 100%);
            z-index: -1;
        }

        /* АНІМОВАНИЙ СНІГ */
        .snowflake {
            position: fixed;
            top: -10px;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(50vh) translateX(20px); }
            100% { transform: translateY(105vh) translateX(-20px); }
        }

        /* НОВОРІЧНИЙ ВІДЖЕТ ДІДА МОРОЗА (ЗЛІВА В КУТКУ) */
        .santa-widget {
            position: fixed;
            bottom: 25px;
            left: 25px;
            z-index: 99999;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(12, 18, 32, 0.95);
            border: 2px solid #38bdf8;
            border-radius: 16px;
            padding: 14px 18px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4), 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            max-width: 320px;
            animation: santaSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes santaSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .santa-avatar {
            width: 50px;
            height: 50px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid #38bdf8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .santa-content {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .santa-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .santa-desc {
            font-size: 0.8rem;
            color: var(--text-color);
            line-height: 1.35;
        }

        .santa-desc b {
            color: #38bdf8;
        }

        .santa-close {
            position: absolute;
            top: 6px;
            right: 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .santa-close:hover { color: #38bdf8; }

        .main-container {
            max-width: 1050px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding-bottom: 60px;
        }

        .donate-floating-btn {
            position: fixed !important;
            top: 20px !important;
            right: 25px !important;
            z-index: 999999 !important;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4), 0 4px 15px rgba(0, 0, 0, 0.6);
            border: 1px solid #38bdf8;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(8px);
        }

        .donate-floating-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.7);
            border-color: #7dd3fc;
        }

        .header-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 15px 25px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.1);
            flex-wrap: wrap;
            gap: 15px;
            margin-right: 170px;
        }

        .project-logo-container {
            display: inline-flex;
            align-items: center;
            gap: 20px;
            text-decoration: none;
        }
        .project-logo-wrapper {
            width: 190px;
            height: 75px;
            background: #080d1a;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .project-logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .project-title {
            color: var(--text-color);
            font-size: 1.65rem;
            font-weight: 800;
        }
        .project-title span { color: var(--accent-color); }

        .tabs-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--inner-card-bg);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px;
            display: none;
        }
        .section-box.active { display: block; }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .list-container { display: flex; flex-direction: column; gap: 10px; }
        .loading { text-align: center; color: var(--text-muted); padding: 40px; }

        .contact-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px;
            margin-top: 30px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .header-banner { margin-right: 0; }
            .santa-widget { left: 15px; bottom: 15px; max-width: 85%; }
        }
    </style>
</head>
<body>

    <!-- ВІДЖЕТ ДІДА МОРОЗА ЗЛІВА В КУТКУ -->
    <div class="santa-widget" id="santaNoticeWidget">
        <button class="santa-close" onclick="document.getElementById('santaNoticeWidget').style.display='none'">✕</button>
        <div class="santa-avatar">🎅</div>
        <div class="santa-content">
            <div class="santa-title" id="santaHeadTitle">Вітання від Діда Мороза!</div>
            <div class="santa-desc" id="santaHeadDesc">Розрахунок часу...</div>
        </div>
    </div>

    <a href="https://send.monobank.ua/jar/2LPGcDcnWj" target="_blank" class="donate-floating-btn">
        <span>💵 Підтримати проєкт</span>
    </a>

    <video autoplay muted loop playsinline class="bg-video" id="bgVideo">
        <source src="fon.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <div class="main-container">
        <div class="header-banner">
            <a href="index.html" class="project-logo-container">
                <div class="project-logo-wrapper">
                    <img src="image-removebg-preview.png" alt="REUS Logo"> 
                </div>
                <div class="project-title">Reus <span>Championship ❄️</span></div>
            </a>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('teams', this)">❄️ Команди</button>
            <button class="tab-btn" onclick="switchTab('players', this)">⛄ Гравці</button>
            <button class="tab-btn" onclick="switchTab('tournaments', this)">🎄 Турніри</button>
        </div>

        <div id="teams-section" class="section-box active">
            <div class="section-title">❄️ Рейтинг команд</div>
            <div id="ranked-teams-app" class="list-container">
                <div class="loading">Завантаження команд... ❄️</div>
            </div>
        </div>

        <div id="players-section" class="section-box">
            <div class="section-title">⛄ Рейтинг гравців</div>
            <div id="players-app" class="loading">Завантаження гравців... ❄️</div>
        </div>

        <div id="tournaments-section" class="section-box">
            <div class="section-title">🎄 Турніри</div>
            <div id="tournaments-app" class="loading">Завантаження турнірів... ❄️</div>
        </div>
    </div>

    <script>
        // РОЗРАХУНОК ДНІВ ДО 31 ГРУДНЯ 23:59 АБО ПРИВІТАННЯ З 1 СІЧНЯ
        function initSantaLogic() {
            const now = new Date();
            const month = now.getMonth(); // 0 = січень, 11 = грудень
            const date = now.getDate();

            const titleEl = document.getElementById('santaHeadTitle');
            const descEl = document.getElementById('santaHeadDesc');

            // Якщо настав 1 січня
            if (month === 0 && date === 1) {
                if (titleEl) titleEl.innerText = "З Новим 1 Січня! 🎉";
                if (descEl) descEl.innerHTML = "Вітаю з Новим Роком! Бажаю тільки перемог та крутого аїму!";
            } else {
                // Рахуємо дні до 31 грудня о 23:59
                let year = now.getFullYear();
                let target = new Date(year, 11, 31, 23, 59, 59);

                if (now > target) {
                    target = new Date(year + 1, 11, 31, 23, 59, 59);
                }

                const diff = target - now;
                const days = Math.ceil(diff / (1000 * 60 * 60 * 24));

                if (titleEl) titleEl.innerText = "Дід Мороз попереджає! 🎅";
                if (descEl) {
                    descEl.innerHTML = `До Нового року (31 грудня 23:59) залишилося <b>${days} днів</b>! Готуйся до свята!`;
                }
            }
        }
        initSantaLogic();

        // СНІЖИНКИ НА ФОНІ
        function createSnow() {
            const container = document.body;
            for (let i = 0; i < 40; i++) {
                const flake = document.createElement('div');
                flake.className = 'snowflake';
                const size = Math.random() * 4 + 2 + 'px';
                flake.style.width = size;
                flake.style.height = size;
                flake.style.left = Math.random() * 100 + 'vw';
                flake.style.animationDuration = Math.random() * 5 + 3 + 's';
                flake.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(flake);
            }
        }
        createSnow();

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section-box').forEach(s => s.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(tabName + '-section').classList.add('active');
        }
    </script>
</body>
</html>
