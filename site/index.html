<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reus Championship | Рейтинг</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .nav-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-area img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        .logo-area span {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .toggle-btns {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: #1a222f;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        .btn.active, .btn:hover {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }
        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-transform: uppercase;
        }
        .ranking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #1a222f;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .ranking-item:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        .item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .item-rank {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-muted);
            width: 30px;
        }
        .item-logo {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }
        .item-name {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .item-points {
            color: var(--accent-color);
            font-weight: bold;
        }
        /* Футер та техпідтримка */
        .footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .support-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }
        .support-link:hover {
            text-decoration: underline;
        }
        /* Покращена стрілочка вгору */
        #scrollTopBtn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--card-bg);
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 100;
        }
        #scrollTopBtn.show {
            opacity: 1;
            visibility: visible;
        }
        #scrollTopBtn:hover {
            background: var(--accent-color);
            color: #0b0e14;
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.3);
        }
        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Шапка сайту -->
        <div class="nav-bar">
            <div class="logo-area">
                <img src="REUS.png" alt="Logo" onerror="this.style.display='none'">
                <span>Reus Championship</span>
            </div>
            <div class="toggle-btns">
                <button class="btn active">Рейтинг команд</button>
            </div>
        </div>

        <!-- Список команд -->
        <div class="section-box">
            <div class="section-title">Рейтинг команд (Team Ranking)</div>
            <div id="teams-ranking-list">
                <div class="loading">Завантаження рейтингу...</div>
            </div>
        </div>

        <!-- Підвал сайту -->
        <div class="footer">
            <div>Reus Championship &copy; 2026. Усі права захищено.</div>
            <div>Технічна підтримка: <a href="https://t.me/твій_телеграм" target="_blank" class="support-link">Написати в Telegram</a></div>
        </div>
    </div>

    <!-- Кнопка повернення вгору -->
    <div id="scrollTopBtn" onclick="scrollToTop()">▲</div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        async function fetchRanking() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const rawRecord = result.record || result;
                const cloudData = rawRecord.record || rawRecord;

                const teams = cloudData.teams || [];
                const container = document.getElementById('teams-ranking-list');

                if (teams.length === 0) {
                    container.innerHTML = '<div style="color: var(--text-muted);">Команд поки немає в базі</div>';
                    return;
                }

                teams.sort((a, b) => (b.points || 0) - (a.points || 0));

                let html = '';
                teams.forEach((t, index) => {
                    html += `
                        <div class="ranking-item" onclick="window.location.href='team.html?name=${encodeURIComponent(t.name)}'">
                            <div class="item-info">
                                <span class="item-rank">#${index + 1}</span>
                                <img src="${t.logo || 'https://via.placeholder.com/35'}" class="item-logo" onerror="this.style.display='none'">
                                <span class="item-name">${t.name}</span>
                            </div>
                            <div class="item-points">
                                <span style="font-size: 0.75rem; color: var(--text-muted); display: block; text-align: right; text-transform: uppercase;">Points</span>
                                ${t.points || 0}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                document.getElementById('teams-ranking-list').innerHTML = '<div style="color: #ff4444; text-align: center;">Помилка завантаження рейтингу.</div>';
            }
        }

        // Поведінка стрілочки "Вгору"
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                scrollTopBtn.classList.add('show');
            } else {
                scrollTopBtn.classList.remove('show');
            }
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        fetchRanking();
    </script>
</body>
</html>
