<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reus Championship | Рейтинг</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .nav-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-area img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        .logo-area span {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-transform: uppercase;
        }
        .ranking-item {
            background: #1a222f;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            cursor: pointer;
            transition: border-color 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .ranking-item:hover {
            border-color: var(--accent-color);
        }
        .item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .item-rank {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-muted);
            width: 30px;
        }
        .item-logo {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }
        .item-name {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .toggle-btn {
            display: block;
            width: 100%;
            background: #1a222f;
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: 15px;
            transition: 0.2s;
        }
        .toggle-btn:hover {
            background: var(--border-color);
        }
        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="nav-bar">
            <div class="logo-area">
                <img src="REUS.png" alt="Logo" onerror="this.style.display='none'">
                <span>Reus Championship</span>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">Рейтинг команд (Team Ranking)</div>
            <div id="teams-ranking-list">
                <div class="loading">Завантаження рейтингу...</div>
            </div>
            <div id="toggle-container"></div>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        let allTeams = [];
        let isExpanded = false;
        let clickCounts = {}; // Зберігає кількість кліків на кожну команду

        async function fetchRanking() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const baseData = result.record || result;
                const cloudData = baseData.record || baseData;
                
                allTeams = cloudData.teams || [];
                allTeams.sort((a, b) => (Number(b.points) || 0) - (Number(a.points) || 0));

                renderList();
            } catch (err) {
                console.error(err);
                document.getElementById('teams-ranking-list').innerHTML = '<div style="color: #ff4444; text-align: center;">Помилка завантаження рейтингу.</div>';
            }
        }

        function handleTeamClick(e, teamName) {
            // Ініціалізуємо лічильник кліків для команди
            if (!clickCounts[teamName]) {
                clickCounts[teamName] = 0;
            }
            clickCounts[teamName]++;

            // Якщо клікнули менше ніж 3 рази — скасовуємо перехід і виводимо повідомлення (опціонально)
            if (clickCounts[teamName] < 3) {
                e.preventDefault();
                console.log(`Кліків по команді ${teamName}: ${clickCounts[teamName]}/3`);
            } else {
                // На 3-й раз скидаємо лічильник і дозволяємо перехід на team.html
                clickCounts[teamName] = 0;
            }
        }

        function renderList() {
            const container = document.getElementById('teams-ranking-list');
            const toggleContainer = document.getElementById('toggle-container');

            if (allTeams.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted);">Команд поки немає в базі</div>';
                return;
            }

            // Показуємо перші 5 або всі залежно від стану згортання
            const displayedTeams = isExpanded ? allTeams : allTeams.slice(0, 5);

            let html = '';
            displayedTeams.forEach((t, index) => {
                html += `
                    <a href="team.html?name=${encodeURIComponent(t.name)}" class="ranking-item" onclick="handleTeamClick(event, '${t.name}')">
                        <div class="item-info">
                            <span class="item-rank">#${index + 1}</span>
                            <img src="${t.logo || 'https://via.placeholder.com/35'}" class="item-logo" onerror="this.style.display='none'">
                            <span class="item-name">${t.name}</span>
                        </div>
                    </a>
                `;
            });

            container.innerHTML = html;

            if (allTeams.length > 5) {
                toggleContainer.innerHTML = `
                    <button class="toggle-btn" onclick="toggleExpand()">
                        ${isExpanded ? 'Згорнути ▲' : 'Розгорнути повністю ▼'}
                    </button>
                `;
            }
        }

        function toggleExpand() {
            isExpanded = !isExpanded;
            renderList();
        }

        fetchRanking();
    </script>
</body>
</html>
