<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reus Championship - Team Ranking</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
            --danger-color: #ff4444;
            --mini-card-bg: #1a222f;
        }

        [data-theme="light"] {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --accent-color: #00b359;
            --text-color: #1a202c;
            --text-muted: #718096;
            --danger-color: #e53e3e;
            --mini-card-bg: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .main-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* HLTV-стиль шапки / навбару */
        .hl-nav {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 20px;
            margin-bottom: 25px;
            display: flex;
            overflow-x: auto;
            gap: 15px;
            align-items: center;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .hl-nav::-webkit-scrollbar {
            display: none;
        }
        .hl-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            padding: 5px 8px;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }
        .hl-nav a:hover, .hl-nav a.active {
            color: var(--accent-color);
            background: var(--mini-card-bg);
        }

        .navbar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.35rem;
            font-weight: bold;
        }

        .logo-img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--mini-card-bg);
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-btn {
            background: var(--mini-card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            text-decoration: none;
            transition: border-color 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            border-color: var(--accent-color);
        }

        .section-header-title {
            font-size: 1.3rem;
            color: var(--accent-color);
            margin: 20px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
        }

        .team-row-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.2s;
        }

        .team-row-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .team-info-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .rank-number {
            color: #f39c12;
            font-weight: bold;
            font-size: 1.2rem;
            min-width: 30px;
        }

        .team-logo-small {
            width: 45px;
            height: 45px;
            background: var(--mini-card-bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border-color);
            padding: 4px;
            box-sizing: border-box;
        }

        .team-logo-small img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .team-details h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .team-stats-right {
            display: flex;
            gap: 25px;
            align-items: center;
            text-align: right;
        }

        .stat-group {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-val {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- HLTV-панель зверху, як ти хотів на скрині -->
        <div class="hl-nav">
            <a href="#">News</a>
            <a href="#">Matches</a>
            <a href="#">Results</a>
            <a href="#">Events</a>
            <a href="players.html" class="active">Players</a>
            <a href="#">Stats</a>
            <a href="#">Ranking</a>
        </div>

        <div class="navbar">
            <div class="logo-area">
                <img src="REUS.png" alt="REUS Logo" class="logo-img" onerror="this.style.display='none'"> 
                <span>Reus Championship</span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-btn active">Рейтинг команд</a>
                <a href="players.html" class="nav-btn">Рейтинг гравців</a>
                <button class="nav-btn" onclick="toggleTheme()" id="themeBtn">☀️</button>
            </div>
        </div>

        <h2 class="section-header-title">Рейтинг команд (Team Ranking)</h2>
        
        <div id="teamsContainer">
            <div class="loading">Завантаження команд із хмари...</div>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        function initTheme() {
            const savedTheme = localStorage.getItem('reus_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeBtn').innerText = savedTheme === 'light' ? '🌙' : '☀️';
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('reus_theme', newTheme);
            document.getElementById('themeBtn').innerText = newTheme === 'light' ? '🌙' : '☀️';
        }

        initTheme();

        async function fetchTeamsData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const rawRecord = result.record || result;
                const cloudData = rawRecord.record || rawRecord;

                const teams = cloudData.teams || [];
                teams.sort((a, b) => (parseInt(b.points) || 0) - (parseInt(a.points) || 0));

                renderTeams(teams);
            } catch (err) {
                console.error(err);
                document.getElementById('teamsContainer').innerHTML = '<div class="loading" style="color: var(--danger-color);">Помилка завантаження даних команд.</div>';
            }
        }

        function renderTeams(teams) {
            const container = document.getElementById('teamsContainer');
            if (teams.length === 0) {
                container.innerHTML = '<div class="loading">Ще немає доданих команд.</div>';
                return;
            }

            let html = '';
            teams.forEach((t, index) => {
                const defaultSvg = `<svg width="25" height="25" fill="var(--text-muted)" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>`;
                const logoContent = t.logo && t.logo.trim() !== '' 
                    ? `<img src="${t.logo}" onerror="this.parentElement.innerHTML='${defaultSvg.replace(/"/g, '&quot;')}'">` 
                    : defaultSvg;

                const safeName = encodeURIComponent(t.name);

                html += `
                    <div class="team-row-card" onclick="window.location.href='team.html?name=${safeName}'">
                        <div class="team-info-left">
                            <div class="rank-number">#${index + 1}</div>
                            <div class="team-logo-small">${logoContent}</div>
                            <div class="team-details">
                                <h3>${t.name}</h3>
                            </div>
                        </div>
                        <div class="team-stats-right">
                            <div class="stat-group">
                                <span class="stat-label">Points</span>
                                <span class="stat-val">${t.points || 0}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        fetchTeamsData();
    </script>
</body>
</html>
