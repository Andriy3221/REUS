<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель адміністратора | REUS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #131820;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
        }
        h1, h2 {
            color: #00ff88;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 10px;
        }
        /* Вкладки */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .tab-btn {
            background: #1a222f;
            color: #8a99ad;
            border: 1px solid #1f2937;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #00ff88;
            color: #0b0e14;
            border-color: #00ff88;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            color: #8a99ad;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #1a222f;
            border: 1px solid #1f2937;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button.action-btn {
            background: #00ff88;
            color: #0b0e14;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }
        button.action-btn:hover {
            opacity: 0.9;
        }
        .btn-danger {
            background: #ff4d4d;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a222f;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #1f2937;
        }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #8a99ad;
            text-decoration: none;
        }
        .back-link:hover {
            color: #00ff88;
        }
        .success-msg {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚙️ Панель управління REUS</h1>
        <div id="success" class="success-msg">Зміни успішно збережено!</div>

        <!-- Кнопки перемикання вкладок -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('teamsTab', this)">🏆 Керування командами</button>
            <button class="tab-btn" onclick="switchTab('playersTab', this)">👥 Керування гравцями</button>
        </div>

        <!-- ВКЛАДКА 1: Команди -->
        <div id="teamsTab" class="tab-content active">
            <h2>🏆 Додати або редагувати команду</h2>
            <div class="form-group">
                <label>Назва команди</label>
                <input type="text" id="teamNameInput" placeholder="Наприклад: Yami Esports">
            </div>
            <div class="form-group">
                <label>Файл логотипу (наприклад: Yami.jpg)</label>
                <input type="text" id="teamLogoInput" placeholder="Yami.jpg">
            </div>
            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex:1;">
                    <label>Valve Rank (#)</label>
                    <input type="text" id="teamValveRank" value="#1">
                </div>
                <div style="flex:1;">
                    <label>World Rank (#)</label>
                    <input type="text" id="teamWorldRank" value="#1">
                </div>
            </div>
            <button class="action-btn" onclick="saveTeam()">Зберегти команду</button>

            <h3 style="margin-top: 25px; color: #8a99ad; font-size: 1rem;">Існуючі команди:</h3>
            <div id="teamsListContainer"></div>
        </div>

        <!-- ВКЛАДКА 2: Гравці -->
        <div id="playersTab" class="tab-content">
            <h2>👥 Додати або редагувати гравця</h2>
            <div class="form-group">
                <label>Нікнейм гравця</label>
                <input type="text" id="playerNameInput" placeholder="Наприклад: oz1k">
            </div>
            <div class="form-group">
                <label>Файл фото гравця (наприклад: player1.png)</label>
                <input type="text" id="playerPhotoInput" placeholder="player1.png">
            </div>
            <div class="form-group">
                <label>Команда або статус</label>
                <select id="playerTeamSelect">
                    <!-- Заповнюється через JS -->
                </select>
            </div>
            <button class="action-btn" onclick="savePlayer()">Зберегти гравця</button>

            <h3 style="margin-top: 25px; color: #8a99ad; font-size: 1rem;">Список гравців:</h3>
            <div id="playersListContainer"></div>
        </div>

        <br>
        <a href="index.html" class="back-link">← На головну сайту</a>
    </div>

    <script>
        // Перемикання вкладок
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Базова ініціалізація, якщо дані відсутні
        if (!localStorage.getItem('reus_teams')) {
            const defaultTeams = [
                { name: 'Yami Esports', logo: 'Yami.jpg', valveRank: '#1', worldRank: '#1' }
            ];
            localStorage.setItem('reus_teams', JSON.stringify(defaultTeams));
        }

        if (!localStorage.getItem('reus_players')) {
            const defaultPlayers = [
                { name: 'oz1k', photo: 'player1.png', team: 'Yami Esports' },
                { name: 'r1kizy', photo: 'player2.png', team: 'Yami Esports' },
                { name: 'Yokirito', photo: 'player3.png', team: 'Yami Esports' },
                { name: 'Fexum', photo: 'player4.png', team: 'Yami Esports' },
                { name: 'darkpr1nc9', photo: 'player5.png', team: 'Yami Esports' }
            ];
            localStorage.setItem('reus_players', JSON.stringify(defaultPlayers));
        }

        function showSuccess() {
            const msg = document.getElementById('success');
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 3000);
            renderAll();
        }

        function updateTeamDropdown() {
            const select = document.getElementById('playerTeamSelect');
            const teams = JSON.parse(localStorage.getItem('reus_teams')) || [];
            
            let options = `
                <option value="Free Agent">Вільний агент (Free Agent)</option>
                <option value="Inactive">Інактив (Inactive)</option>
            `;
            teams.forEach(t => {
                options += `<option value="${t.name}">${t.name}</option>`;
            });
            select.innerHTML = options;
        }

        // Збереження команди
        function saveTeam() {
            const name = document.getElementById('teamNameInput').value.trim();
            const logo = document.getElementById('teamLogoInput').value.trim();
            const valveRank = document.getElementById('teamValveRank').value.trim();
            const worldRank = document.getElementById('teamWorldRank').value.trim();

            if (!name || !logo) {
                alert('Введіть назву команди та файл логотипу!');
                return;
            }

            let teams = JSON.parse(localStorage.getItem('reus_teams')) || [];
            let index = teams.findIndex(t => t.name.toLowerCase() === name.toLowerCase());

            if (index >= 0) {
                teams[index] = { name, logo, valveRank, worldRank };
            } else {
                teams.push({ name, logo, valveRank, worldRank });
            }

            localStorage.setItem('reus_teams', JSON.stringify(teams));
            showSuccess();
        }

        function deleteTeam(name) {
            let teams = JSON.parse(localStorage.getItem('reus_teams')) || [];
            teams = teams.filter(t => t.name !== name);
            localStorage.setItem('reus_teams', JSON.stringify(teams));
            renderAll();
        }

        // Збереження гравця
        function savePlayer() {
            const name = document.getElementById('playerNameInput').value.trim();
            const photo = document.getElementById('playerPhotoInput').value.trim();
            const team = document.getElementById('playerTeamSelect').value;

            if (!name || !photo) {
                alert('Введіть нікнейм гравця та файл фото!');
                return;
            }

            let players = JSON.parse(localStorage.getItem('reus_players')) || [];
            let index = players.findIndex(p => p.name.toLowerCase() === name.toLowerCase());

            // Оновлюємо трансфери
            const transferText = `[${new Date().toISOString().split('T')[0]}] Гравця <strong>${name}</strong> переведено у <em>${team}</em>.`;
            localStorage.setItem('yami_transfer', transferText);

            if (index >= 0) {
                players[index] = { name, photo, team };
            } else {
                players.push({ name, photo, team });
            }

            localStorage.setItem('reus_players', JSON.stringify(players));
            showSuccess();
        }

        function deletePlayer(name) {
            let players = JSON.parse(localStorage.getItem('reus_players')) || [];
            players = players.filter(p => p.name !== name);
            localStorage.setItem('reus_players', JSON.stringify(players));
            renderAll();
        }

        function renderAll() {
            updateTeamDropdown();

            // Рендер команд в адмінці
            const teamsContainer = document.getElementById('teamsListContainer');
            let teams = JSON.parse(localStorage.getItem('reus_teams')) || [];
            teamsContainer.innerHTML = teams.length === 0 ? '<p style="color: #8a99ad;">Немає команд.</p>' : '';
            teams.forEach(t => {
                teamsContainer.innerHTML += `
                    <div class="item-row">
                        <span>🏆 <strong>${t.name}</strong> (Лого: ${t.logo})</span>
                        <button class="btn-danger" onclick="deleteTeam('${t.name}')">Видалити</button>
                    </div>
                `;
            });

            // Рендер гравців в адмінці
            const playersContainer = document.getElementById('playersListContainer');
            let players = JSON.parse(localStorage.getItem('reus_players')) || [];
            playersContainer.innerHTML = players.length === 0 ? '<p style="color: #8a99ad;">Немає гравців.</p>' : '';
            players.forEach(p => {
                playersContainer.innerHTML += `
                    <div class="item-row">
                        <span>👤 <strong>${p.name}</strong> ➔ <em>${p.team}</em></span>
                        <button class="btn-danger" onclick="deletePlayer('${p.name}')">Видалити</button>
                    </div>
                `;
            });
        }

        renderAll();
    </script>

</body>
</html>
