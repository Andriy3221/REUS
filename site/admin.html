<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | REUS</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(13, 17, 23, 0.9);
            --inner-card-bg: #111620;
            --border-color: #21262d;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8b949e;
            --danger-color: #ff4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1, h2 {
            color: var(--accent-color);
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: var(--inner-card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        input:focus, select:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        button {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.85;
        }
        .btn-danger {
            background: var(--danger-color);
            color: #fff;
        }
        .players-list, .teams-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--inner-card-bg);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        /* Модальне вікно редагування */
        #editModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Панель керування REUS</h1>
        <a href="index.html" style="color: var(--accent-color); text-decoration: none; display: inline-block; margin-bottom: 20px;">← Назад на сайт</a>

        <!-- Блок керування гравцями -->
        <div class="card">
            <h2>Гравці в базі</h2>
            <div id="playersList" class="players-list">
                <div style="color: var(--text-muted);">Завантаження гравців...</div>
            </div>
        </div>
    </div>

    <!-- Модальне вікно редагування гравця -->
    <div id="editModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-top: 0;">Редагувати гравця</h2>
            <input type="hidden" id="editPlayerOriginalName">
            
            <div class="form-group">
                <label>Нікнейм гравця</label>
                <input type="text" id="editPlayerName">
            </div>

            <div class="form-group">
                <label>Команда</label>
                <input type="text" id="editPlayerTeam">
            </div>

            <div class="form-group">
                <label>Роль</label>
                <input type="text" id="editPlayerRole">
            </div>

            <div class="form-group">
                <label>Країна (код, напр. ua)</label>
                <input type="text" id="editPlayerCountry">
            </div>

            <div class="form-group">
                <label>Пряме посилання на фото (URL)</label>
                <input type="text" id="editPlayerPhoto">
            </div>

            <div class="form-group">
                <label>Rating 2.0</label>
                <input type="text" id="editPlayerRating">
            </div>

            <div class="form-group">
                <label>K/D Ratio</label>
                <input type="text" id="editPlayerKd">
            </div>

            <!-- БЛОК ОСОБИСТИХ ТРОФЕЇВ ГРАВЦЯ -->
            <div style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                <label style="color: var(--accent-color); font-weight: bold; margin-bottom: 8px; display: block;">Особисті трофеї гравця (URL іконки або назва)</label>
                <div id="adminPlayerTrophiesContainer" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;">
                    <!-- Сюди додаються інпути трофеїв -->
                </div>
                <button type="button" onclick="addAdminPlayerTrophyInput('')" style="background: transparent; color: var(--accent-color); border: 1px dashed var(--accent-color); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">+ Додати трофей</button>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button type="button" onclick="saveEditedPlayer()" style="flex: 1;">Зберегти зміни</button>
                <button type="button" onclick="closeEditModal()" class="btn-danger" style="flex: 1;">Скасувати</button>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        let globalData = {};

        async function loadData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                globalData = result.record || result;
                if (globalData.record) globalData = globalData.record; // На випадок вкладеності
                
                renderPlayersList();
            } catch (err) {
                console.error(err);
                document.getElementById('playersList').innerHTML = '<div style="color: var(--danger-color);">Помилка завантаження бази даних.</div>';
            }
        }

        function renderPlayersList() {
            const players = globalData.players || [];
            const container = document.getElementById('playersList');
            if (players.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted);">Гравців немає в базі.</div>';
                return;
            }

            container.innerHTML = '';
            players.forEach((p, index) => {
                const pName = p.name || p.nickname || 'Без імені';
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <span><b>${pName}</b> (${p.team || 'Без команди'})</span>
                    <button onclick="openEditModal(${index})">Редагувати</button>
                `;
                container.appendChild(row);
            });
        }

        // Функції для роботи з трофеями у модальному вікні
        function addAdminPlayerTrophyInput(value = '') {
            const container = document.getElementById('adminPlayerTrophiesContainer');
            const wrapper = document.createElement('div');
            wrapper.style.display = 'flex';
            wrapper.style.gap = '8px';
            
            wrapper.innerHTML = `
                <input type="text" class="player-trophy-input" value="${value}" placeholder="Посилання на іконку (URL) або назва" style="flex: 1;">
                <button type="button" onclick="this.parentElement.remove()" class="btn-danger" style="padding: 0 10px;">✕</button>
            `;
            container.appendChild(wrapper);
        }

        function loadPlayerTrophiesToForm(playerTrophies) {
            const container = document.getElementById('adminPlayerTrophiesContainer');
            container.innerHTML = '';
            if (playerTrophies && Array.isArray(playerTrophies)) {
                playerTrophies.forEach(t => {
                    const val = typeof t === 'object' && t !== null ? (t.icon || t.name || '') : t;
                    addAdminPlayerTrophyInput(val);
                });
            }
        }

        function collectPlayerTrophiesFromForm() {
            let trophies = [];
            document.querySelectorAll('.player-trophy-input').forEach(input => {
                if (input.value.trim() !== '') {
                    trophies.push(input.value.trim());
                }
            });
            return trophies;
        }

        let editingPlayerIndex = null;

        function openEditModal(index) {
            editingPlayerIndex = index;
            const p = globalData.players[index];

            document.getElementById('editPlayerOriginalName').value = p.name || p.nickname || '';
            document.getElementById('editPlayerName').value = p.name || p.nickname || '';
            document.getElementById('editPlayerTeam').value = p.team || '';
            document.getElementById('editPlayerRole').value = p.role || '';
            document.getElementById('editPlayerCountry').value = p.country || '';
            document.getElementById('editPlayerPhoto').value = p.photo || '';
            document.getElementById('editPlayerRating').value = p.rating || '';
            document.getElementById('editPlayerKd').value = p.kd || '';

            // Завантажуємо особисті трофеї гравця у форму
            loadPlayerTrophiesToForm(p.trophies || p.cups);

            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            editingPlayerIndex = null;
        }

        async function saveEditedPlayer() {
            if (editingPlayerIndex === null) return;

            const p = globalData.players[editingPlayerIndex];
            p.name = document.getElementById('editPlayerName').value.trim();
            p.nickname = p.name;
            p.team = document.getElementById('editPlayerTeam').value.trim();
            p.role = document.getElementById('editPlayerRole').value.trim();
            p.country = document.getElementById('editPlayerCountry').value.trim();
            p.photo = document.getElementById('editPlayerPhoto').value.trim();
            p.rating = document.getElementById('editPlayerRating').value.trim();
            p.kd = document.getElementById('editPlayerKd').value.trim();
            
            // Збираємо нові трофеї з інпутів та записуємо гравцю
            p.trophies = collectPlayerTrophiesFromForm();

            // Відправляємо оновлені дані на JSONBin
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(globalData)
                });

                if (res.ok) {
                    alert('Гравця успішно оновлено!');
                    closeEditModal();
                    renderPlayersList();
                } else {
                    alert('Помилка збереження на сервері.');
                }
            } catch (err) {
                console.error(err);
                alert('Помилка мережі при збереженні.');
            }
        }

        // Запуск завантаження даних при відкритті сторінки
        loadData();
    </script>
</body>
</html>
