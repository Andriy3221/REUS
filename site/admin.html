<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | REUS</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(13, 17, 23, 0.95);
            --inner-card-bg: #111620;
            --border-color: #21262d;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8b949e;
            --danger-color: #ff4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1, h2 {
            color: var(--accent-color);
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: var(--inner-card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        input:focus, select:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        button {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.85;
        }
        .btn-danger {
            background: var(--danger-color);
            color: #fff;
        }
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--inner-card-bg);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .row-actions {
            display: flex;
            gap: 8px;
        }
        /* Модальне вікно */
        #editModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Адмін-панель REUS</h1>
        <a href="index.html" style="color: var(--accent-color); text-decoration: none; display: inline-block; margin-bottom: 20px;">← Назад на сайт</a>

        <!-- 1. КЕРУВАННЯ КОМАНДАМИ ТА ЇХНІМИ ТРОФЕЯМИ -->
        <div class="card">
            <h2>Керування командами</h2>
            
            <!-- Додати нову команду -->
            <div class="form-group" style="background: var(--inner-card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 20px;">
                <label style="color: var(--accent-color); font-weight: bold;">Додати нову команду</label>
                <div style="display: flex; gap: 10px; margin-top: 8px;">
                    <input type="text" id="newTeamName" placeholder="Назва команди" style="flex: 2;">
                    <input type="number" id="newTeamPoints" placeholder="Очки" style="flex: 1;" value="0">
                    <button onclick="addNewTeam()" style="width: auto;">Створити</button>
                </div>
            </div>

            <!-- Видати трофей команді -->
            <div class="form-group" style="background: var(--inner-card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);">
                <label style="color: var(--accent-color); font-weight: bold; margin-bottom: 8px;">Видати командний трофей</label>
                <div class="grid-2">
                    <select id="trophyTeamSelect">
                        <option value="">Оберіть команду</option>
                    </select>
                    <input type="text" id="trophyNameInput" placeholder="Назва турніру (напр. BLAST)">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <input type="text" id="trophyIconInput" value="🏆" placeholder="URL іконки або emoji" style="flex: 1;">
                    <button onclick="addTrophyToTeam()" style="width: auto;">Додати трофей</button>
                </div>
            </div>

            <!-- Список команд -->
            <div id="teamsList" class="list-container" style="margin-top: 20px;">
                <div style="color: var(--text-muted);">Завантаження команд...</div>
            </div>
        </div>

        <!-- 2. КЕРУВАННЯ ГРАВЦЯМИ (HLTV + ОСОБИСТІ ТРОФЕЇ) -->
        <div class="card">
            <h2>Керування гравцями</h2>
            <div id="playersList" class="list-container">
                <div style="color: var(--text-muted);">Завантаження гравців...</div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО РЕДАГУВАННЯ ГРАВЦЯ -->
    <div id="editModal">
        <div class="modal-content">
            <h2 style="margin-top: 0; color: var(--accent-color);">Редагувати гравця (HLTV профіль)</h2>
            <input type="hidden" id="editPlayerIndex">
            
            <div class="grid-2">
                <div class="form-group">
                    <label>Нікнейм гравця</label>
                    <input type="text" id="editPlayerName">
                </div>
                <div class="form-group">
                    <label>Команда</label>
                    <input type="text" id="editPlayerTeam">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Роль</label>
                    <input type="text" id="editPlayerRole" placeholder="Rifler / AWPer тощо">
                </div>
                <div class="form-group">
                    <label>Країна (код, напр. ua, us, dk, se)</label>
                    <input type="text" id="editPlayerCountry">
                </div>
            </div>

            <div class="form-group">
                <label>Пряме посилання на фото (URL)</label>
                <input type="text" id="editPlayerPhoto">
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Rating 2.0</label>
                    <input type="text" id="editPlayerRating">
                </div>
                <div class="form-group">
                    <label>K/D Ratio</label>
                    <input type="text" id="editPlayerKd">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Impact</label>
                    <input type="text" id="editPlayerImpact">
                </div>
                <div class="form-group">
                    <label>ADR (Шкода за раунд)</label>
                    <input type="text" id="editPlayerAdr">
                </div>
            </div>

            <!-- АДМІН ПЕНАЛЬ: ОСОБИСТІ ТРОФЕЇ ГРАВЦЯ -->
            <div style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                <label style="color: var(--accent-color); font-weight: bold; margin-bottom: 8px; display: block;">Особисті трофеї гравця (Адмін пеналь)</label>
                <div id="adminPlayerTrophiesContainer" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;">
                    <!-- Сюди додаватимуться інпути -->
                </div>
                <button type="button" onclick="addAdminPlayerTrophyInput('')" style="background: transparent; color: var(--accent-color); border: 1px dashed var(--accent-color); padding: 6px 12px; font-size: 0.85rem; width: auto;">+ Додати особистий трофей</button>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button type="button" onclick="saveEditedPlayer()" style="flex: 1;">Зберегти зміни</button>
                <button type="button" onclick="closeEditModal()" class="btn-danger" style="flex: 1;">Скасувати</button>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        let globalData = {};

        async function loadData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                globalData = result.record || result;
                if (globalData.record) globalData = globalData.record;

                renderTeamsList();
                renderPlayersList();
                updateTeamSelect();
            } catch (err) {
                console.error(err);
                alert('Помилка завантаження бази даних.');
            }
        }

        async function saveData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(globalData)
                });
                if (!res.ok) alert('Помилка збереження на сервері!');
            } catch (err) {
                console.error(err);
                alert('Помилка мережі при збереженні.');
            }
        }

        function updateTeamSelect() {
            const select = document.getElementById('trophyTeamSelect');
            const teams = globalData.teams || [];
            select.innerHTML = '<option value="">Оберіть команду</option>';
            teams.forEach(t => {
                select.innerHTML += `<option value="${t.name}">${t.name}</option>`;
            });
        }

        // --- РОБОТА З КОМАНДАМИ ---
        function renderTeamsList() {
            const teams = globalData.teams || [];
            const container = document.getElementById('teamsList');
            if (teams.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted);">Команд немає в базі.</div>';
                return;
            }
            container.innerHTML = '';
            teams.forEach((t, index) => {
                const cupsCount = (t.trophies || t.cups || []).length;
                container.innerHTML += `
                    <div class="item-row">
                        <span><b>${t.name}</b> — Очки: <input type="number" value="${t.points || 0}" onchange="updateTeamPoints(${index}, this.value)" style="width: 80px; display:inline-block; padding: 4px;"> | Кубків: ${cupsCount}</span>
                        <div class="row-actions">
                            <button onclick="deleteTeam(${index})" class="btn-danger">Видалити</button>
                        </div>
                    </div>
                `;
            });
        }

        async function addNewTeam() {
            const name = document.getElementById('newTeamName').value.trim();
            const points = parseInt(document.getElementById('newTeamPoints').value) || 0;
            if (!name) return alert('Введіть назву команди!');

            if (!globalData.teams) globalData.teams = [];
            globalData.teams.push({ name, points, trophies: [] });

            await saveData();
            document.getElementById('newTeamName').value = '';
            document.getElementById('newTeamPoints').value = '0';
            renderTeamsList();
            updateTeamSelect();
            alert('Команду створено!');
        }

        async function updateTeamPoints(index, val) {
            globalData.teams[index].points = parseInt(val) || 0;
            await saveData();
        }

        async function deleteTeam(index) {
            if (confirm('Видалити цю команду?')) {
                globalData.teams.splice(index, 1);
                await saveData();
                renderTeamsList();
                updateTeamSelect();
            }
        }

        async function addTrophyToTeam() {
            const teamName = document.getElementById('trophyTeamSelect').value;
            const trophyName = document.getElementById('trophyNameInput').value.trim();
            const trophyIcon = document.getElementById('trophyIconInput').value.trim() || '🏆';

            if (!teamName || !trophyName) return alert('Оберіть команду та введіть назву турніру!');

            const team = (globalData.teams || []).find(t => t.name === teamName);
            if (team) {
                if (!team.trophies) team.trophies = [];
                team.trophies.push({ name: trophyName, icon: trophyIcon });

                await saveData();
                alert('Трофей успішно додано команді!');
                document.getElementById('trophyNameInput').value = '';
                renderTeamsList();
            }
        }

        // --- РОБОТА З ГРАВЦЯМИ ---
        function renderPlayersList() {
            const players = globalData.players || [];
            const container = document.getElementById('playersList');
            if (players.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted);">Гравців немає в базі.</div>';
                return;
            }
            container.innerHTML = '';
            players.forEach((p, index) => {
                const pName = p.name || p.nickname || 'Гравець';
                container.innerHTML += `
                    <div class="item-row">
                        <span><b>${pName}</b> (${p.team || 'Без команди'}) | K/D: ${p.kd || '-'} | Rating: ${p.rating || '-'}</span>
                        <div class="row-actions">
                            <button onclick="openEditModal(${index})">Редагувати</button>
                            <button onclick="deletePlayer(${index})" class="btn-danger">Видалити</button>
                        </div>
                    </div>
                `;
            });
        }

        // Додавання поля для індивідуального трофею у модалці
        function addAdminPlayerTrophyInput(value = '') {
            const container = document.getElementById('adminPlayerTrophiesContainer');
            const wrapper = document.createElement('div');
            wrapper.style.display = 'flex';
            wrapper.style.gap = '8px';
            
            wrapper.innerHTML = `
                <input type="text" class="player-trophy-input" value="${value}" placeholder="URL іконки або назва трофею" style="flex: 1;">
                <button type="button" onclick="this.parentElement.remove()" class="btn-danger" style="padding: 0 10px;">✕</button>
            `;
            container.appendChild(wrapper);
        }

        function openEditModal(index) {
            document.getElementById('editPlayerIndex').value = index;
            const p = globalData.players[index];

            document.getElementById('editPlayerName').value = p.name || p.nickname || '';
            document.getElementById('editPlayerTeam').value = p.team || '';
            document.getElementById('editPlayerRole').value = p.role || '';
            document.getElementById('editPlayerCountry').value = p.country || '';
            document.getElementById('editPlayerPhoto').value = p.photo || '';
            document.getElementById('editPlayerRating').value = p.rating || '';
            document.getElementById('editPlayerKd').value = p.kd || '';
            document.getElementById('editPlayerImpact').value = p.impact || '';
            document.getElementById('editPlayerAdr').value = p.adr || '';

            // Завантажуємо особисті трофеї гравця (адмін пеналь)
            const container = document.getElementById('adminPlayerTrophiesContainer');
            container.innerHTML = '';
            const trophies = p.trophies || p.cups || [];
            trophies.forEach(t => {
                const val = typeof t === 'object' && t !== null ? (t.icon || t.name || '') : t;
                addAdminPlayerTrophyInput(val);
            });

            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function saveEditedPlayer() {
            const index = document.getElementById('editPlayerIndex').value;
            if (index === '') return;

            const p = globalData.players[index];
            p.name = document.getElementById('editPlayerName').value.trim();
            p.nickname = p.name;
            p.team = document.getElementById('editPlayerTeam').value.trim();
            p.role = document.getElementById('editPlayerRole').value.trim();
            p.country = document.getElementById('editPlayerCountry').value.trim().toLowerCase();
            p.photo = document.getElementById('editPlayerPhoto').value.trim();
            p.rating = document.getElementById('editPlayerRating').value.trim();
            p.kd = document.getElementById('editPlayerKd').value.trim();
            p.impact = document.getElementById('editPlayerImpact').value.trim();
            p.adr = document.getElementById('editPlayerAdr').value.trim();

            // Збираємо особисті трофеї гравця
            let trophies = [];
            document.querySelectorAll('.player-trophy-input').forEach(input => {
                if (input.value.trim() !== '') {
                    trophies.push(input.value.trim());
                }
            });
            p.trophies = trophies;

            await saveData();
            closeEditModal();
            renderPlayersList();
            alert('Гравця успішно оновлено!');
        }

        async function deletePlayer(index) {
            if (confirm('Видалити гравця з бази?')) {
                globalData.players.splice(index, 1);
                await saveData();
                renderPlayersList();
            }
        }

        loadData();
    </script>
</body>
</html>
