<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель адміністратора | REUS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #131820;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 25px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 10px;
            color: #00ff88;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            color: #8a99ad;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #1a222f;
            border: 1px solid #1f2937;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            background: #00ff88;
            color: #0b0e14;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #8a99ad;
            text-decoration: none;
        }
        .back-link:hover {
            color: #00ff88;
        }
        .success-msg {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚙️ Секретна панель адміністратора</h1>
        
        <div id="success" class="success-msg">Зміни успішно збережено!</div>

        <div class="form-group">
            <label>Назва команди</label>
            <input type="text" id="inputTeamName" value="Yami Esports">
        </div>

        <div class="form-group">
            <label>Valve ranking (#)</label>
            <input type="text" id="inputValveRank" value="#1">
        </div>

        <div class="form-group">
            <label>World ranking (#)</label>
            <input type="text" id="inputWorldRank" value="#1">
        </div>

        <div class="form-group">
            <label>Текст нового трансферу</label>
            <input type="text" id="inputTransfer" value="Гравця oz1k переведено у Yami Esports.">
        </div>

        <button onclick="saveData()">Зберегти зміни</button>

        <br>
        <a href="index.html" class="back-link">← На головну сайту</a>
    </div>

    <script>
        // Завантаження збережених даних (якщо вони є в браузері)
        document.getElementById('inputTeamName').value = localStorage.getItem('yami_teamName') || 'Yami Esports';
        document.getElementById('inputValveRank').value = localStorage.getItem('yami_valveRank') || '#1';
        document.getElementById('inputWorldRank').value = localStorage.getItem('yami_worldRank') || '#1';
        document.getElementById('inputTransfer').value = localStorage.getItem('yami_transfer') || 'Гравця oz1k переведено у Yami Esports.';

        function saveData() {
            localStorage.setItem('yami_teamName', document.getElementById('inputTeamName').value);
            localStorage.setItem('yami_valveRank', document.getElementById('inputWordlRank'] || document.getElementById('inputValveRank').value);
            localStorage.setItem('yami_valveRank', document.getElementById('inputValveRank').value);
            localStorage.setItem('yami_worldRank', document.getElementById('inputWorldRank').value);
            localStorage.setItem('yami_transfer', document.getElementById('inputTransfer').value);

            const msg = document.getElementById('success');
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 3000);
        }
    </script>

</body>
</html>
