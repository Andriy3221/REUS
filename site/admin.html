<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | REUS</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
            --danger-color: #ff4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1, h2 {
            color: var(--text-color);
        }
        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        input, select {
            width: 100%;
            padding: 10px 15px;
            background: #1a222f;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-danger {
            background: var(--danger-color);
            color: #fff;
            width: auto;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a222f;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        .status-msg {
            margin-top: 10px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .preview-img {
            max-width: 40px;
            max-height: 40px;
            margin-left: 10px;
            border-radius: 4px;
            background: #000;
            object-fit: contain;
            vertical-align: middle;
        }
        .preview-flag {
            width: 20px;
            height: 14px;
            object-fit: cover;
            border-radius: 2px;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>⚙️ Панель керування REUS</h1>
        <div id="globalStatus" class="status-msg" style="color: var(--accent-color);"></div>

        <!-- Додавання команди -->
        <div class="section-box">
            <h2>Додати команду</h2>
            <input type="text" id="teamName" placeholder="Назва команди (наприклад, Yami Esports)">
            <input type="text" id="teamLogo" placeholder="Посилання на логотип команди (URL)">
            <input type="text" id="teamRank" placeholder="Рейтинг (наприклад, #1 або 1)">
            <button onclick="addTeam()">Зберегти команду</button>
        </div>

        <!-- Додавання гравця -->
        <div class="section-box">
            <h2>Додати гравця</h2>
            <select id="playerTeamSelect">
                <option value="">Оберіть команду</option>
            </select>
            <input type="text" id="playerName" placeholder="Нікнейм гравця (наприклад, oz1k)">
            <input type="text" id="playerPhoto" placeholder="Посилання на фото гравця (URL)">
            <input type="text" id="playerCountry" placeholder="Код країни (наприклад: ua, pl, dk, se)">
            <button onclick="addPlayer()">Зберегти гравця</button>
        </div>

        <!-- Додавання трансферу -->
        <div class="section-box">
            <h2>Додати трансфер</h2>
            <input type="text" id="transferText" placeholder="Текст трансферу">
            <button onclick="addTransfer()">Додати трансфер</button>
        </div>

        <!-- Список поточних даних -->
        <div class="section-box">
            <h2>Поточні дані в базі</h2>
            <div id="dbList">Завантаження...</div>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        let cloudData = {
            teams: [],
            players: [],
            transfers: []
        };

        async function fetchCloudData() {
            setSt("Завантаження даних із хмари...", "#8a99ad");
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                cloudData = result.record || { teams: [], players: [], transfers: [] };
                
                if(!cloudData.teams) cloudData.teams = [];
                if(!cloudData.players) cloudData.players = [];
                if(!cloudData.transfers) cloudData.transfers = [];

                updateUI();
                setSt("Дані успішно завантажено!", "var(--accent-color)");
            } catch (err) {
                console.error(err);
                setSt("Помилка завантаження з хмари!", "var(--danger-color)");
            }
        }

        async function saveCloudData() {
            setSt("Збереження у хмару...", "#ffaa00");
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(cloudData)
                });
                if (res.ok) {
                    setSt("Успішно збережено у хмару!", "var(--accent-color)");
                    updateUI();
                } else {
                    setSt("Помилка збереження!", "var(--danger-color)");
                }
            } catch (err) {
                console.error(err);
                setSt("Помилка мережі при збереженні!", "var(--danger-color)");
            }
        }

        function setSt(text, color) {
            const el = document.getElementById('globalStatus');
            el.innerText = text;
            el.style.color = color;
        }

        function addTeam() {
            const name = document.getElementById('teamName').value.trim();
            const logo = document.getElementById('teamLogo').value.trim();
            const valveRank = document.getElementById('teamRank').value.trim() || '#1';

            if (!name) {
                alert('Введіть назву команди!');
                return;
            }

            cloudData.teams.push({ name, logo, valveRank });
            saveCloudData();

            document.getElementById('teamName').value = '';
            document.getElementById('teamLogo').value = '';
            document.getElementById('teamRank').value = '';
        }

        function addPlayer() {
            const team = document.getElementById('playerTeamSelect').value;
            const name = document.getElementById('playerName').value.trim();
            const photo = document.getElementById('playerPhoto').value.trim();
            const country = document.getElementById('playerCountry').value.trim().toLowerCase() || 'ua';

            if (!team || !name) {
                alert('Оберіть команду та введіть нікнейм гравця!');
                return;
            }

            cloudData.players.push({ team, name, photo, country });
            saveCloudData();

            document.getElementById('playerName').value = '';
            document.getElementById('playerPhoto').value = '';
            document.getElementById('playerCountry').value = '';
        }

        function addTransfer() {
            const text = document.getElementById('transferText').value.trim();
            if (!text) {
                alert('Введіть текст трансферу!');
                return;
            }

            cloudData.transfers.unshift(text);
            saveCloudData();
            document.getElementById('transferText').value = '';
        }

        function deleteTeam(index) {
            cloudData.teams.splice(index, 1);
            saveCloudData();
        }

        function deletePlayer(index) {
            cloudData.players.splice(index, 1);
            saveCloudData();
        }

        function deleteTransfer(index) {
            cloudData.transfers.splice(index, 1);
            saveCloudData();
        }

        function updateUI() {
            const select = document.getElementById('playerTeamSelect');
            select.innerHTML = '<option value="">Оберіть команду</option>';
            cloudData.teams.forEach(t => {
                select.innerHTML += `<option value="${t.name}">${t.name}</option>`;
            });

            const list = document.getElementById('dbList');
            if (cloudData.teams.length === 0 && cloudData.players.length === 0 && cloudData.transfers.length === 0) {
                list.innerHTML = '<p style="color: var(--text-muted);">База даних поки порожня.</p>';
                return;
            }

            let html = '<h3>Команди:</h3>';
            cloudData.teams.forEach((t, i) => {
                const imgTag = t.logo ? `<img src="${t.logo}" class="preview-img" onerror="this.style.display='none'">` : '';
                html += `<div class="item-row"><span><b>${t.name}</b> (${t.valveRank || '#1'}) ${imgTag}</span> <button class="btn-danger" onclick="deleteTeam(${i})">Видалити</button></div>`;
            });

            html += '<h3>Гравці:</h3>';
            cloudData.players.forEach((p, i) => {
                const countryCode = (p.country || 'ua').toLowerCase();
                const flagTag = `<img src="https://flagcdn.com/w20/${countryCode}.png" class="preview-flag" alt="${countryCode}">`;
                const imgTag = p.photo ? `<img src="${p.photo}" class="preview-img" onerror="this.style.display='none'">` : '';
                html += `<div class="item-row"><span>${flagTag}<b>${p.name}</b> [команда: ${p.team}] ${imgTag}</span> <button class="btn-danger" onclick="deletePlayer(${i})">Видалити</button></div>`;
            });

            html += '<h3>Трансфери:</h3>';
            cloudData.transfers.forEach((tr, i) => {
                html += `<div class="item-row"><span>${tr}</span> <button class="btn-danger" onclick="deleteTransfer(${i})">Видалити</button></div>`;
            });

            list.innerHTML = html;
        }

        fetchCloudData();
    </script>
</body>
</html>
