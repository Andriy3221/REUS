<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | REUS</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --inner-card-bg: #19233c;
            --border-color: #2a3655;
            --accent-color: #00ff88;
            --accent-hover: #00cc6a;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        h1, h2 {
            color: var(--accent-color);
            margin: 0 0 15px 0;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 11px 14px;
            background: var(--inner-card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        button {
            background: var(--accent-color);
            color: #050b14;
            border: none;
            padding: 11px 20px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background: var(--accent-hover);
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-danger {
            background: var(--danger-color);
            color: #fff;
        }
        .btn-danger:hover {
            background: var(--danger-hover);
        }
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--inner-card-bg);
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .row-actions {
            display: flex;
            gap: 10px;
        }
        .row-actions button {
            padding: 7px 14px;
            font-size: 0.85rem;
        }
        #modalOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .back-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Адмін-панель REUS</h1>
            <a href="index.html" class="back-link">← На сайт</a>
        </header>

        <!-- РОБОТА З КОМАНДАМИ -->
        <div class="card">
            <h2>Керування командами</h2>
            
            <div class="form-group" style="background: var(--inner-card-bg); padding: 18px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 20px;">
                <label style="color: var(--accent-color); font-weight: 600;">Створити нову команду</label>
                <div style="display: flex; gap: 12px; margin-top: 8px;">
                    <input type="text" id="newTeamName" placeholder="Назва команди" style="flex: 2;">
                    <input type="number" id="newTeamPoints" placeholder="Очки" style="flex: 1;" value="0">
                    <button onclick="addNewTeam()" style="width: auto;">Створити</button>
                </div>
            </div>

            <div class="form-group" style="background: var(--inner-card-bg); padding: 18px; border-radius: 10px; border: 1px solid var(--border-color);">
                <label style="color: var(--accent-color); font-weight: 600; margin-bottom: 10px;">Видати командний трофей</label>
                <div class="grid-2">
                    <select id="trophyTeamSelect">
                        <option value="">Оберіть команду</option>
                    </select>
                    <input type="text" id="trophyNameInput" placeholder="Назва турніру (напр. BLAST Premier)">
                </div>
                <div style="display: flex; gap: 12px; margin-top: 12px;">
                    <input type="text" id="trophyIconInput" value="🏆" placeholder="URL іконки або emoji" style="flex: 1;">
                    <button onclick="addTrophyToTeam()" style="width: auto;">Додати трофей</button>
                </div>
            </div>

            <div id="teamsList" class="list-container" style="margin-top: 20px;">
                <div style="color: var(--text-muted);">Завантаження команд...</div>
            </div>
        </div>

        <!-- РОБОТА З ГРАВЦЯМИ -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="margin: 0;">Керування гравцями</h2>
                <button onclick="openPlayerModalForAdd()">+ Додати гравця</button>
            </div>
            <div id="playersList" class="list-container">
                <div style="color: var(--text-muted);">Завантаження гравців...</div>
            </div>
        </div>
    </div>

    <!-- УНІВЕРСАЛЬНЕ МОДАЛЬНЕ ВІКНО (СТВОРЕННЯ / РЕДАГУВАННЯ ГРАВЦЯ) -->
    <div id="modalOverlay">
        <div class="modal-content">
            <h2 id="modalHeaderTitle" style="margin-top: 0; color: var(--accent-color);">Редагувати гравця</h2>
            <input type="hidden" id="editPlayerIndex">
            
            <div class="grid-2">
                <div class="form-group">
                    <label>Нікнейм гравця</label>
                    <input type="text" id="editPlayerName" placeholder="напр. s1mple">
                </div>
                <div class="form-group">
                    <label>Команда</label>
                    <input type="text" id="editPlayerTeam" placeholder="напр. Natus Vincere">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Роль</label>
                    <input type="text" id="editPlayerRole" placeholder="Rifler / AWPer тощо">
                </div>
                <div class="form-group">
                    <label>Країна (код, напр. ua, us, dk)</label>
                    <input type="text" id="editPlayerCountry" placeholder="ua">
                </div>
            </div>

            <div class="form-group">
                <label>Пряме посилання на фото (URL)</label>
                <input type="text" id="editPlayerPhoto" placeholder="https://...">
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Rating 2.0</label>
                    <input type="text" id="editPlayerRating" placeholder="1.20">
                </div>
                <div class="form-group">
                    <label>K/D Ratio</label>
                    <input type="text" id="editPlayerKd" placeholder="1.30">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Impact</label>
                    <input type="text" id="editPlayerImpact" placeholder="1.40">
                </div>
                <div class="form-group">
                    <label>ADR (Шкода за раунд)</label>
                    <input type="text" id="editPlayerAdr" placeholder="85.5">
                </div>
            </div>

            <!-- ОСОБИСТІ ТРОФЕЇ ГРАВЦЯ (Адмін пеналь) -->
            <div style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                <label style="color: var(--accent-color); font-weight: 600; margin-bottom: 8px; display: block;">Особисті трофеї гравця (Адмін пеналь)</label>
                <div id="adminPlayerTrophiesContainer" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;"></div>
                <button type="button" onclick="addAdminPlayerTrophyInput('')" style="background: transparent; color: var(--accent-color); border: 1px dashed var(--accent-color); padding: 6px 12px; font-size: 0.85rem; width: auto;">+ Додати особистий трофей</button>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 25px;">
                <button type="button" onclick="savePlayerFormData()" style="flex: 1;">Зберегти</button>
                <button type="button" onclick="closePlayerModal()" class="btn-danger" style="flex: 1;">Скасувати</button>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        let globalData = {};

        async function loadData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                globalData = result.record || result;
                if (globalData.record) globalData = globalData.record;

                renderTeamsList();
                renderPlayersList();
                updateTeamSelect();
            } catch (err) {
                console.error(err);
                alert('Помилка завантаження бази даних.');
            }
        }

        async function saveData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(globalData)
                });
                if (!res.ok) alert('Помилка збереження на сервері!');
            } catch (err) {
                console.error(err);
                alert('Помилка мережі при збереженні.');
            }
        }

        function updateTeamSelect() {
            const select = document.getElementById('trophyTeamSelect');
            const teams = globalData.teams || [];
            select.innerHTML = '<option value="">Оберіть команду</option>';
            teams.forEach(t => {
                select.innerHTML += `<option value="${t.name}">${t.name}</option>`;
            });
        }

        // Керування командами
        function renderTeamsList() {
            const teams = globalData.teams || [];
            const container = document.getElementById('teamsList');
            if (teams.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted);">Команд немає в базі.</div>';
                return;
            }
            container.innerHTML = '';
            teams.forEach((t, index) => {
                const cupsCount = (t.trophies || t.cups || []).length;
                container.innerHTML += `
                    <div class="item-row">
                        <span><b>${t.name}</b> — Очки: <input type="number" value="${t.points || 0}" onchange="updateTeamPoints(${index}, this.value)" style="width: 80px; display:inline-block; padding: 4px;"> | Кубків: ${cupsCount}</span>
                        <div class="row-actions">
                            <button onclick="deleteTeam(${index})" class="btn-danger">Видалити</button>
                        </div>
                    </div>
                `;
            });
        }

        async function addNewTeam() {
            const name = document.getElementById('newTeamName').value.trim();
            const points = parseInt(document.getElementById('newTeamPoints').value) || 0;
            if (!name) return alert('Введіть назву команди!');

            if (!globalData.teams) globalData.teams = [];
            globalData.teams.push({ name, points, trophies: [] });

            await saveData();
            document.getElementById('newTeamName').value = '';
            document.getElementById('newTeamPoints').value = '0';
            renderTeamsList();
            updateTeamSelect();
        }

        async function updateTeamPoints(index, val) {
            globalData.teams[index].points = parseInt(val) || 0;
            await saveData();
        }

        async function deleteTeam(index) {
            if (confirm('Видалити цю команду?')) {
                globalData.teams.splice(index, 1);
                await saveData();
                renderTeamsList();
                updateTeamSelect();
            }
        }

        async function addTrophyToTeam() {
            const teamName = document.getElementById('trophyTeamSelect').value;
            const trophyName = document.getElementById('trophyNameInput').value.trim();
            const trophyIcon = document.getElementById('trophyIconInput').value.trim() || '🏆';

            if (!teamName || !trophyName) return alert('Оберіть команду та введіть назву турніру!');

            const team = (globalData.teams || []).find(t => t.name === teamName);
            if (team) {
                if (!team.trophies) team.trophies = [];
                team.trophies.push({ name: trophyName, icon: trophyIcon });

                await saveData();
                alert('Трофей успішно додано команді!');
                document.getElementById('trophyNameInput').value = '';
                renderTeamsList();
            }
        }

        // Керування гравцями
        function renderPlayersList() {
            const players = globalData.players || [];
            const container = document.getElementById('playersList');
            if (players.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted);">Гравців немає в базі.</div>';
                return;
            }
            container.innerHTML = '';
            players.forEach((p, index) => {
                const pName = p.name || p.nickname || 'Гравець';
                container.innerHTML += `
                    <div class="item-row">
                        <span><b>${pName}</b> (${p.team || 'Без команди'}) | K/D: ${p.kd || '-'} | Rating: ${p.rating || '-'}</span>
                        <div class="row-actions">
                            <button onclick="openPlayerModalForEdit(${index})">Редагувати</button>
                            <button onclick="deletePlayer(${index})" class="btn-danger">Видалити</button>
                        </div>
                    </div>
                `;
            });
        }

        function addAdminPlayerTrophyInput(value = '') {
            const container = document.getElementById('adminPlayerTrophiesContainer');
            const wrapper = document.createElement('div');
            wrapper.style.display = 'flex';
            wrapper.style.gap = '8px';
            
            wrapper.innerHTML = `
                <input type="text" class="player-trophy-input" value="${value}" placeholder="URL іконки або назва трофею" style="flex: 1;">
                <button type="button" onclick="this.parentElement.remove()" class="btn-danger" style="padding: 0 10px;">✕</button>
            `;
            container.appendChild(wrapper);
        }

        function openPlayerModalForAdd() {
            document.getElementById('editPlayerIndex').value = '';
            document.getElementById('modalHeaderTitle').innerText = 'Додати нового гравця';

            document.getElementById('editPlayerName').value = '';
            document.getElementById('editPlayerTeam').value = '';
            document.getElementById('editPlayerRole').value = '';
            document.getElementById('editPlayerCountry').value = '';
            document.getElementById('editPlayerPhoto').value = '';
            document.getElementById('editPlayerRating').value = '';
            document.getElementById('editPlayerKd').value = '';
            document.getElementById('editPlayerImpact').value = '';
            document.getElementById('editPlayerAdr').value = '';

            document.getElementById('adminPlayerTrophiesContainer').innerHTML = '';
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function openPlayerModalForEdit(index) {
            document.getElementById('editPlayerIndex').value = index;
            document.getElementById('modalHeaderTitle').innerText = 'Редагувати гравця';
            const p = globalData.players[index];

            document.getElementById('editPlayerName').value = p.name || p.nickname || '';
            document.getElementById('editPlayerTeam').value = p.team || '';
            document.getElementById('editPlayerRole').value = p.role || '';
            document.getElementById('editPlayerCountry').value = p.country || '';
            document.getElementById('editPlayerPhoto').value = p.photo || '';
            document.getElementById('editPlayerRating').value = p.rating || '';
            document.getElementById('editPlayerKd').value = p.kd || '';
            document.getElementById('editPlayerImpact').value = p.impact || '';
            document.getElementById('editPlayerAdr').value = p.adr || '';

            const container = document.getElementById('adminPlayerTrophiesContainer');
            container.innerHTML = '';
            const trophies = p.trophies || p.cups || [];
            trophies.forEach(t => {
                const val = typeof t === 'object' && t !== null ? (t.icon || t.name || '') : t;
                addAdminPlayerTrophyInput(val);
            });

            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closePlayerModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        async function savePlayerFormData() {
            const indexStr = document.getElementById('editPlayerIndex').value;
            
            let trophies = [];
            document.querySelectorAll('.player-trophy-input').forEach(input => {
                if (input.value.trim() !== '') {
                    trophies.push(input.value.trim());
                }
            });

            const playerData = {
                name: document.getElementById('editPlayerName').value.trim(),
                nickname: document.getElementById('editPlayerName').value.trim(),
                team: document.getElementById('editPlayerTeam').value.trim(),
                role: document.getElementById('editPlayerRole').value.trim(),
                country: document.getElementById('editPlayerCountry').value.trim().toLowerCase(),
                photo: document.getElementById('editPlayerPhoto').value.trim(),
                rating: document.getElementById('editPlayerRating').value.trim(),
                kd: document.getElementById('editPlayerKd').value.trim(),
                impact: document.getElementById('editPlayerImpact').value.trim(),
                adr: document.getElementById('editPlayerAdr').value.trim(),
                trophies: trophies
            };

            if (!playerData.name) return alert('Введіть нікнейм гравця!');

            if (!globalData.players) globalData.players = [];

            if (indexStr === '') {
                // Додавання нового гравця
                globalData.players.push(playerData);
            } else {
                // Оновлення існуючого
                globalData.players[parseInt(indexStr)] = playerData;
            }

            await saveData();
            closePlayerModal();
            renderPlayersList();
            alert('Збережено успішно!');
        }

        async function deletePlayer(index) {
            if (confirm('Видалити гравця з бази?')) {
                globalData.players.splice(index, 1);
                await saveData();
                renderPlayersList();
            }
        }

        loadData();
    </script>
</body>
</html>
