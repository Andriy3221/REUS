<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | REUS (File Upload)</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
            --danger-color: #ff4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1, h2 {
            color: var(--text-color);
        }
        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        input, select {
            width: 100%;
            padding: 10px 15px;
            background: #1a222f;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        /* Стиль для поля завантаження файлу */
        .file-input-wrapper {
            margin-bottom: 15px;
            border: 1px dashed var(--border-color);
            padding: 10px;
            border-radius: 6px;
            background: #1a222f;
        }
        .file-input-wrapper label {
            display: block;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        .file-input-wrapper input[type="file"] {
            width: auto;
            border: none;
            padding: 5px;
            margin-bottom: 0;
            cursor: pointer;
        }
        button {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-danger {
            background: var(--danger-color);
            color: #fff;
            width: auto;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a222f;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        .status-msg {
            margin-top: 10px;
            font-weight: bold;
        }
        .preview-img {
            max-width: 50px;
            max-height: 50px;
            margin-left: 10px;
            border-radius: 4px;
            background: #000;
            object-fit: contain;
        }
        .info-box {
            background: #161c26;
            color: #ffcc00;
            border: 1px solid #ffcc00;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>⚙️ Панель керування REUS (Завантаження файлів)</h1>
        
        <div id="globalStatus" class="status-msg" style="color: var(--accent-color); margin-bottom: 20px;"></div>

        <!-- Додавання команди -->
        <div class="section-box">
            <h2>Додати команду</h2>
            <input type="text" id="teamName" placeholder="Назва команди (наприклад, Yami Esports)">
            
            <div class="file-input-wrapper">
                <label>Логотип команди (завантажити файл)</label>
                <input type="file" id="teamLogoFile" accept="image/*">
            </div>
            
            <input type="text" id="teamRank" placeholder="Рейтинг (наприклад, #1 або 1)">
            <button onclick="processAndAddTeam()">Зберегти команду</button>
        </div>

        <!-- Додавання гравця -->
        <div class="section-box">
            <h2>Додати гравця</h2>
            <select id="playerTeamSelect">
                <option value="">Оберіть команду</option>
            </select>
            <input type="text" id="playerName" placeholder="Нікнейм гравця (наприклад, oz1k)">
            
            <div class="file-input-wrapper">
                <label>Фото гравця (завантажити файл)</label>
                <input type="file" id="playerPhotoFile" accept="image/*">
            </div>
            
            <button onclick="processAndAddPlayer()">Зберегти гравця</button>
        </div>

        <!-- Додавання трансферу -->
        <div class="section-box">
            <h2>Додати трансфер</h2>
            <input type="text" id="transferText" placeholder="Текст трансферу">
            <button onclick="addTransfer()">Додати трансфер</button>
        </div>

        <!-- Список поточних даних -->
        <div class="section-box">
            <h2>Поточні дані в базі</h2>
            <div id="dbList">Завантаження...</div>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        let cloudData = {
            teams: [],
            players: [],
            transfers: []
        };

        // --- ФУНКЦІЇ РОБОТИ З БАЗОЮ ---

        async function fetchCloudData() {
            setSt("Завантаження даних із хмари...", "#8a99ad");
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                cloudData = result.record || { teams: [], players: [], transfers: [] };
                
                // Ініціалізація пустих масивів, якщо їх немає
                if(!cloudData.teams) cloudData.teams = [];
                if(!cloudData.players) cloudData.players = [];
                if(!cloudData.transfers) cloudData.transfers = [];

                updateUI();
                setSt("Дані успішно завантажено!", "var(--accent-color)");
            } catch (err) {
                console.error(err);
                setSt("Помилка завантаження з хмари!", "var(--danger-color)");
            }
        }

        async function saveCloudData() {
            setSt("Збереження у хмару...", "#ffaa00");
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(cloudData)
                });
                if (res.ok) {
                    setSt("Успішно збережено у хмару!", "var(--accent-color)");
                    updateUI();
                } else {
                    setSt("ПОМИЛКА ЗБЕРЕЖЕННЯ (можливо, перевищено ліміт 100КБ)!", "var(--danger-color)");
                }
            } catch (err) {
                console.error(err);
                setSt("Помилка мережі при збереженні!", "var(--danger-color)");
            }
        }

        function setSt(text, color) {
            const el = document.getElementById('globalStatus');
            el.innerText = text;
            el.style.color = color;
        }

        // --- ДОПОМІЖНА ФУНКЦІЯ КОНВЕРТАЦІЇ ФАЙЛУ В BASE64 ---
        function fileToBase64(fileInputId) {
            return new Promise((resolve, reject) => {
                const fileInput = document.getElementById(fileInputId);
                const file = fileInput.files[0];

                if (!file) {
                    resolve(null); // Якщо файл не вибрано
                    return;
                }

                // Перевірка на розмір файлу (дуже приблизна)
                if (file.size > 50000) { // Більше 50КБ
                     alert("Файл занадто великий (перевищує 50КБ). База переповниться. Краще використовуйте посилання (URL).");
                     reject('File too large');
                     return;
                }

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
            });
        }

        // --- ЛОГІКА ДОДАВАННЯ/ВИДАЛЕННЯ ---

        async function processAndAddTeam() {
            const name = document.getElementById('teamName').value.trim();
            const valveRank = document.getElementById('teamRank').value.trim() || '#1';

            if (!name) {
                alert('Введіть назву команди!');
                return;
            }

            try {
                // Конвертуємо логотип у Base64
                const base64Logo = await fileToBase64('teamLogoFile');
                
                // Додаємо в локальний масив
                cloudData.teams.push({ name, logo: base64Logo, valveRank });
                
                // Зберігаємо в хмару
                saveCloudData();

                // Очищаємо форму
                document.getElementById('teamName').value = '';
                document.getElementById('teamLogoFile').value = '';
                document.getElementById('teamRank').value = '';

            } catch (err) {
                console.error('Помилка завантаження файлу:', err);
                // Якщо помилка (наприклад, файл завеликий), не зберігаємо
            }
        }

        async function processAndAddPlayer() {
            const team = document.getElementById('playerTeamSelect').value;
            const name = document.getElementById('playerName').value.trim();

            if (!team || !name) {
                alert('Оберіть команду та введіть нікнейм гравця!');
                return;
            }

            try {
                // Конвертуємо фото гравця у Base64
                const base64Photo = await fileToBase64('playerPhotoFile');

                cloudData.players.push({ team, name, photo: base64Photo });
                
                saveCloudData();

                document.getElementById('playerName').value = '';
                document.getElementById('playerPhotoFile').value = '';

            } catch (err) {
                 console.error('Помилка завантаження файлу:', err);
            }
        }

        function addTransfer() {
            const text = document.getElementById('transferText').value.trim();
            if (!text) {
                alert('Введіть текст трансферу!');
                return;
            }
            cloudData.transfers.unshift(text);
            saveCloudData();
            document.getElementById('transferText').value = '';
        }

        function deleteTeam(index) {
            cloudData.teams.splice(index, 1);
            saveCloudData();
        }

        function deletePlayer(index) {
            cloudData.players.splice(index, 1);
            saveCloudData();
        }

        function deleteTransfer(index) {
            cloudData.transfers.splice(index, 1);
            saveCloudData();
        }

        // --- ОНОВЛЕННЯ ІНТЕРФЕЙСУ ---

        function updateUI() {
            const select = document.getElementById('playerTeamSelect');
            select.innerHTML = '<option value="">Оберіть команду</option>';
            cloudData.teams.forEach(t => {
                select.innerHTML += `<option value="${t.name}">${t.name}</option>`;
            });

            const list = document.getElementById('dbList');
            if (cloudData.teams.length === 0 && cloudData.players.length === 0 && cloudData.transfers.length === 0) {
                list.innerHTML = '<p style="color: var(--text-muted);">База даних поки порожня.</p>';
                return;
            }

            let html = '<h3>Команди:</h3>';
            cloudData.teams.forEach((t, i) => {
                // Додаємо прев'ю картинки, якщо вона є
                const previewHtml = t.logo ? `<img src="${t.logo}" class="preview-img" alt="logo">` : '';
                html += `<div class="item-row"><span><b>${t.name}</b> (${t.valveRank || '#1'}) ${previewHtml}</span> <button class="btn-danger" onclick="deleteTeam(${i})">Видалити</button></div>`;
            });

            html += '<h3>Гравці:</h3>';
            cloudData.players.forEach((p, i) => {
                 const previewHtml = p.photo ? `<img src="${p.photo}" class="preview-img" alt="photo">` : '';
                html += `<div class="item-row"><span><b>${p.name}</b> [команда: ${p.team}] ${previewHtml}</span> <button class="btn-danger" onclick="deletePlayer(${i})">Видалити</button></div>`;
            });

            html += '<h3>Трансфери:</h3>';
            cloudData.transfers.forEach((tr, i) => {
                html += `<div class="item-row"><span>${tr}</span> <button class="btn-danger"
