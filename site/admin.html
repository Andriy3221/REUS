<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | REUS</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(13, 17, 23, 0.9);
            --inner-card-bg: #111620;
            --border-color: #21262d;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8b949e;
            --danger-color: #ff4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1, h2 {
            color: var(--accent-color);
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: var(--inner-card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        input:focus, select:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        button {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }
        button:hover {
            opacity: 0.85;
        }
        .btn-danger {
            background: var(--danger-color);
            color: #fff;
        }
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--inner-card-bg);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .row-actions {
            display: flex;
            gap: 8px;
        }
        .row-actions button {
            padding: 6px 12px;
            width: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Адмін-панель REUS</h1>
        <a href="index.html" style="color: var(--accent-color); text-decoration: none; display: inline-block; margin-bottom: 20px;">← Назад на сайт</a>

        <!-- Видати трофей команді -->
        <div class="card">
            <h2>Видати трофей команді</h2>
            <div class="form-group">
                <label>Виберіть команду</label>
                <select id="trophyTeamSelect">
                    <option value="">Завантаження команд...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Назва турніру (наприклад, BLAST Premier)</label>
                <input type="text" id="trophyNameInput" placeholder="Назва турніру або досягнення">
            </div>
            <div class="form-group">
                <label>Іконка кубка (URL посилання або emoji 🏆)</label>
                <input type="text" id="trophyIconInput" value="🏆" placeholder="URL картинки або емодзі">
            </div>
            <button onclick="addTrophyToTeam()">Додати трофей</button>
        </div>

        <!-- Список команд -->
        <div class="card">
            <h2>Команди в базі</h2>
            <div id="teamsList" class="list-container">
                <div style="color: var(--text-muted);">Завантаження команд...</div>
            </div>
        </div>

        <!-- Список гравців -->
        <div class="card">
            <h2>Гравці в базі</h2>
            <div id="playersList" class="list-container">
                <div style="color: var(--text-muted);">Завантаження гравців...</div>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        let globalData = {};

        async function loadData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                globalData = result.record || result;
                if (globalData.record) globalData = globalData.record;

                renderTeamsList();
                renderPlayersList();
                updateTeamSelect();
            } catch (err) {
                console.error(err);
                alert('Помилка завантаження бази даних.');
            }
        }

        async function saveData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(globalData)
                });
                if (!res.ok) alert('Помилка збереження на сервері!');
            } catch (err) {
                console.error(err);
                alert('Помилка мережі при збереженні.');
            }
        }

        function updateTeamSelect() {
            const select = document.getElementById('trophyTeamSelect');
            const teams = globalData.teams || [];
            select.innerHTML = '<option value="">Оберіть команду</option>';
            teams.forEach(t => {
                select.innerHTML += `<option value="${t.name}">${t.name}</option>`;
            });
        }

        function renderTeamsList() {
            const teams = globalData.teams || [];
            const container = document.getElementById('teamsList');
            if (teams.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted);">Команд немає.</div>';
                return;
            }
            container.innerHTML = '';
            teams.forEach((t, index) => {
                container.innerHTML += `
                    <div class="item-row">
                        <span><b>${t.name}</b> (Трофеїв: ${(t.trophies || t.cups || []).length})</span>
                        <div class="row-actions">
                            <button onclick="deleteTeam(${index})" class="btn-danger">Видалити</button>
                        </div>
                    </div>
                `;
            });
        }

        function renderPlayersList() {
            const players = globalData.players || [];
            const container = document.getElementById('playersList');
            if (players.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted);">Гравців немає.</div>';
                return;
            }
            container.innerHTML = '';
            players.forEach((p, index) => {
                const pName = p.name || p.nickname || 'Гравець';
                container.innerHTML += `
                    <div class="item-row">
                        <span><b>${pName}</b> — Команда: ${p.team || 'Без команди'} | K/D: ${p.kd || '-'} | Rating: ${p.rating || '-'} | ADR: ${p.adr || '-'}</span>
                        <div class="row-actions">
                            <button onclick="deletePlayer(${index})" class="btn-danger">Видалити</button>
                        </div>
                    </div>
                `;
            });
        }

        async function addTrophyToTeam() {
            const teamName = document.getElementById('trophyTeamSelect').value;
            const trophyName = document.getElementById('trophyNameInput').value.trim();
            const trophyIcon = document.getElementById('trophyIconInput').value.trim() || '🏆';

            if (!teamName || !trophyName) {
                alert('Оберіть команду та введіть назву турніру!');
                return;
            }

            const teams = globalData.teams || [];
            const team = teams.find(t => t.name === teamName);
            if (team) {
                if (!team.trophies) team.trophies = [];
                team.trophies.push({
                    name: trophyName,
                    icon: trophyIcon
                });

                await saveData();
                alert('Трофей успішно додано команді!');
                document.getElementById('trophyNameInput').value = '';
                renderTeamsList();
            }
        }

        async function deleteTeam(index) {
            if (confirm('Видалити цю команду?')) {
                globalData.teams.splice(index, 1);
                await saveData();
                renderTeamsList();
                updateTeamSelect();
            }
        }

        async function deletePlayer(index) {
            if (confirm('Видалити цього гравця?')) {
                globalData.players.splice(index, 1);
                await saveData();
                renderPlayersList();
            }
        }

        loadData();
    </script>
</body>
</html>
