<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile | Reus Championship ❄️</title>
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: rgba(12, 18, 32, 0.92);
            --inner-card-bg: #0f172a;
            --border-color: #1e293b;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
            opacity: 0;
            animation: pageFadeIn 0.7s ease-out forwards;
        }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
            filter: hue-rotate(180deg) brightness(0.35);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(10, 20, 38, 0.75) 0%, rgba(6, 9, 19, 0.96) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .back-link {
            color: var(--text-color);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            border-radius: 10px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
        }
        .back-link:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow);
            transform: translateY(-2px);
        }
        .back-link:active {
            transform: scale(0.96);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            animation: cardPop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes cardPop {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .profile-avatar-container {
            width: 220px;
            height: 280px;
            border-radius: 16px;
            background: #080d1a;
            border: 2px solid var(--accent-color);
            overflow: hidden;
            box-shadow: 0 0 25px var(--accent-glow), inset 0 0 15px rgba(56, 189, 248, 0.2);
            flex-shrink: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 15%;
            position: relative;
            z-index: 2;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .profile-avatar-container:hover .profile-avatar {
            transform: scale(1.05);
        }

        .trophies-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
        }
        .trophy-item {
            background: var(--inner-card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .trophy-item:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }
        .trophy-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 18px;
            background: var(--inner-card-bg);
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s ease;
        }
        .stat-row:hover {
            border-color: var(--accent-color);
        }

        h2 {
            color: var(--accent-color);
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-shadow: 0 0 8px var(--accent-glow);
        }

        @media (max-width: 600px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
            .profile-avatar-container {
                width: 180px;
                height: 230px;
            }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="fon.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <div class="container">
        <a href="index.html" class="back-link">❄️ Назад до рейтингу</a>
        <div id="playerContent">
            <div style="color: var(--text-muted); text-align: center; padding: 40px;">Завантаження профілю... ❄️</div>
        </div>
    </div>

    <script>
        const BIN_ID = '6ad23f85ac6210605a379839';
        const API_KEY = '$2a$10$CISi1TUb8cLEgZ8iI9GtYu3KSoj1MZ7tOvzPKHVwtbZfwRFIJlR7G';

        async function loadPlayer() {
            const urlParams = new URLSearchParams(window.location.search);
            const playerName = urlParams.get('name');

            if (!playerName) {
                document.getElementById('playerContent').innerHTML = '<div style="color: var(--accent-color); text-align:center; padding:30px;">Гравець не вказаний у посиланні!</div>';
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                let cloudData = result.record?.record || result.record || result;

                const players = cloudData.players || [];
                const decodedName = decodeURIComponent(playerName).trim().toLowerCase();
                const player = players.find(p => (p.name || p.nickname || '').trim().toLowerCase() === decodedName);

                if (!player) {
                    document.getElementById('playerContent').innerHTML = `<div style="color: var(--accent-color); text-align:center; padding:30px;">Гравця "${decodeURIComponent(playerName)}" не знайдено в базі!</div>`;
                    return;
                }

                renderPlayer(player);
            } catch (err) {
                console.error(err);
                document.getElementById('playerContent').innerHTML = '<div style="color: var(--accent-color); text-align:center; padding:30px;">Помилка завантаження даних.</div>';
            }
        }

        function renderPlayer(p) {
            const pName = p.name || p.nickname || 'Гравець';
            const pPhoto = p.photo || p.avatar || p.image || 'https://via.placeholder.com/150';
            
            let trophiesHTML = '';
            const trophies = p.trophies || p.cups || [];
            
            if (trophies.length === 0) {
                trophiesHTML = '<div style="color: var(--text-muted); font-size: 0.9rem;">Немає досягнень</div>';
            } else {
                trophies.forEach(t => {
                    const tVal = typeof t === 'object' && t !== null ? (t.icon || t.name || '') : t;
                    
                    if (typeof tVal === 'string' && (tVal.startsWith('http://') || tVal.startsWith('https://') || tVal.startsWith('data:'))) {
                        trophiesHTML += `
                            <div class="trophy-item">
                                <img src="${tVal}" alt="trophy">
                            </div>
                        `;
                    } else {
                        trophiesHTML += `
                            <div class="trophy-item" style="font-size: 24px; display: flex; align-items: center; justify-content: center;">
                                ${tVal || '🏆'}
                            </div>
                        `;
                    }
                });
            }

            document.getElementById('playerContent').innerHTML = `
                <div class="card">
                    <div class="profile-header">
                        <div class="profile-avatar-container">
                            <img src="${pPhoto}" class="profile-avatar" alt="${pName}">
                        </div>
                        <div>
                            <div style="color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; font-weight: bold; letter-spacing: 0.8px;">${p.role || 'Rifler'}</div>
                            <h1 style="margin: 8px 0; color: var(--accent-color); text-shadow: 0 0 12px var(--accent-glow); font-size: 2.5rem; font-weight: 800;">${pName}</h1>
                            <div style="color: var(--text-muted); font-size: 1.05rem;">Команда: <b style="color: var(--text-color);">${p.team || 'Без команди'}</b></div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2>Статистика гравця</h2>
                    <div class="stat-row">
                        <span>K/D Ratio</span>
                        <b style="color: var(--accent-color);">${p.kd || p.stats?.kd || '-'}</b>
                    </div>
                    <div class="stat-row">
                        <span>Rating 2.0</span>
                        <b style="color: var(--accent-color);">${p.rating || p.stats?.rating || '-'}</b>
                    </div>
                    <div class="stat-row">
                        <span>Impact</span>
                        <b style="color: var(--accent-color);">${p.impact || p.stats?.impact || '-'}</b>
                    </div>
                    <div class="stat-row">
                        <span>ADR (Шкода за раунд)</span>
                        <b style="color: var(--accent-color);">${p.adr || p.stats?.adr || '-'}</b>
                    </div>
                </div>

                <div class="card">
                    <h2>Досягнення та кубки</h2>
                    <div class="trophies-grid">
                        ${trophiesHTML}
                    </div>
                </div>
            `;
        }

        loadPlayer();
    </script>
</body>
</html>
