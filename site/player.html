<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профіль гравця | REUS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .profile-card {
            background: #131820;
            border: 1px solid #1f2937;
            border-radius: 8px;
            display: flex;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .profile-image-side {
            background: #161c26;
            padding: 20px;
            text-align: center;
            width: 260px;
            border-right: 1px solid #1f2937;
        }
        .profile-image-side img {
            width: 100%;
            height: 280px;
            object-fit: contain;
            background: #111;
            border-radius: 6px;
        }
        .profile-info-side {
            padding: 30px;
            flex: 1;
        }
        .player-nickname {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            margin: 0 0 5px 0;
        }
        .player-fullname {
            color: #8a99ad;
            font-size: 1rem;
            margin-bottom: 25px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #1f2937;
            font-size: 0.95rem;
        }
        .info-label {
            color: #8a99ad;
        }
        .info-value {
            font-weight: bold;
            color: #00ff88;
        }
        /* Трофеї знизу */
        .trophies-section {
            background: #131820;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .trophy-item {
            font-size: 1.8rem;
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #8a99ad;
            text-decoration: none;
        }
        .back-link:hover {
            color: #00ff88;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <!-- Ліва колонка з фото -->
            <div class="profile-image-side">
                <img id="player-img" src="NoPhotoPlayer.jpg" alt="Player Photo">
            </div>

            <!-- Права колонка з інформацією -->
            <div class="profile-info-side">
                <h1 class="player-nickname" id="player-name">Нікнейм</h1>
                <div class="player-fullname">Кіберспортсмен CS2</div>

                <div class="info-row">
                    <span class="info-label">Current team</span>
                    <span class="info-value">Yami Esports</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Рейтинг (K/D)</span>
                    <span class="info-value">1.18</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Винрейт мап</span>
                    <span class="info-value">64%</span>
                </div>
            </div>
        </div>

        <!-- Блок трофеїв знизу в стилі HLTV -->
        <div class="trophies-section">
            <div class="trophy-item">🏆</div>
            <div>
                <div style="font-weight: bold; font-size: 1rem;">Переможець турнірів</div>
                <div style="color: #8a99ad; font-size: 0.85rem;">3 золоті медалі у складі Yami Esports</div>
            </div>
        </div>

        <a href="index.html" class="back-link">← Назад до рейтингу</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const playerName = urlParams.get('name');
        const playerImg = urlParams.get('img');

        if (playerName) {
            document.getElementById('player-name').innerText = playerName;
        }
        if (playerImg) {
            document.getElementById('player-img').src = playerImg;
        }
    </script>

</body>
</html>
