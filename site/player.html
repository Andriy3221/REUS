<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile | REUS</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #0d121b;
            --card-hover: #131a26;
            --header-bg: #101622;
            --border-color: #1a2332;
            --border-hover: #3b82f6;
            --accent-primary: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.25);
            --accent-green: #10b981;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --shadow-custom: 0 8px 30px rgba(0, 0, 0, 0.5);
            --neon-glow: 0 0 20px rgba(59, 130, 246, 0.15);
        }

        [data-theme="light"] {
            --bg-color: #f1f3f6;
            --card-bg: #ffffff;
            --card-hover: #f8fafc;
            --header-bg: #ffffff;
            --border-color: #e2e8f0;
            --border-hover: #2563eb;
            --accent-primary: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.15);
            --accent-green: #059669;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --shadow-custom: 0 4px 20px rgba(0, 0, 0, 0.08);
            --neon-glow: 0 0 20px rgba(37, 99, 235, 0.1);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-primary);
        }

        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 28px;
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-custom), var(--neon-glow);
            transition: all 0.3s ease;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border-color);
        }

        .profile-info h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .profile-meta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-flag {
            width: 24px;
            height: 16px;
            object-fit: cover;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-team {
            color: var(--accent-green);
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stats-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-custom);
        }

        .stats-header {
            padding: 16px 24px;
            background: var(--header-bg);
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-primary);
            border-bottom: 1px solid var(--border-color);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .stat-row:hover {
            background: var(--card-hover);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .stat-value {
            color: var(--accent-green);
            font-weight: 800;
            font-size: 1.1rem;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="main-container">
        <a href="index.html" class="back-link">← Назад до рейтингу</a>

        <div class="profile-card">
            <img id="playerImg" src="" alt="Player Avatar" class="profile-avatar" onerror="this.src='default_player.png'">
            <div class="profile-info">
                <h1 id="playerName">Завантаження...</h1>
                <div class="profile-meta">
                    <img id="playerFlag" src="" alt="" class="player-flag" style="display: none;">
                    <span id="playerTeam" class="player-team">REUS CHAMPIONSHIP</span>
                </div>
            </div>
        </div>

        <div class="stats-box">
            <div class="stats-header">Статистика гравця (HLTV style)</div>
            <div class="stat-row">
                <span class="stat-label">K/D Ratio</span>
                <span class="stat-value">1.18</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Rating 2.0</span>
                <span class="stat-value">1.14</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Headshot %</span>
                <span class="stat-value">54.2%</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Maps played</span>
                <span class="stat-value">142</span>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('reus_theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);

            // Отримуємо параметри з URL (name, img, country, team)
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name');
            const img = urlParams.get('img');
            const country = urlParams.get('country');
            const team = urlParams.get('team');

            if (name) {
                document.getElementById('playerName').innerText = name;
                document.title = name + ' | REUS Profile';
            } else {
                document.getElementById('playerName').innerText = 'Гравець не знайдений';
            }

            if (img) {
                document.getElementById('playerImg').src = img;
            }

            // Виведення реальної команди гравця
            const teamElement = document.getElementById('playerTeam');
            if (team && team !== 'null' && team !== 'undefined' && team.trim() !== '') {
                teamElement.innerText = team;
            } else {
                teamElement.innerText = 'REUS CHAMPIONSHIP';
            }

            // Налаштування прапора
            const flagElement = document.getElementById('playerFlag');
            if (country && country !== 'null' && country !== 'undefined') {
                const cleanCountry = country.toLowerCase();
                flagElement.src = `https://flagcdn.com/w40/${cleanCountry}.png`;
                flagElement.style.display = 'inline-block';
            } else {
                flagElement.style.display = 'none';
            }
        });
    </script>

</body>
</html>
