<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile | REUS</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: var(--text-color);
        }
        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px 8px 0 0;
            padding: 30px;
            display: flex;
            gap: 30px;
            align-items: center;
        }
        .player-photo {
            width: 180px;
            height: 180px;
            border-radius: 8px;
            object-fit: cover;
            background: #1a222f;
            border: 1px solid var(--border-color);
        }
        .player-info h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .player-role {
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        .player-team {
            color: var(--accent-color);
            font-weight: bold;
            text-decoration: none;
        }
        .player-team:hover {
            text-decoration: underline;
        }

        /* Стиль трофеїв HLTV (сітка знизу профілю) */
        .trophies-section {
            background: #0f141d;
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 8px 8px;
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .trophy-cell {
            position: relative;
            background: #161d27;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
        }
        .trophy-cell img {
            max-height: 40px;
            max-width: 50px;
            object-fit: contain;
        }
        /* Бейдж з кількістю або роком внизу комірки як на HLTV */
        .trophy-badge {
            position: absolute;
            bottom: 3px;
            right: 4px;
            background: #1f2937;
            color: var(--text-color);
            font-size: 0.65rem;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: bold;
        }
        /* Тултип (назва трофею при наведенні) */
        .trophy-cell:hover::after {
            content: attr(data-title);
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            white-space: nowrap;
            border: 1px solid var(--border-color);
            z-index: 10;
            pointer-events: none;
        }

        .stats-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px 30px;
        }
        .stats-box h3 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(31, 41, 55, 0.5);
            font-size: 1.05rem;
        }
        .stat-row:last-child {
            border-bottom: none;
        }
        .stat-value {
            font-weight: bold;
            color: var(--accent-color);
        }
        .flag-icon {
            width: 28px;
            height: 20px;
            object-fit: cover;
            border-radius: 3px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <a href="index.html" class="back-link">← Назад до рейтингу</a>

        <div id="playerContent">
            <p style="color: var(--text-muted);">Завантаження профілю гравця...</p>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        async function loadPlayerData() {
            const urlParams = new URLSearchParams(window.location.search);
            const playerName = urlParams.get('name');

            if (!playerName) {
                document.getElementById('playerContent').innerHTML = '<p style="color: #ff4444;">Гравця не вказано.</p>';
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const data = result.record || {};
                const players = data.players || [];
                const globalTrophies = data.trophies || [];

                const player = players.find(p => p.name.toLowerCase() === playerName.toLowerCase());

                if (!player) {
                    document.getElementById('playerContent').innerHTML = '<p style="color: #ff4444;">Гравця не знайдено.</p>';
                    return;
                }

                // Формуємо блок трофеїв у стилі HLTV (панель знизу)
                let trophiesHtml = '';
                if (player.trophies && Array.isArray(player.trophies) && player.trophies.length > 0) {
                    let cells = '';
                    player.trophies.forEach(iconUrl => {
                        const foundTr = globalTrophies.find(tr => tr.icon === iconUrl);
                        const title = foundTr ? foundTr.name : 'Трофей';
                        cells += `
                            <div class="trophy-cell" data-title="${title}">
                                <img src="${iconUrl}" alt="${title}" onerror="this.style.display='none'">
                                <div class="trophy-badge">🏆</div>
                            </div>
                        `;
                    });
                    trophiesHtml = `<div class="trophies-section">${cells}</div>`;
                }

                const countryCode = (player.country || 'ua').toLowerCase();
                const flagTag = `<img src="https://flagcdn.com/w40/${countryCode}.png" class="flag-icon" alt="${countryCode}">`;
                const photoSrc = player.photo || 'https://via.placeholder.com/180';

                document.getElementById('playerContent').innerHTML = `
                    <div class="profile-card">
                        <img src="${photoSrc}" class="player-photo" alt="${player.name}" onerror="this.src='https://via.placeholder.com/180'">
                        <div class="player-info" style="width: 100%;">
                            <div class="player-role">Pro Player</div>
                            <h1>${flagTag} ${player.name}</h1>
                            
                            <div style="margin-top: 15px;">
                                <div class="player-role">CURRENT TEAM</div>
                                <a href="team.html?name=${encodeURIComponent(player.team)}" class="player-team">${player.team}</a>
                            </div>
                        </div>
                    </div>

                    ${trophiesHtml}

                    <div class="stats-box">
                        <h3>СТАТИСТИКА ГРАВЦЯ</h3>
                        <div class="stat-row"><span>K/D Ratio</span><span class="stat-value">${player.kd || '1.00'}</span></div>
                        <div class="stat-row"><span>Rating 2.0</span><span class="stat-value">${player.rating || '1.00'}</span></div>
                        <div class="stat-row"><span>Headshot %</span><span class="stat-value">${player.hs || '50%'}</span></div>
                        <div class="stat-row"><span>Maps played</span><span class="stat-value">${player.maps || '100'}</span></div>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                document.getElementById('playerContent').innerHTML = '<p style="color: #ff4444;">Помилка завантаження профілю.</p>';
            }
        }

        loadPlayerData();
    </script>
</body>
</html>
