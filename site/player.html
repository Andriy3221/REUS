<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile | REUS</title>
    <style>
        :root {
            --card-bg: rgba(13, 17, 23, 0.92);
            --inner-card-bg: #111620;
            --border-color: #21262d;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8b949e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            margin: 0;
            padding: 30px;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* ВІДЕО-ФОН */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
        }

        /* ЗАТЕМНЕННЯ ФОНУ (можеш міняти opacity від 0.3 до 0.8) */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 15, 0.75);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            background: var(--inner-card-bg);
            border: 2px solid var(--accent-color);
            object-fit: cover;
        }
        .trophies-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
        }
        .trophy-item {
            background: var(--inner-card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .trophy-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .back-link {
            color: var(--text-color);
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            border-radius: 8px;
            transition: border-color 0.2s;
        }
        .back-link:hover {
            border-color: var(--accent-color);
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            background: var(--inner-card-bg);
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        h2 {
            color: var(--accent-color);
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- ВІДЕО ФОН -->
    <video autoplay muted loop playsinline class="bg-video">
        <source src="fon.mp4" type="video/mp4">
    </video>

    <!-- ЗАТЕМНЕННЯ -->
    <div class="bg-overlay"></div>

    <div class="container">
        <a href="index.html" class="back-link">← Назад до рейтингу</a>
        <div id="playerContent">
            <div style="color: var(--text-muted); text-align: center; padding: 40px;">Завантаження профілю...</div>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        async function loadPlayer() {
            const urlParams = new URLSearchParams(window.location.search);
            const playerName = urlParams.get('name');

            if (!playerName) {
                document.getElementById('playerContent').innerHTML = '<div style="color: #ff4444;">Гравець не вказаний у посиланні!</div>';
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                let data = result.record || result;
                if (data.record) data = data.record;

                const players = data.players || [];
                const player = players.find(p => (p.name || p.nickname || '').toLowerCase() === playerName.toLowerCase());

                if (!player) {
                    document.getElementById('playerContent').innerHTML = '<div style="color: #ff4444;">Гравця не знайдено в базі!</div>';
                    return;
                }

                renderPlayer(player);
            } catch (err) {
                console.error(err);
                document.getElementById('playerContent').innerHTML = '<div style="color: #ff4444;">Помилка завантаження даних.</div>';
            }
        }

        function renderPlayer(p) {
            const pName = p.name || p.nickname || 'Гравець';
            const pPhoto = p.photo || 'https://via.placeholder.com/100?text=No+Photo';
            
            let trophiesHTML = '';
            const trophies = p.trophies || p.cups || [];
            
            if (trophies.length === 0) {
                trophiesHTML = '<div style="color: var(--text-muted); font-size: 0.9rem;">Немає досягнень</div>';
            } else {
                trophies.forEach(t => {
                    const tVal = typeof t === 'object' && t !== null ? (t.icon || t.name || '') : t;
                    
                    if (typeof tVal === 'string' && (tVal.startsWith('http://') || tVal.startsWith('https://') || tVal.startsWith('data:'))) {
                        trophiesHTML += `
                            <div class="trophy-item">
                                <img src="${tVal}" alt="trophy">
                            </div>
                        `;
                    } else {
                        trophiesHTML += `
                            <div class="trophy-item" style="font-size: 24px; display: flex; align-items: center; justify-content: center;">
                                ${tVal || '🏆'}
                            </div>
                        `;
                    }
                });
            }

            document.getElementById('playerContent').innerHTML = `
                <div class="card">
                    <div class="profile-header">
                        <img src="${pPhoto}" class="profile-avatar" alt="${pName}">
                        <div>
                            <div style="color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; font-weight: bold;">${p.role || 'Rifler'}</div>
                            <h1 style="margin: 5px 0; color: var(--accent-color);">${pName}</h1>
                            <div style="color: var(--text-muted); font-size: 0.95rem;">Команда: <b style="color: var(--text-color);">${p.team || 'Без команди'}</b></div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2>Статистика гравця</h2>
                    <div class="stat-row">
                        <span>K/D Ratio</span>
                        <b style="color: var(--accent-color);">${p.kd || '-'}</b>
                    </div>
                    <div class="stat-row">
                        <span>Rating 2.0</span>
                        <b style="color: var(--accent-color);">${p.rating || '-'}</b>
                    </div>
                    <div class="stat-row">
                        <span>Impact</span>
                        <b style="color: var(--accent-color);">${p.impact || '-'}</b>
                    </div>
                    <div class="stat-row">
                        <span>ADR (Шкода за раунд)</span>
                        <b style="color: var(--accent-color);">${p.adr || '-'}</b>
                    </div>
                </div>

                <div class="card">
                    <h2>Досягнення та кубки</h2>
                    <div class="trophies-grid">
                        ${trophiesHTML}
                    </div>
                </div>
            `;
        }

        loadPlayer();
    </script>
</body>
</html>
