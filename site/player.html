<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reus Championship - Player Ranking</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
            --danger-color: #ff4444;
            --mini-card-bg: #1a222f;
        }

        [data-theme="light"] {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --accent-color: #00b359;
            --text-color: #1a202c;
            --text-muted: #718096;
            --danger-color: #e53e3e;
            --mini-card-bg: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .main-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .navbar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.35rem;
            font-weight: bold;
        }

        .logo-img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--mini-card-bg);
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-btn {
            background: var(--mini-card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            text-decoration: none;
            transition: border-color 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            border-color: var(--accent-color);
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 1rem;
            margin-bottom: 25px;
            box-sizing: border-box;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--accent-color);
        }

        .section-header-title {
            font-size: 1.3rem;
            color: var(--accent-color);
            margin: 30px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
        }

        .player-row-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.2s;
        }

        .player-row-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .player-info-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .rank-number {
            color: #f39c12;
            font-weight: bold;
            font-size: 1.2rem;
            min-width: 30px;
        }

        .player-avatar-small {
            width: 45px;
            height: 45px;
            background: var(--mini-card-bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .player-avatar-small img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .player-details h3 {
            margin: 0 0 4px 0;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-team-name {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .player-stats-right {
            display: flex;
            gap: 25px;
            align-items: center;
            text-align: right;
        }

        .stat-group {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-val {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .mvp-val {
            color: #f39c12;
        }

        .flag-icon {
            width: 20px;
            height: 14px;
            object-fit: cover;
            border-radius: 2px;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="navbar">
            <div class="logo-area">
                <img src="REUS.png" alt="REUS Logo" class="logo-img" onerror="this.style.display='none'"> 
                <span>Reus Prospects</span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-btn">Рейтинг команд</a>
                <a href="players.html" class="nav-btn active">Рейтинг гравців</a>
                <button class="nav-btn" onclick="toggleTheme()" id="themeBtn">☀️</button>
            </div>
        </div>

        <input type="text" id="searchInput" class="search-box" placeholder="Пошук гравця або команди..." oninput="filterPlayers()">

        <h2 class="section-header-title">Рейтинг гравців (Player Ranking)</h2>
        
        <div id="playersContainer">
            <div class="loading">Завантаження гравців із хмари...</div>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        let globalPlayers = [];

        function initTheme() {
            const savedTheme = localStorage.getItem('reus_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeBtn').innerText = savedTheme === 'light' ? '🌙' : '☀️';
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('reus_theme', newTheme);
            document.getElementById('themeBtn').innerText = newTheme === 'light' ? '🌙' : '☀️';
        }

        initTheme();

        async function fetchPlayersData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const rawRecord = result.record || result;
                const cloudData = rawRecord.record || rawRecord;

                globalPlayers = cloudData.players || [];
                globalPlayers.sort((a, b) => (parseInt(b.points) || 0) - (parseInt(a.points) || 0));

                renderPlayers(globalPlayers);
            } catch (err) {
                console.error(err);
                document.getElementById('playersContainer').innerHTML = '<div class="loading" style="color: var(--danger-color);">Помилка завантаження даних гравців.</div>';
            }
        }

        function renderPlayers(players) {
            const container = document.getElementById('playersContainer');
            if (players.length === 0) {
                container.innerHTML = '<div class="loading">Ще немає доданих гравців.</div>';
                return;
            }

            let html = '';
            players.forEach((p, index) => {
                const flagImg = p.country ? `<img src="https://flagcdn.com/24x18/${p.country.toLowerCase()}.png" class="flag-icon" alt="${p.country}">` : '';
                const defaultSvg = `<svg width="25" height="25" fill="var(--text-muted)" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
                
                const avatarContent = p.photo && p.photo.trim() !== '' 
                    ? `<img src="${p.photo}" onerror="this.parentElement.innerHTML='${defaultSvg.replace(/"/g, '&quot;')}'">` 
                    : defaultSvg;

                const safeName = encodeURIComponent(p.name);
                const mvpCount = p.mvp || p.trophiesCount || 0;

                html += `
                    <div class="player-row-card" onclick="window.location.href='player.html?name=${safeName}'" data-search="${p.name.toLowerCase()} ${p.team ? p.team.toLowerCase() : ''}">
                        <div class="player-info-left">
                            <div class="rank-number">#${index + 1}</div>
                            <div class="player-avatar-small">${avatarContent}</div>
                            <div class="player-details">
                                <h3>${flagImg} ${p.name}</h3>
                                <span class="player-team-name">${p.team || 'Без команди'}</span>
                            </div>
                        </div>
                        <div class="player-stats-right">
                            <div class="stat-group">
                                <span class="stat-label">MVP</span>
                                <span class="stat-val mvp-val">${mvpCount}</span>
                            </div>
                            <div class="stat-group">
                                <span class="stat-label">Rating pts</span>
                                <span class="stat-val">${p.points || 0}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function filterPlayers() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.player-row-card');

            cards.forEach(card => {
                const searchData = card.getAttribute('data-search');
                if (searchData.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        fetchPlayersData();
    </script>
</body>
</html>
