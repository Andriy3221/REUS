<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile | REUS</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #0d121b;
            --card-hover: #131a26;
            --header-bg: #101622;
            --border-color: #1a2332;
            --border-hover: #3b82f6;
            --accent-primary: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.25);
            --accent-green: #10b981;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --shadow-custom: 0 8px 30px rgba(0, 0, 0, 0.5);
            --neon-glow: 0 0 20px rgba(59, 130, 246, 0.15);
        }

        [data-theme="light"] {
            --bg-color: #f1f3f6;
            --card-bg: #ffffff;
            --card-hover: #f8fafc;
            --header-bg: #ffffff;
            --border-color: #e2e8f0;
            --border-hover: #2563eb;
            --accent-primary: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.15);
            --accent-green: #059669;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --shadow-custom: 0 4px 20px rgba(0, 0, 0, 0.08);
            --neon-glow: 0 0 20px rgba(37, 99, 235, 0.1);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-primary);
        }

        /* Стиль профілю у форматі oz1k */
        .profile-layout {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-custom), var(--neon-glow);
            margin-bottom: 24px;
        }

        .profile-avatar-box {
            width: 320px;
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid var(--border-color);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .profile-avatar {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 8px;
        }

        .profile-details {
            flex: 1;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .player-header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .player-flag {
            width: 28px;
            height: 20px;
            object-fit: cover;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-details h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .player-sub {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .info-item label {
            display: block;
            color: var(--text-muted);
            font-size: 0.82rem;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .info-item span {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .info-item .team-name-val {
            color: var(--accent-green);
        }

        /* Блок статистики (HLTV style) внизу */
        .stats-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-custom);
        }

        .stats-header {
            padding: 16px 24px;
            background: var(--header-bg);
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-primary);
            border-bottom: 1px solid var(--border-color);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .stat-row:hover {
            background: var(--card-hover);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .stat-value {
            color: var(--accent-green);
            font-weight: 800;
            font-size: 1.1rem;
        }

        @media(max-width: 768px) {
            .profile-layout {
                flex-direction: column;
            }
            .profile-avatar-box {
                width: 100%;
                height: 250px;
            }
            .profile-avatar {
                height: 220px;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <div class="main-container">
        <a href="index.html" class="back-link">← Назад до рейтингу</a>

        <!-- Профіль у стилі oz1k -->
        <div class="profile-layout">
            <div class="profile-avatar-box">
                <img id="playerImg" src="" alt="Player Avatar" class="profile-avatar" onerror="this.src='default_player.png'">
            </div>
            <div class="profile-details">
                <div class="player-header-top">
                    <img id="playerFlag" src="" alt="" class="player-flag" style="display: none;">
                    <span class="player-sub" style="margin:0;">Pro Player</span>
                </div>
                <h1 id="playerName">Завантаження...</h1>
                <div class="player-sub" style="margin-top: 4px; margin-bottom: 20px;">Reus Championship Participant</div>

                <div class="info-grid">
                    <div class="info-item">
                        <label>Current team</label>
                        <span id="playerTeam" class="team-name-val">No team</span>
                    </div>
                    <div class="info-item">
                        <label>Prize money</label>
                        <span>0 ₴</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Статистика внизу -->
        <div class="stats-box">
            <div class="stats-header">Статистика гравця (HLTV style)</div>
            <div class="stat-row">
                <span class="stat-label">K/D Ratio</span>
                <span class="stat-value">1.18</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Rating 2.0</span>
                <span class="stat-value">1.14</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Headshot %</span>
                <span class="stat-value">54.2%</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Maps played</span>
                <span class="stat-value">142</span>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('reus_theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);

            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name');
            const img = urlParams.get('img');
            const country = urlParams.get('country');
            const team = urlParams.get('team');

            if (name) {
                document.getElementById('playerName').innerText = name;
                document.title = name + ' | REUS Profile';
            } else {
                document.getElementById('playerName').innerText = 'Гравець не знайдений';
            }

            if (img) {
                document.getElementById('playerImg').src = img;
            }

            const teamElement = document.getElementById('playerTeam');
            if (team && team !== 'null' && team !== 'undefined' && team.trim() !== '') {
                teamElement.innerText = team;
            } else {
                teamElement.innerText = 'No team';
            }

            const flagElement = document.getElementById('playerFlag');
            if (country && country !== 'null' && country !== 'undefined') {
                const cleanCountry = country.toLowerCase();
                flagElement.src = `https://flagcdn.com/w40/${cleanCountry}.png`;
                flagElement.style.display = 'inline-block';
            } else {
                flagElement.style.display = 'none';
            }
        });
    </script>

</body>
</html>
