<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile | REUS</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --inner-card-bg: #19233c;
            --border-color: #2a3655;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px;
            position: relative;
            overflow-x: hidden;
        }
        /* Анімований фон (частинки/крапки) */
        .bg-animation {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #111b33 0%, #0b0f19 100%);
        }
        .particle {
            position: absolute;
            background: rgba(0, 255, 136, 0.15);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-800px) rotate(360deg); opacity: 0; }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            background: var(--inner-card-bg);
            border: 2px solid var(--accent-color);
            object-fit: cover;
        }
        .trophies-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
        }
        .trophy-item {
            background: var(--inner-card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .trophy-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .back-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 20px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            background: var(--inner-card-bg);
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- Анімований фон -->
    <div class="bg-animation" id="bgAnimation"></div>

    <div class="container">
        <a href="index.html" class="back-link">← Назад до рейтингу</a>
        <div id="playerContent">
            <div style="color: var(--text-muted); text-align: center; padding: 40px;">Завантаження профілю...</div>
        </div>
    </div>

    <script>
        // Генерація анімованих часток на фоні
        const bg = document.getElementById('bgAnimation');
        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            const size = Math.random() * 4 + 2;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}%`;
            p.style.bottom = `${Math.random() * -100}px`;
            p.style.animationDuration = `${Math.random() * 10 + 10}s`;
            p.style.animationDelay = `${Math.random() * 5}s`;
            bg.appendChild(p);
        }

        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        async function loadPlayer() {
            const urlParams = new URLSearchParams(window.location.search);
            const playerName = urlParams.get('name');

            if (!playerName) {
                document.getElementById('playerContent').innerHTML = '<div style="color: #ef4444;">Гравець не вказаний у посиланні!</div>';
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                let data = result.record || result;
                if (data.record) data = data.record;

                const players = data.players || [];
                const player = players.find(p => (p.name || p.nickname || '').toLowerCase() === playerName.toLowerCase());

                if (!player) {
                    document.getElementById('playerContent').innerHTML = '<div style="color: #ef4444;">Гравця не знайдено в базі!</div>';
                    return;
                }

                renderPlayer(player);
            } catch (err) {
                console.error(err);
                document.getElementById('playerContent').innerHTML = '<div style="color: #ef4444;">Помилка завантаження даних.</div>';
            }
        }

        function renderPlayer(p) {
            const pName = p.name || p.nickname || 'Гравець';
            const pPhoto = p.photo || 'https://via.placeholder.com/100?text=No+Photo';
            
            let trophiesHTML = '';
            const trophies = p.trophies || p.cups || [];
            
            if (trophies.length === 0) {
                trophiesHTML = '<div style="color: var(--text-muted); font-size: 0.9rem;">Немає досягнень</div>';
            } else {
                trophies.forEach(t => {
                    const tVal = typeof t === 'object' && t !== null ? (t.icon || t.name || '') : t;
                    
                    if (typeof tVal === 'string' && (tVal.startsWith('http://') || tVal.startsWith('https://') || tVal.startsWith('data:'))) {
                        trophiesHTML += `
                            <div class="trophy-item">
                                <img src="${tVal}" alt="trophy">
                            </div>
                        `;
                    } else {
                        trophiesHTML += `
                            <div class="trophy-item" style="font-size: 24px; display: flex; align-items: center; justify-content: center;">
                                ${tVal || '🏆'}
                            </div>
                        `;
                    }
                });
            }

            document.getElementById('playerContent').innerHTML = `
                <div class="card">
                    <div class="profile-header">
                        <img src="${pPhoto}" class="profile-avatar" alt="${pName}">
                        <div>
                            <div style="color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; font-weight: 600;">${p.role || 'Rifler'}</div>
                            <h1 style="margin: 5px 0; color: var(--accent-color);">${pName}</h1>
                            <div style="color: var(--text-muted); font-size: 0.95rem;">Команда: <b style="color: var(--text-color);">${p.team || 'Без команди'}</b></div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2 style="margin-top: 0; font-size: 1.2rem; margin-bottom: 15px; color: var(--accent-color);">Статистика гравця</h2>
                    <div class="stat-row">
                        <span>K/D Ratio</span>
                        <b style="color: var(--accent-color);">${p.kd || '-'}</b>
                    </div>
                    <div class="stat-row">
                        <span>Rating 2.0</span>
                        <b style="color: var(--accent-color);">${p.rating || '-'}</b>
                    </div>
                    <div class="stat-row">
                        <span>Impact</span>
                        <b style="color: var(--accent-color);">${p.impact || '-'}</b>
                    </div>
                    <div class="stat-row">
                        <span>ADR (Шкода за раунд)</span>
                        <b style="color: var(--accent-color);">${p.adr || '-'}</b>
                    </div>
                </div>

                <div class="card">
                    <h2 style="margin-top: 0; font-size: 1.2rem; margin-bottom: 10px; color: var(--accent-color);">Досягнення та кубки</h2>
                    <div class="trophies-grid">
                        ${trophiesHTML}
                    </div>
                </div>
            `;
        }

        loadPlayer();
    </script>
</body>
</html>
