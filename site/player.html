<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гравець | REUS</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
        }

        [data-theme="light"] {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --border-color: #d1d5db;
            --accent-color: #00a859;
            --text-color: #111827;
            --text-muted: #6b7280;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-color);
        }

        .player-profile-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 25px;
        }

        .player-avatar {
            width: 120px;
            height: 120px;
            object-fit: contain;
            background: #111;
            border-radius: 8px;
        }

        .player-info h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
        }

        .player-team-tag {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.1rem;
            text-decoration: none;
        }

        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 1rem;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--text-muted);
        }

        .stat-value {
            font-weight: bold;
            color: var(--accent-color);
        }
    </style>
</head>
<body data-theme="dark">

    <div class="main-container">
        <a href="index.html" class="back-link">← Назад до рейтингу</a>

        <div class="player-profile-card">
            <img id="playerPhoto" src="" alt="" class="player-avatar" onerror="this.src='https://via.placeholder.com/120?text=No+Photo'">
            <div class="player-info">
                <h1 id="playerName">Завантаження...</h1>
                <a href="#" id="playerTeamLink" class="player-team-tag">-</a>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">Статистика гравця (HLTV style)</div>
            <div class="stat-row">
                <span class="stat-label">K/D Ratio</span>
                <span class="stat-value" id="statKd">-</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Rating 2.0</span>
                <span class="stat-value" id="statRating">-</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Headshot %</span>
                <span class="stat-value" id="statHs">-</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Maps played</span>
                <span class="stat-value" id="statMaps">-</span>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        const savedTheme = localStorage.getItem('reus_theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);

        const urlParams = new URLSearchParams(window.location.search);
        const targetPlayerName = urlParams.get('name');

        async function loadPlayerData() {
            if (!targetPlayerName) {
                document.getElementById('playerName').innerText = "Гравця не знайдено";
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const data = result.record || {};
                const players = data.players || [];

                // Шукаємо гравця за нікнеймом (ігноруємо регістр літер)
                const player = players.find(p => p.name && p.name.toLowerCase() === targetPlayerName.toLowerCase());

                if (player) {
                    document.getElementById('playerName').innerText = player.name;
                    
                    const photoImg = document.getElementById('playerPhoto');
                    if (player.photo) {
                        photoImg.src = player.photo;
                    }

                    const teamLink = document.getElementById('playerTeamLink');
                    teamLink.innerText = player.team || 'Без команди';
                    teamLink.href = `team.html?name=${encodeURIComponent(player.team || '')}`;

                    // Заповнюємо статистику з хмари
                    document.getElementById('statKd').innerText = player.kd || '-';
                    document.getElementById('statRating').innerText = player.rating || '-';
                    document.getElementById('statHs').innerText = player.hs || '-';
                    document.getElementById('statMaps').innerText = player.maps || '-';
                } else {
                    document.getElementById('playerName').innerText = targetPlayerName;
                    document.getElementById('playerTeamLink').innerText = "Команду не знайдено в базі";
                }

            } catch (err) {
                console.error("Помилка завантаження гравця:", err);
                document.getElementById('playerName').innerText = "Помилка завантаження";
            }
        }

        loadPlayerData();
    </script>
</body>
</html>
