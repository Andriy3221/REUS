<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг гравців | REUS</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131820;
            --border-color: #1f2937;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .back-link:hover { color: var(--text-color); }
        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--text-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .player-card {
            background: #1a222f;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.2s;
        }
        .player-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-3px);
        }
        .player-avatar {
            width: 100%;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .player-avatar img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .player-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .player-team {
            font-size: 0.85rem;
            color: var(--accent-color);
        }
        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <a href="index.html" class="back-link">← Назад на головну</a>
        <div class="section-box">
            <div class="section-title">Список усіх гравців</div>
            <div id="players-grid" class="players-grid">
                <div class="loading">Завантаження гравців...</div>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = '6a8b3dffda38895dfe079cb1';
        const API_KEY = '$2a$10$6Adzn8zk89sLiPDw77z2N.yvSIbiyPSVqKuR/rhFxmMH0syerf4C6';

        async function fetchAllPlayers() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await res.json();
                const rawRecord = result.record || result;
                const cloudData = rawRecord.record || rawRecord;
                
                const players = cloudData.players || [];
                const container = document.getElementById('players-grid');

                if (players.length === 0) {
                    container.innerHTML = '<div style="color: var(--text-muted);">Гравців поки немає</div>';
                    return;
                }

                let html = '';
                players.forEach(p => {
                    const defaultSvg = `<svg width="45" height="45" fill="#8a99ad" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
                    const avatar = p.photo && p.photo.trim() !== '' ? `<img src="${p.photo}" onerror="this.parentElement.innerHTML='${defaultSvg.replace(/"/g, '&quot;')}'">` : defaultSvg;

                    html += `
                        <div class="player-card" onclick="window.location.href='player.html?name=${encodeURIComponent(p.name)}'">
                            <div class="player-avatar">${avatar}</div>
                            <div class="player-name">${p.name}</div>
                            <div class="player-team">${p.team || 'Без команди'}</div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                document.getElementById('players-grid').innerHTML = '<div style="color: #ff4444;">Помилка завантаження даних.</div>';
            }
        }

        fetchAllPlayers();
    </script>
</body>
</html>
